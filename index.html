    ? `${model.model_name} · 实时调用${modelLatency(model)}`
    : model
      ? `离线向量回放 · 实时接口已自动兜底`
      : "等待运行";
  const stages = [
    ["file-input", "01", "案件需求编码", "画像字段转为检索文本"],
    ["orbit", "02", "Embedding召回", "在人员能力库中检索Top-K"],
    ["sliders-horizontal", "03", "业务规则精排", "能力需求与经验证据逐项比较"],
    ["list-ordered", "04", "形成候选顺序", "输出分数构成与能力缺口"],
  ];
  return `<section class="match-pipeline">
    <header><div><span>MODEL PIPELINE</span><strong>人案匹配计算链路</strong></div><span class="status-pill ${model?.ready ? "status-teal" : "status-blue"}">${modelCopy}</span></header>
    <div class="match-pipeline-steps">${stages.map(([iconName, number, label, detail], index) => `<div class="${result ? "is-complete" : index === 0 ? "is-ready" : ""}">
      <span class="match-step-icon">${icon(iconName)}</span>
      <b>${number}</b>
      <section><strong>${label}</strong><small>${detail}</small></section>
      ${index < stages.length - 1 ? icon("arrow-right", "match-step-arrow") : icon(result ? "check" : "ellipsis")}

  </section>`;
}

function renderMatchResult(result, item) {
  const semanticOrder = [...result.candidates].sort((left, right) => right.scores.semantic - left.scores.semantic);
  const recommended = result.recommended;
  const formulaSemantic = (recommended.scores.semantic * .28).toFixed(1);
  const formulaStructured = (recommended.scores.structured * .72).toFixed(1);
  const strongest = Object.entries(recommended.dimensions).sort((left, right) => right[1].contribution - left[1].contribution)[0];
  const caseExpertise = recommended.staff.expertise[item.case_type] ?? recommended.staff.expertise.其他;
  return `<section class="match-result">
    <div class="match-recall-band">
      <header><div><span>STEP 02</span><strong>Embedding召回结果</strong><small>按案件需求与人员能力描述的语义相似度召回Top-${semanticOrder.length}</small></div><code>cosine（案件向量，人员向量）×100</code></header>
      <div class="match-recall-list">${semanticOrder.map((candidate, index) => {
        const finalRank = result.candidates.findIndex((entry) => entry.staff.id === candidate.staff.id) + 1;
        return `<div><span>${index + 1}</span><section><strong>${candidate.staff.name}</strong><small>召回位次 ${index + 1}${finalRank !== index + 1 ? ` · 精排后第${finalRank}` : ""}</small><i><b style="width:${candidate.scores.semantic}%"></b></i></section><em>${candidate.scores.semantic}</em></div>`;
      }).join("")}</div>
    </div>
    <div class="match-rerank-head">
      <div><span>STEP 03—04</span><strong>候选人员业务精排与比较</strong><small>不重复完整人员画像，只展示与当前案件直接相关的能力证据</small></div>
      <code>${escapeHtml(result.formula.match)}</code>
    </div>
    <div class="match-candidate-list">${result.candidates.map((candidate, index) => renderMatchCandidate(candidate, index, semanticOrder, item)).join("")}</div>
    <section class="match-decision">
      <div class="match-decision-person">
        <span>排序结果 · 第一候选</span>
        <div><span class="person-avatar large">${recommended.staff.name.slice(-1)}</span><section><strong>${recommended.staff.name}</strong><small>${recommended.staff.department}</small></section></div>
      </div>
      <div class="match-score-equation">
        <span>综合分构成</span>
        <div><b>${recommended.scores.structured}</b><small>六维满足度 ×72%</small></div>
        <i>+</i>
        <div><b>${recommended.scores.semantic}</b><small>语义相似度 ×28%</small></div>
        <i>=</i>
        <div class="is-total"><b>${recommended.scores.match}</b><small>${formulaStructured} + ${formulaSemantic}</small></div>
      </div>
      <div class="match-decision-basis">
        <span>排序依据</span>
        <p><i>${icon("tag")}</i><strong>${escapeHtml(item.case_type)}经验</strong><b>${caseExpertise}</b></p>
        <p><i>${icon("badge-check")}</i><strong>${escapeHtml(demo.abilityLabels[strongest[0]])}</strong><b>${strongest[1].ability}</b></p>
        <p><i>${icon("orbit")}</i><strong>Embedding语义适配</strong><b>${recommended.scores.semantic}</b></p>
      </div>
    </section>
  </section>`;
}

function renderMatchCandidate(candidate, index, semanticOrder, item) {
  const dimensions = Object.entries(candidate.dimensions);
  const strongest = [...dimensions].sort((left, right) => right[1].contribution - left[1].contribution)[0];
  const weakest = [...dimensions].sort((left, right) => left[1].ability - right[1].ability)[0];
  const recallRank = semanticOrder.findIndex((entry) => entry.staff.id === candidate.staff.id) + 1;
  const typeScore = candidate.staff.expertise[item.case_type] ?? candidate.staff.expertise.其他;
  const evidenceStrength = Math.round((candidate.dimensions.A.ability + candidate.dimensions.N.ability) / 2);
  return `<button class="match-candidate-row ${index === 0 ? "is-top" : ""}" data-candidate-id="${candidate.staff.id}" type="button">
    <span class="match-candidate-rank">${index + 1}</span>
    <div class="match-candidate-person"><span class="person-avatar">${candidate.staff.name.slice(-1)}</span><section><strong>${candidate.staff.name}</strong><small>${candidate.staff.department} · ${candidate.staff.experience_years}年</small></section></div>
    <div class="match-fit-facts">
      <span><i>${icon("tag")}</i>${escapeHtml(item.case_type)} <b>${typeScore}</b></span>
      <span><i>${icon("network")}</i>证据与网络 <b>${evidenceStrength}</b></span>
      <span class="is-strong"><i>${icon("badge-check")}</i>${escapeHtml(demo.abilityLabels[strongest[0]])} <b>${strongest[1].ability}</b></span>
    </div>
    <div class="match-gap-note"><span>相对关注项</span><strong>${escapeHtml(demo.abilityLabels[weakest[0]])}</strong><small>${weakest[1].ability}分 · 需结合案件材料核验</small></div>
    <div class="match-score-stack">
      <span><small>语义召回</small><b>${candidate.scores.semantic}</b><i style="--score:${candidate.scores.semantic}%"></i></span>
      <span><small>业务精排</small><b>${candidate.scores.structured}</b><i style="--score:${candidate.scores.structured}%"></i></span>
    </div>
    <div class="match-final-score"><small>综合匹配</small><strong>${candidate.scores.match}</strong><span>召回${recallRank} → 精排${index + 1}</span></div>
    ${icon("chevron-right", "match-candidate-open")}
  </button>`;
}

function cancelMatch() {
  const caseId = getCase().id;
  delete state.matchResults[caseId];
  state.matchStage = "rerank";
  renderMatching();
  showToast("已取消本次匹配，当前案件已恢复到待运行状态");
}

async function runMatch() {
  state.matching = true;
  renderMatching();
  try {
    const response = await apiFetch("/api/match", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ case: getCase(), top_k: 5 }),
    });
    if (!response.ok) throw new Error((await response.json()).detail || "匹配接口异常");
    state.matchResults[getCase().id] = await response.json();
    state.matchStage = "rerank";
    showToast("已完成Embedding召回与六维结构化精排");
  } catch (error) {
    showToast(error.message, true);
  } finally {
    state.matching = false;
    renderMatching();
  }
}

async function runSchedule() {
  state.scheduling = true;
  state.batchExpanded = true;
  renderMatching();
  try {
    const response = await apiFetch("/api/schedule", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ case_ids: state.bootstrap.cases.map((item) => item.id) }),

    showToast(error.message, true);
  } finally {
    state.scheduling = false;
    renderMatching();
  }
}

function riskOptionList(items, selected) {
  return items.map(([value, label]) => `<option value="${value}" ${value === selected ? "selected" : ""}>${label}</option>`).join("");
}

function riskFilterBar() {
  const management = demo.riskManagement;
  const controls = [
    ["calendar-range", "统计周期", "period", management.periods],
    ["building-2", "机构范围", "institution", management.institutions],
    ["users-round", "客户类型", "customerType", management.customerTypes],
    ["briefcase-business", "业务场景", "scene", management.scenes],
    ["git-compare-arrows", "对比口径", "compare", management.compareOptions],
  ];
  return `<section class="risk-filter-bar" aria-label="风险管理统计筛选">${controls.map(([iconName, label, key, items]) => `<label>${icon(iconName)}<span>${label}</span><select data-risk-filter="${key}">${riskOptionList(items, state.riskFilters[key])}</select></label>`).join("")}</section>`;
}

function riskScaled(value, minimum = 1) {
  return Math.max(minimum, Math.round(Number(value || 0) * uiLogic.riskFilterScale(state.riskFilters)));
}

function riskSummaryValue(item) {
  if (["str", "fields"].includes(item.key)) return `${riskScaled(item.value)}${item.unit}`;
  if (item.key === "institution" && state.riskFilters.institution !== "all") {
    return demo.riskManagement.institutions.find(([id]) => id === state.riskFilters.institution)?.[1] || item.value;
  }
  return `${item.value}${item.unit}`;
}

function chartPoints(values, width, height, padding, maxValue) {
  return values.map((value, index) => ({
    x: padding.left + (width - padding.left - padding.right) * index / Math.max(values.length - 1, 1),
    y: padding.top + (height - padding.top - padding.bottom) * (1 - Number(value) / maxValue),
    value,
  }));
}

function renderRiskLineChart(series, { id, labels, maxValue, percent = false }) {
  const width = 680;
  const height = 238;
  const padding = { left: 38, right: 18, top: 24, bottom: 30 };
  const grids = [0, 1, 2, 3].map((index) => {
    const y = padding.top + (height - padding.top - padding.bottom) * index / 3;
    const value = Math.round(maxValue * (1 - index / 3));
    return `<g><line x1="${padding.left}" y1="${y}" x2="${width - padding.right}" y2="${y}"/><text x="4" y="${y + 4}">${value}${percent ? "%" : ""}</text></g>`;
  }).join("");
  const lines = series.map((item) => {
    const points = chartPoints(item.values, width, height, padding, maxValue);
    const path = points.map((point, index) => `${index ? "L" : "M"}${point.x.toFixed(1)},${point.y.toFixed(1)}`).join(" ");
    return `<g class="risk-chart-series" style="--series-color:${item.color}"><path class="risk-chart-line" d="${path}"/>${points.map((point, index) => `<g class="risk-chart-point" ${item.id ? `data-open-risk-action="${item.id}" role="button" tabindex="0"` : ""}><circle cx="${point.x}" cy="${point.y}" r="4"/><title>${escapeHtml(item.label)} · ${escapeHtml(labels[index])} · ${point.value}${percent ? "%" : "件"}</title></g>`).join("")}</g>`;
  }).join("");
  const xLabels = labels.map((label, index) => {
    if (![0, 3, 6, 9, labels.length - 1].includes(index)) return "";
    const x = padding.left + (width - padding.left - padding.right) * index / Math.max(labels.length - 1, 1);
    return `<text x="${x}" y="${height - 8}" text-anchor="middle">${escapeHtml(label)}</text>`;
  }).join("");
  return `<div class="risk-chart-wrap"><svg id="${id}" class="risk-line-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="十二期趋势图"><g class="risk-chart-grid">${grids}${xLabels}</g>${lines}</svg><div class="risk-chart-legend">${series.map((item) => `<span><i style="background:${item.color}"></i>${escapeHtml(item.label)}</span>`).join("")}</div></div>`;
}

function heatTone(value) {
  if (value >= 90) return 5;
  if (value >= 75) return 4;
  if (value >= 60) return 3;
  if (value >= 45) return 2;
  return 1;
}

function renderRiskHeatmap(heatmap) {
  const themeIds = demo.riskManagement.str.themes.map((item) => item.id);
  return `<div class="risk-heatmap" style="--heat-columns:${heatmap.columns.length}"><span></span>${heatmap.columns.map((column) => `<strong>${escapeHtml(column)}</strong>`).join("")}${heatmap.rows.map((row) => `<b class="${state.riskFilters.institution === row.id ? "is-selected" : ""}">${escapeHtml(row.label)}</b>${row.values.map((value, index) => `<button class="heat-${heatTone(value)}" data-open-risk-action="${themeIds[index]}" data-risk-institution="${row.id}" type="button" title="${escapeHtml(row.label)} · ${escapeHtml(heatmap.columns[index])}：${value}">${value}</button>`).join("")}`).join("")}</div>`;
}

function renderRiskDonut(items) {
  let offset = 0;
  const segments = items.map((item) => {
    const segment = `<circle pathLength="100" cx="70" cy="70" r="48" fill="none" stroke="${item.color}" stroke-width="18" stroke-dasharray="${item.value} ${100 - item.value}" stroke-dashoffset="-${offset}"/>`;
    offset += item.value;
    return segment;
  }).join("");
  return `<div class="kyc-donut"><svg viewBox="0 0 140 140" role="img" aria-label="KYC问题原因分布"><circle cx="70" cy="70" r="48" fill="none" stroke="#e7edf1" stroke-width="18"/>${segments}<text x="70" y="66" text-anchor="middle">18.7%</text><text x="70" y="84" text-anchor="middle">问题率</text></svg><div>${items.map((item) => `<span><i style="background:${item.color}"></i><b>${item.label}</b><small>${item.value}%</small></span>`).join("")}</div></div>`;
}

function renderKycMatrix(items) {
  const dimensions = [["completeness", "完整"], ["timeliness", "及时"], ["consistency", "一致"], ["rectification", "整改"]];
  return `<div class="kyc-matrix"><span></span>${dimensions.map(([, label]) => `<strong>${label}</strong>`).join("")}${items.map((item) => `<b class="${state.riskFilters.institution === item.id ? "is-selected" : ""}">${item.label}</b>${dimensions.map(([key]) => `<button class="matrix-${heatTone(item[key])}" data-risk-institution-only="${item.id}" type="button" title="${item.label} ${item[key]}分">${item[key]}</button>`).join("")}`).join("")}</div>`;
}

function renderRiskOverview() {
  const management = demo.riskManagement;

  $$('[data-risk-view]').forEach((button) => button.addEventListener("click", () => {

  $$('[data-risk-filter]').forEach((select) => select.addEventListener("change", () => {

function drawNetworkCanvas(id, network) {
  const canvas = document.getElementById(id);
  if (!canvas || !network?.nodes?.length) return;
  const rect = canvas.getBoundingClientRect();
  const ratio = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(rect.width * ratio));
  canvas.height = Math.max(1, Math.round(rect.height * ratio));
  const ctx = canvas.getContext("2d");
  ctx.scale(ratio, ratio);
  const width = rect.width;
  const height = rect.height;
  ctx.clearRect(0, 0, width, height);
  const centerX = width / 2;
  const centerY = height / 2;
  const radiusX = Math.min(width * (width < 500 ? .31 : .38), 260);
  const radiusY = Math.min(height * .32, 118);
  const positions = network.nodes.map((node, index) => {
    if (index === 0) return [centerX, centerY];
    const angle = (index - 1) / Math.max(network.nodes.length - 1, 1) * Math.PI * 2 - Math.PI / 2;
    return [centerX + Math.cos(angle) * radiusX, centerY + Math.sin(angle) * radiusY];
  });
  ctx.strokeStyle = "#9db5c8";
  ctx.lineWidth = 1.5;
  network.edges.forEach(([from, to]) => {
    const a = positions[from];
    const b = positions[to];
    if (!a || !b) return;
    ctx.beginPath();
    ctx.moveTo(a[0], a[1]);
    ctx.lineTo(b[0], b[1]);
    ctx.stroke();
  });
  const colors = { case: "#c62f3c", source: "#c59034", account: "#1767b0", target: "#0b8b7d", device: "#6755a3", document: "#607284" };
  network.nodes.forEach(([label, type], index) => {
    const [x, y] = positions[index];
    ctx.beginPath();
    ctx.arc(x, y, index === 0 ? 22 : 15, 0, Math.PI * 2);
    ctx.fillStyle = colors[type] || "#1767b0";
    ctx.fill();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.fillStyle = "#203549";
    ctx.font = `${index === 0 ? 700 : 600} 12px "PingFang SC", sans-serif`;
    ctx.textAlign = "center";
    ctx.fillText(label, x, y + (index === 0 ? 39 : 31));
  });
}

function drawTrend() {
  const canvas = $("#trendCanvas");
  if (!canvas) return;
  const rect = canvas.getBoundingClientRect();
  const ratio = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(rect.width * ratio));
  canvas.height = Math.max(1, Math.round(rect.height * ratio));
  const ctx = canvas.getContext("2d");
  ctx.scale(ratio, ratio);
  const values = demo.trendSeries;
  const pad = { left: 36, right: 18, top: 22, bottom: 30 };
  const width = rect.width - pad.left - pad.right;
  const height = rect.height - pad.top - pad.bottom;
  const max = Math.max(...values) + 5;
  ctx.strokeStyle = "#e2e8ee";
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i += 1) {
    const y = pad.top + height / 4 * i;
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(rect.width - pad.right, y);
    ctx.stroke();
  }
  ctx.beginPath();
  values.forEach((value, index) => {
    const x = pad.left + width * index / (values.length - 1);
    const y = pad.top + height * (1 - value / max);
    if (index === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = state.riskType === "str" ? "#c62f3c" : "#0b8b7d";
  ctx.lineWidth = 3;
  ctx.stroke();
  values.forEach((value, index) => {
    const x = pad.left + width * index / (values.length - 1);
    const y = pad.top + height * (1 - value / max);
    ctx.beginPath();
    ctx.arc(x, y, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = state.riskType === "str" ? "#c62f3c" : "#0b8b7d";
    ctx.fill();
  });
  ctx.fillStyle = "#647789";
  ctx.font = '11px "PingFang SC", sans-serif';
  ctx.fillText("近12期人工处置结果趋势", pad.left, 14);
}

  });
  window.addEventListener("resize", () => {
    if (state.route === "parsing" && getMeta().files.find((file) => file.id === state.selectedFileId)?.type === "GRAPH") drawNetworkCanvas("parseNetworkCanvas", getMeta().network);
  });
}

async function init() {
  try {
    const response = await apiFetch("/api/bootstrap");
    if (!response.ok) throw new Error("初始化接口不可用");
    state.bootstrap = await response.json();
    if (!state.bootstrap.cases.some((item) => item.id === state.currentCaseId)) {
      setCurrentCase(state.bootstrap.cases[0].id);
    }
    globalCaseSelect.innerHTML = state.bootstrap.cases.map((item) => `<option value="${item.id}">${item.id} · ${escapeHtml(item.name.replace(/^预警包.｜/, ""))}</option>`).join("");
    globalCaseSelect.value = state.currentCaseId;
    $("#caseBadge").textContent = state.bootstrap.cases.length;
    const model = state.bootstrap.model;
    const label = modelRuntimeLabel(model, "离线向量回放");
    $("#modelMode").innerHTML = `<span class="health-dot ${model.ready ? "is-on" : "is-warm"}"></span>${label}`;
    $("#sidebarMode").textContent = model.ready ? "百炼已配置" : "离线回放";
    bindGlobalEvents();
    renderRoute();
  } catch (error) {
    appView.innerHTML = `<div class="fatal-state">${icon("server-off")}<h1>工作台初始化失败</h1><p>${escapeHtml(error.message)}</p><button class="button button-primary" onclick="location.reload()">重新载入</button></div>`;
    refreshIcons();
  }
}

init();

</script>
  </body>
</html>
