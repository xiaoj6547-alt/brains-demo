<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>工银BRAINS预警智能分流台</title>
    <style>
:root {
  --navy-950: #041225;
  --navy-900: #071a31;
  --navy-800: #0d2948;
  --blue-700: #15579a;
  --blue-600: #1767b0;
  --blue-100: #e7f1f9;
  --red-700: #a82330;
  --red-600: #c62f3c;
  --red-100: #fbe9eb;
  --teal-700: #087568;
  --teal-600: #0b8b7d;
  --teal-100: #e5f5f2;
  --gold-700: #996f25;
  --gold-600: #c59034;
  --gold-100: #f8f0df;
  --ink: #14283a;
  --muted: #5c7082;
  --soft: #7f91a0;
  --line: #d8e1e8;
  --line-strong: #bdcad4;
  --canvas: #f3f6f9;
  --surface: #ffffff;
  --sidebar-width: 258px;
  --topbar-height: 66px;
  --shadow: 0 8px 26px rgba(19, 42, 61, .09);
}

* { box-sizing: border-box; }
html { min-width: 320px; background: var(--canvas); }
body {
  margin: 0;
  color: var(--ink);
  background: var(--canvas);
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif;
  font-size: 13px;
  line-height: 1.5;
  letter-spacing: 0;
}
button, input, select, textarea { font: inherit; }
button, select { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
  outline: 3px solid rgba(23, 103, 176, .22);
  outline-offset: 2px;
}
svg { width: 18px; height: 18px; stroke-width: 1.8; }

.app-shell { min-height: 100vh; display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); }
.sidebar {
  width: var(--sidebar-width);
  position: fixed;
  z-index: 50;
  inset: 0 auto 0 0;
  display: flex;
  flex-direction: column;
  color: #fff;
  background: var(--navy-950);
  border-right: 1px solid #153756;
}
.brand {
  min-height: 86px;
  display: grid;
  grid-template-columns: 40px 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 0 20px;
  border-bottom: 1px solid rgba(255, 255, 255, .1);
}
.brand-seal {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  color: #fff;
  background: var(--red-600);
  border: 1px solid #ef747e;
  font: 800 20px "DIN Alternate", Arial, sans-serif;
}
.brand-copy strong { display: block; font-size: 17px; font-weight: 750; }
.brand-copy span { display: block; margin-top: 4px; color: #a8bed1; font-size: 11px; }
.module-nav { flex: 1; overflow: auto; padding: 17px 12px; }
.nav-label { margin: 0 10px 8px; color: #64809a; font-size: 10px; font-weight: 700; letter-spacing: 1.2px; }
.nav-label-spaced { margin-top: 22px; }
.nav-item {
  min-height: 46px;
  display: grid;
  grid-template-columns: 22px 1fr auto;
  gap: 11px;
  align-items: center;
  margin: 3px 0;
  padding: 0 12px;
  color: #c9d7e3;
  text-decoration: none;
  border-left: 3px solid transparent;
}
.nav-item:hover { color: #fff; background: rgba(255, 255, 255, .06); }
.nav-item.is-active { color: #fff; background: #102f50; border-left-color: var(--gold-600); }
.nav-item-core { color: #fff; }
.nav-item svg { color: #7da8cb; }
.nav-item.is-active svg { color: #fff; }
.nav-item b {
  min-width: 22px;
  height: 20px;
  display: grid;
  place-items: center;
  padding: 0 6px;
  color: #fff;
  background: var(--red-600);
  border-radius: 10px;
  font-size: 10px;
}
.sidebar-foot { padding: 16px 18px 20px; border-top: 1px solid rgba(255, 255, 255, .1); }
.service-row { display: grid; grid-template-columns: 9px 1fr auto; gap: 8px; align-items: center; margin: 7px 0; color: #91a9bd; font-size: 11px; }
.service-row strong { color: #dce6ee; font-size: 11px; }
.sidebar-foot small { display: block; margin-top: 12px; color: #637e96; font-size: 10px; }
.health-dot { width: 8px; height: 8px; display: inline-block; background: #d19a31; border-radius: 50%; }
.health-dot.is-on { background: #3dc4a9; box-shadow: 0 0 0 3px rgba(61, 196, 169, .13); }
.health-dot.is-warm { background: #d19a31; }

.main-shell { grid-column: 2; min-width: 0; min-height: 100vh; }
.topbar {
  height: var(--topbar-height);
  position: sticky;
  z-index: 40;
  top: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 0 24px;
  background: rgba(255, 255, 255, .98);
  border-bottom: 1px solid var(--line);
}
.topbar-left, .topbar-tools, .case-context { display: flex; align-items: center; }
.breadcrumb { color: #29445a; font-size: 13px; font-weight: 700; }
.breadcrumb span { color: var(--blue-600); font-family: "DIN Alternate", Arial, sans-serif; }
.breadcrumb i { margin: 0 8px; color: #9cadba; font-style: normal; }
.topbar-tools { gap: 12px; }
.case-context { gap: 8px; padding-right: 12px; border-right: 1px solid var(--line); }
.case-context span { color: var(--soft); font-size: 11px; }
.case-context select, .compact-select {
  height: 36px;
  padding: 0 32px 0 10px;
  color: #29445a;
  background: #fff;
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  font-size: 12px;
}
.case-context select { width: 250px; }
.mode-chip { display: flex; align-items: center; gap: 8px; color: #4c6275; font-size: 11px; }
.user-badge {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  color: #fff;
  background: var(--navy-800);
  border-radius: 50%;
  font-weight: 800;
}
.icon-button {
  width: 36px;
  height: 36px;
  display: inline-grid;
  place-items: center;
  padding: 0;
  color: #4d6579;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 4px;
}
.icon-button:hover { color: var(--blue-600); background: var(--blue-100); border-color: #c8ddea; }
.sidebar-close, .mobile-menu { display: none; }
.notification-count {
  min-width: 16px;
  height: 16px;
  position: absolute;
  display: grid;
  place-items: center;
  margin: -24px 0 0 23px;
  color: #fff;
  background: var(--red-600);
  border-radius: 8px;
  font-size: 9px;
}

.page-view { min-width: 0; padding: 24px 26px 34px; }
.page-view:focus { outline: none; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
.page-title .eyebrow { display: block; margin-bottom: 5px; color: var(--blue-600); font-size: 10px; font-weight: 750; letter-spacing: .8px; }
.page-title h1 { margin: 0; color: #132d43; font-size: 26px; line-height: 1.2; }
.page-title p { max-width: 820px; margin: 7px 0 0; color: var(--muted); font-size: 12px; }
.page-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.button {
  min-height: 38px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 0 13px;
  color: #27455c;
  background: #fff;
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  font-weight: 650;
  font-size: 12px;
  white-space: nowrap;
}
.button:hover { border-color: #8fb0c9; background: #f7fafc; }
.button-primary { color: #fff; background: var(--blue-600); border-color: var(--blue-600); }
.button-primary:hover { background: var(--blue-700); }
.button-danger { color: #fff; background: var(--red-600); border-color: var(--red-600); }
.button-success { color: #fff; background: var(--teal-600); border-color: var(--teal-600); }
.button:disabled { cursor: wait; opacity: .65; }
.full-button { width: 100%; margin-top: 16px; }
.spin { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.metric-band {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  margin-bottom: 16px;
  background: #fff;
  border: 1px solid var(--line);
}
.metric-item {
  min-height: 96px;
  display: grid;
  grid-template-columns: 46px 1fr;
  gap: 13px;
  align-items: center;
  padding: 14px 18px;
  border-right: 1px solid var(--line);
}
.metric-item:last-child { border-right: 0; }
.metric-symbol { width: 44px; height: 44px; display: grid; place-items: center; color: var(--blue-600); background: var(--blue-100); }
.metric-item.red .metric-symbol { color: var(--red-600); background: var(--red-100); }
.metric-item.gold .metric-symbol { color: var(--gold-700); background: var(--gold-100); }
.metric-item span { color: var(--muted); font-size: 11px; }
.metric-item strong { display: inline-block; margin: 0 8px 0 0; color: #102d45; font: 800 28px "DIN Alternate", Arial, sans-serif; }
.metric-item small { color: var(--soft); font-size: 10px; }

.work-surface { background: #fff; border: 1px solid var(--line); }
.surface-toolbar, .surface-header, .pane-title {
  min-height: 54px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 9px 14px;
  border-bottom: 1px solid var(--line);
}
.surface-toolbar { justify-content: flex-start; flex-wrap: wrap; }
.surface-header strong, .pane-title strong { display: block; color: #233d53; font-size: 13px; }
.surface-header span, .pane-title span { display: block; margin-top: 2px; color: var(--soft); font-size: 10px; }
.search-field {
  width: min(390px, 100%);
  height: 36px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  background: #fff;
  border: 1px solid var(--line-strong);
  border-radius: 4px;
}
.search-field svg { color: #758999; }
.search-field input { width: 100%; border: 0; outline: 0; color: var(--ink); }
.toolbar-note { display: inline-flex !important; align-items: center; gap: 6px; margin-left: auto !important; color: #526a7d !important; font-size: 11px !important; }
.toolbar-note svg { width: 15px; height: 15px; }
.table-shell { width: 100%; overflow: auto; }
.data-table { width: 100%; border-collapse: collapse; white-space: nowrap; }
.data-table th {
  padding: 11px 12px;
  color: #5d7182;
  background: #f5f7f9;
  border-bottom: 1px solid var(--line);
  text-align: left;
  font-size: 11px;
  font-weight: 750;
}
.data-table td { padding: 12px; border-bottom: 1px solid #e9eef2; font-size: 12px; vertical-align: middle; }
.data-table tbody tr:last-child td { border-bottom: 0; }
.data-table tbody tr:hover { background: #f7fafc; }
.case-table tbody tr { cursor: pointer; }
.case-title-cell strong, .person-cell strong { display: block; color: #20384c; font-size: 12px; }
.case-title-cell span, .person-cell small, .cell-sub { display: block; margin-top: 4px; color: var(--soft); font-size: 10px; }
.tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-flex; align-items: center; min-height: 24px; padding: 2px 8px; color: #405a70; background: #edf2f5; border: 1px solid #dbe4ea; border-radius: 3px; font-size: 10px; }
.tag-red { color: var(--red-700); background: var(--red-100); border-color: #efc6ca; }
.tag-blue { color: var(--blue-700); background: var(--blue-100); border-color: #c8deed; }
.tag-teal { color: var(--teal-700); background: var(--teal-100); border-color: #bddfd9; }
.score-chip { min-width: 40px; height: 30px; display: inline-grid; place-items: center; color: var(--blue-700); background: var(--blue-100); border-left: 3px solid var(--blue-600); font: 800 15px "DIN Alternate", Arial, sans-serif; }
.score-chip.is-red { color: var(--red-700); background: var(--red-100); border-color: var(--red-600); }
.score-chip.is-amber { color: var(--gold-700); background: var(--gold-100); border-color: var(--gold-600); }
.score-line { min-width: 110px; display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: center; }
.score-line span, .component-row > span, .demand-row div > span, .load-track {
  height: 6px;
  display: block;
  overflow: hidden;
  background: #e5ebef;
}
.score-line i, .component-row i, .demand-row i, .load-track i { height: 100%; display: block; background: var(--blue-600); }
.status-pill { min-height: 25px; display: inline-flex !important; align-items: center; padding: 3px 8px; border-radius: 3px; font-size: 10px !important; font-weight: 700; white-space: nowrap; }
.status-blue { color: var(--blue-700) !important; background: var(--blue-100); }
.status-teal { color: var(--teal-700) !important; background: var(--teal-100); }
.status-amber { color: var(--gold-700) !important; background: var(--gold-100); }
.status-red { color: var(--red-700) !important; background: var(--red-100); }

.case-brief-line {
  min-height: 92px;
  display: grid;
  grid-template-columns: minmax(420px, 1fr) auto;
  gap: 20px;
  align-items: center;
  padding: 14px 18px;
  background: #fff;
  border: 1px solid var(--line);
  border-bottom: 0;
}
.case-brief-line > div > span { display: block; margin-bottom: 5px; color: var(--blue-600); font-size: 10px; font-weight: 750; }
.case-brief-line > div > strong { display: block; color: #294156; font-size: 12px; line-height: 1.7; }
.case-brief-line dl { display: grid; grid-template-columns: repeat(4, 92px); margin: 0; }
.case-brief-line dl div { padding: 2px 10px; border-left: 1px solid var(--line); text-align: center; }
.case-brief-line dt { color: var(--soft); font-size: 10px; }
.case-brief-line dd { margin: 4px 0 0; color: #193852; font: 800 16px "DIN Alternate", Arial, sans-serif; }
.analysis-pipeline { display: grid; grid-template-columns: repeat(5, 1fr); background: #eef3f7; border: 1px solid var(--line); }
.pipeline-step { min-height: 66px; display: grid; grid-template-columns: 30px 22px 1fr; gap: 7px; align-items: center; padding: 9px 12px; border-right: 1px solid var(--line); }
.pipeline-step:last-child { border-right: 0; }
.pipeline-step > span { width: 28px; height: 28px; display: grid; place-items: center; color: var(--blue-600); background: #fff; border: 1px solid #ccdae5; }
.pipeline-step > b { color: var(--gold-700); font: 800 11px "DIN Alternate", Arial, sans-serif; }
.pipeline-step strong { display: block; font-size: 11px; }
.pipeline-step small { display: block; margin-top: 2px; color: var(--soft); font-size: 9px; }
.analysis-workbench {
  min-height: 620px;
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr) 320px;
  background: #fff;
  border: 1px solid var(--line);
  border-top: 0;
}
.analysis-workbench > * { min-width: 0; }
.analysis-workbench > *:not(:last-child) { border-right: 1px solid var(--line); }
.material-list { padding: 8px; }
.material-row {
  width: 100%;
  min-height: 66px;
  display: grid;
  grid-template-columns: 38px 1fr auto;
  gap: 9px;
  align-items: center;
  margin-bottom: 5px;
  padding: 8px 9px;
  color: var(--ink);
  background: transparent;
  border: 1px solid transparent;
  text-align: left;
}
.material-row:hover, .material-row.is-active { background: #edf4f9; border-color: #cbddea; }
.file-symbol { width: 36px; height: 36px; display: grid; place-items: center; color: var(--blue-600); background: #fff; border: 1px solid #d3e0e9; }
.material-row strong, .material-row small, .material-row em { display: block; }
.material-row strong { font-size: 11px; }
.material-row small { margin-top: 3px; color: var(--soft); font-size: 9px; }
.material-row em { margin-top: 2px; color: var(--blue-700); font-size: 9px; font-style: normal; }
.material-row > b { color: var(--teal-700); font-size: 9px; font-weight: 650; }
.evidence-stage { background: #f2f5f8; }
.transaction-preview, .document-preview, .graph-preview { min-height: 565px; position: relative; padding: 18px; }
.transaction-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin-bottom: 14px; background: var(--line); border: 1px solid var(--line); }
.transaction-metrics div { min-height: 82px; padding: 12px; background: #fff; }
.transaction-metrics span, .transaction-metrics small { display: block; color: var(--soft); font-size: 9px; }
.transaction-metrics strong { display: block; margin: 5px 0 3px; color: #1d3b55; font: 800 16px "DIN Alternate", Arial, sans-serif; }
.inner-table { background: #fff; border: 1px solid var(--line); }
.data-table tr.is-highlighted { background: #fff4e5; }
.source-anchor {
  min-height: 54px;
  display: grid;
  grid-template-columns: 22px 1fr auto;
  gap: 8px;
  align-items: center;
  margin-top: 14px;
  padding: 10px 12px;
  color: #2e4c64;
  background: #fff;
  border-left: 3px solid var(--gold-600);
  box-shadow: var(--shadow);
  font-size: 10px;
}
.source-anchor span { color: var(--soft); }
.document-sheet {
  min-height: 470px;
  max-width: 720px;
  margin: 0 auto;
  padding: 34px 42px;
  background: #fff;
  border: 1px solid #d6dee4;
  box-shadow: 0 8px 24px rgba(31, 51, 67, .08);
}
.document-sheet header { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; padding-bottom: 14px; border-bottom: 2px solid #213f59; color: var(--soft); font-size: 9px; }
.document-sheet header strong { color: #1b354b; text-align: center; font-size: 12px; }
.document-sheet header em { text-align: right; font-style: normal; }
.document-sheet h3 { margin: 28px 0 18px; text-align: center; font-size: 18px; }
.document-sheet p { margin: 14px 0; color: #354c60; font-family: "Songti SC", SimSun, serif; font-size: 13px; line-height: 2; text-align: justify; }
.document-sheet .document-emphasis { padding: 9px 12px; background: #fff6dc; border-left: 3px solid var(--gold-600); }
.document-table { display: grid; grid-template-columns: 90px 1fr 90px 1fr; margin: 18px 0; border: 1px solid var(--line); }
.document-table span, .document-table strong { min-height: 38px; display: flex; align-items: center; padding: 7px 9px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 10px; }
.document-table span { color: var(--muted); background: #f3f6f8; }
.material-simulation { min-height: 565px; background: #eef3f6; }
.simulation-compact-status { min-height: 42px; display: flex; align-items: center; gap: 10px; padding: 8px 14px; color: #31546d; background: #f5faf9; border-bottom: 1px solid var(--line); font-size: 13px; }
.simulation-compact-status svg { width: 17px; height: 17px; color: var(--teal-700); }
.simulation-compact-status strong { margin-left: auto; color: #657d8f; font-size: 12px; }
.simulation-summary { min-height: 38px; display: flex; align-items: center; gap: 16px; padding: 7px 12px; color: #71899a; background: #f7f9fa; border-bottom: 1px solid var(--line); font-size: 8px; }
.simulation-summary span:first-child { margin-right: auto; color: #3b586e; }
.simulation-summary svg { width: 13px; height: 13px; margin-right: 5px; vertical-align: -2px; }
.simulation-summary b { color: var(--teal-700); font-size: 9px; }
.simulation-body { display: grid; grid-template-columns: minmax(0, 1fr) 270px; min-height: 510px; }
.raw-material-frame { min-width: 0; padding: 14px; }
.raw-material-frame > header { min-height: 38px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 2px 9px; color: #7990a1; font-size: 8px; }
.raw-material-frame > header span, .raw-material-frame > header strong { display: block; }
.raw-material-frame > header strong { margin-top: 2px; color: #29475e; font-size: 10px; }
.raw-material-frame > header em { font-style: normal; }
.simulated-sheet {
  min-height: 440px;
  position: relative;
  overflow: hidden;
  padding: 22px 26px;
  color: #30495c;
  background: #fff;
  border: 1px solid #d1dce4;
  box-shadow: 0 8px 22px rgba(26, 48, 67, .07);
  font-family: "Songti SC", SimSun, serif;
  font-size: 10px;
}
.sheet-topline { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; padding-bottom: 10px; color: #71899a; border-bottom: 2px solid #294b66; font-family: "PingFang SC", sans-serif; font-size: 8px; }
.sheet-topline b { color: #294b66; text-align: center; }
.sheet-topline em { text-align: right; font-style: normal; }
.transaction-file-meta { display: grid; grid-template-columns: 1.4fr 1fr .55fr; margin: 14px 0 12px; border: 1px solid #d5dee5; }
.transaction-file-meta > div { min-height: 48px; padding: 8px; border-right: 1px solid #d5dee5; }
.transaction-file-meta > div:last-child { border-right: 0; }
.transaction-file-meta span, .transaction-file-meta strong { display: block; }
.transaction-file-meta span { color: #7e91a0; font-family: "PingFang SC", sans-serif; font-size: 8px; }
.transaction-file-meta strong { margin-top: 5px; color: #263f53; font-size: 9px; }
.raw-table-wrap, .invoice-table-wrap { position: relative; overflow-x: auto; border: 1px solid #ccd8e0; }
.raw-transaction-table, .contract-table, .invoice-table { width: 100%; border-collapse: collapse; white-space: nowrap; font-family: "PingFang SC", sans-serif; font-size: 8px; }

.retrieved-case > b { color: var(--red-700); font: 800 16px "DIN Alternate", Arial, sans-serif; }
.retrieved-case footer { grid-column: 2 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; margin-top: 3px; }
.retrieved-case footer span { padding: 3px; color: #5f7484; background: #eff3f6; font-size: 7px; text-align: center; }
.retrieval-formula { margin: 0 9px 12px; padding: 9px; color: #526b7f; background: #edf3f7; font-size: 8px; line-height: 1.55; }
.retrieval-placeholder { min-height: 430px; display: grid; place-content: center; justify-items: center; padding: 24px; text-align: center; }
.retrieval-placeholder svg { width: 36px; height: 36px; color: var(--blue-600); }
.retrieval-placeholder strong { margin-top: 12px; font-size: 12px; }
.retrieval-placeholder p { margin: 5px 0; color: #466177; font-size: 10px; }
.retrieval-placeholder small { max-width: 220px; color: var(--soft); font-size: 9px; line-height: 1.55; }
.knowledge-overview { display: grid; grid-template-columns: repeat(4, 1fr); background: #fff; border: 1px solid var(--line); border-top: 0; }

.knowledge-overview strong { display: block; margin: 4px 0 1px; color: #203d54; font: 800 20px "DIN Alternate", Arial, sans-serif; }
.knowledge-surface { background: #fff; border: 1px solid var(--line); border-top: 0; }
.knowledge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 12px; }
.knowledge-card { min-height: 224px; display: flex; flex-direction: column; padding: 14px; color: var(--ink); background: #fff; border: 1px solid var(--line); text-align: left; }
.knowledge-card[hidden] { display: none; }
.knowledge-card:hover { border-color: #7ca6c4; box-shadow: var(--shadow); }
.knowledge-card > header, .knowledge-card > footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.knowledge-card > header > span:first-child { color: var(--blue-700); font: 700 9px "DIN Alternate", Arial, sans-serif; }
.knowledge-card h3 { margin: 12px 0 7px; font-size: 13px; line-height: 1.45; }
.knowledge-card p { flex: 1; margin: 0 0 12px; color: var(--muted); font-size: 9px; line-height: 1.65; }
.knowledge-card .tag-row { margin-bottom: 12px; }
.knowledge-card > footer { padding-top: 9px; border-top: 1px solid #e8edf1; color: var(--soft); font-size: 8px; }
.knowledge-card > footer strong { color: var(--teal-700); font-size: 9px; }
.knowledge-loading { min-height: 520px; background: #fff; border: 1px solid var(--line); border-top: 0; }
.knowledge-drawer-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--blue-700); font-size: 10px; }

.knowledge-drawer section { padding: 13px 0; border-bottom: 1px solid var(--line); }
.knowledge-drawer section h3 { margin: 0 0 8px; font-size: 11px; }
.knowledge-drawer ul { margin: 0; padding-left: 20px; }
.knowledge-drawer li, .knowledge-drawer section p { margin: 5px 0; color: var(--muted); font-size: 10px; line-height: 1.6; }
.knowledge-drawer .expert-lesson { margin-top: 12px; padding: 13px; background: var(--gold-100); border-left: 3px solid var(--gold-600); }
.prompt-package section { margin-bottom: 14px; padding: 13px; background: #f2f6f8; border-left: 3px solid var(--blue-600); }
.prompt-package section span { color: var(--blue-700); font-size: 9px; font-weight: 750; }
.prompt-package section p { margin: 7px 0 0; color: #38536a; font: 9px/1.75 "SFMono-Regular", Consolas, monospace; white-space: pre-wrap; }

.staff-layout { display: grid; grid-template-columns: minmax(720px, 1fr) 360px; gap: 14px; }
.staff-table-surface { min-width: 0; }
.staff-table th:not(:first-child), .staff-table td:not(:first-child) { text-align: center; }
.staff-row { cursor: pointer; }
.staff-row.is-selected { background: #edf5fb; box-shadow: inset 3px 0 var(--blue-600); }
.person-cell { display: flex; align-items: center; gap: 9px; }
.person-avatar { width: 30px; height: 30px; flex: 0 0 auto; display: grid; place-items: center; color: #fff; background: var(--blue-600); border-radius: 50%; font-size: 11px; font-weight: 750; }
.person-avatar.large { width: 48px; height: 48px; font-size: 16px; }
.ability-number { min-width: 30px; height: 26px; display: inline-grid; place-items: center; color: #24445d; background: #edf3f7; border-bottom: 2px solid var(--blue-600); font: 700 11px "DIN Alternate", Arial, sans-serif; }
.staff-inspector { align-self: start; background: #fff; border: 1px solid var(--line); }
.inspector-head { min-height: 96px; display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; padding: 16px; color: #fff; background: var(--navy-900); }
.inspector-head span { color: #91aec3; font-size: 9px; }
.inspector-head h2 { margin: 2px 0; font-size: 18px; }
.inspector-head p { margin: 0; color: #a8bdcc; font-size: 10px; }
.inspector-body { padding: 16px; }
.inspector-body section { padding-bottom: 16px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
.inspector-body section:last-child { border-bottom: 0; margin-bottom: 0; }
.inspector-body h3 { margin: 0 0 8px; color: #38536a; font-size: 11px; }
.profile-summary-text { margin: 0 0 12px; color: var(--muted); font-size: 10px; line-height: 1.65; }
.source-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.source-metrics div { min-height: 72px; padding: 9px; background: #f3f6f8; border-top: 3px solid var(--blue-600); }
.source-metrics span, .source-metrics small { display: block; color: var(--soft); font-size: 8px; }
.source-metrics strong { display: block; margin: 4px 0; font: 800 17px "DIN Alternate", Arial, sans-serif; }
.auxiliary-note p { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.6; }
.capacity-separate { padding: 13px !important; background: var(--gold-100); border-left: 3px solid var(--gold-600); }
.capacity-separate span, .capacity-separate small { display: block; color: #775c2e; font-size: 9px; }
.capacity-separate strong { display: block; margin: 4px 0; color: var(--gold-700); font: 800 20px "DIN Alternate", Arial, sans-serif; }

.match-lab { display: grid; gap: 12px; }
.match-case-input { min-height: 152px; display: grid; grid-template-columns: minmax(360px, 1.45fr) minmax(230px, .8fr) minmax(280px, .9fr) 150px; align-items: stretch; background: #fff; border: 1px solid var(--line); }
.match-case-input > *:not(:last-child) { border-right: 1px solid var(--line); }
.match-case-identity { min-width: 0; padding: 18px; border-top: 4px solid var(--navy-800); }
.match-case-identity > span, .match-demand-summary > span { color: var(--gold-700); font-size: 9px; font-weight: 750; letter-spacing: .8px; }
.match-case-identity h2 { margin: 7px 0 8px; color: #17364f; font-size: 18px; }
.match-case-identity p { max-width: 760px; margin: 0; color: var(--muted); font-size: 9px; line-height: 1.7; }
.match-case-facts { display: grid; grid-template-columns: 1fr 1fr; align-content: stretch; }
.match-case-facts div { min-width: 0; display: grid; align-content: center; padding: 12px 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.match-case-facts div:nth-child(2n) { border-right: 0; }
.match-case-facts div:nth-child(n+3) { border-bottom: 0; }
.match-case-facts span, .match-case-facts strong { display: block; }
.match-case-facts span { color: var(--soft); font-size: 8px; }
.match-case-facts strong { margin-top: 4px; color: #26475f; font-size: 12px; }
.match-demand-summary { min-width: 0; padding: 16px; background: #f7f9fb; }
.match-demand-summary > div { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 9px 0; }
.match-demand-summary b { min-width: 0; display: grid; grid-template-columns: 22px 1fr auto; gap: 5px; align-items: center; padding: 7px; color: #35566e; background: #fff; border: 1px solid var(--line); font-size: 8px; }
.match-demand-summary b i { width: 20px; height: 20px; display: grid; place-items: center; color: #fff; background: var(--blue-600); font: 800 9px "DIN Alternate", Arial, sans-serif; }
.match-demand-summary b em { color: var(--blue-700); font-style: normal; }
.match-demand-summary small { display: block; color: var(--muted); font-size: 8px; line-height: 1.55; }
.match-case-actions { min-width: 0; display: grid; grid-template-rows: repeat(2, minmax(0, 1fr)); }
.match-case-actions.is-single { grid-template-rows: 1fr; }
.match-case-actions .button { width: 100%; min-width: 0; border-radius: 0; }
.match-case-actions.has-result .match-run-button { border-bottom: 1px solid rgba(255, 255, 255, .3); }
.match-run-button { align-self: stretch; justify-self: stretch; min-width: 0; border-radius: 0; font-size: 12px; }
.match-run-button svg { width: 18px; height: 18px; }
.match-cancel-button { color: #486478; background: #f7f9fb; border: 0; font-size: 10px; }
.match-cancel-button:hover { color: #a62e37; background: #fff2f3; }
.match-cancel-button svg { width: 15px; height: 15px; }

.match-pipeline { background: #fff; border: 1px solid var(--line); }
.match-pipeline > header { min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.match-pipeline > header div span, .match-rerank-head span, .match-recall-band header span { display: block; color: var(--blue-700); font-size: 8px; font-weight: 750; letter-spacing: .7px; }
.match-pipeline > header div strong { display: block; margin-top: 3px; color: #24445d; font-size: 13px; }
.match-pipeline-steps { display: grid; grid-template-columns: repeat(4, 1fr); }
.match-pipeline-steps > div { position: relative; min-width: 0; min-height: 94px; display: grid; grid-template-columns: 38px 24px 1fr 18px; gap: 8px; align-items: center; padding: 12px 14px; border-right: 1px solid var(--line); }
.match-pipeline-steps > div:last-child { border-right: 0; }
.match-step-icon { width: 36px; height: 36px; display: grid; place-items: center; color: var(--blue-600); background: var(--blue-100); border: 1px solid #c8dce9; }
.match-step-icon svg { width: 18px; height: 18px; }
.match-pipeline-steps > div > b { color: #8095a5; font: 800 10px "DIN Alternate", Arial, sans-serif; }
.match-pipeline-steps section strong, .match-pipeline-steps section small { display: block; }
.match-pipeline-steps section strong { color: #294a62; font-size: 10px; }
.match-pipeline-steps section small { margin-top: 4px; color: var(--soft); font-size: 8px; line-height: 1.45; }
.match-pipeline-steps > div > svg { width: 14px; color: #a4b7c4; }
.match-pipeline-steps > div.is-ready { background: #f5f9fc; box-shadow: inset 0 3px var(--blue-600); }
.match-pipeline-steps > div.is-complete { background: #f4faf8; }
.match-pipeline-steps > div.is-complete .match-step-icon { color: var(--teal-700); background: #e7f6f2; border-color: #aad9ce; }
.match-pipeline-steps > div.is-complete > b { color: var(--teal-700); }

.match-empty-state { min-height: 260px; display: grid; grid-template-columns: 72px minmax(280px, 1fr) minmax(420px, 1.15fr); gap: 22px; align-items: center; padding: 28px 34px; background: #fff; border: 1px solid var(--line); }
.match-empty-state > span { width: 64px; height: 64px; display: grid; place-items: center; color: var(--blue-600); background: var(--blue-100); border: 1px solid #c5dbe9; }
.match-empty-state > span svg { width: 30px; height: 30px; }
.match-empty-state h2 { margin: 0 0 8px; color: #24445d; font-size: 17px; }
.match-empty-state p { max-width: 560px; margin: 0; color: var(--muted); font-size: 10px; line-height: 1.7; }
.match-empty-state dl { display: grid; grid-template-columns: repeat(3, 1fr); margin: 0; border: 1px solid var(--line); }
.match-empty-state dl div { min-height: 84px; padding: 13px; border-right: 1px solid var(--line); }
.match-empty-state dl div:last-child { border-right: 0; }
.match-empty-state dt { color: var(--blue-700); font-size: 9px; font-weight: 750; }
.match-empty-state dd { margin: 7px 0 0; color: var(--muted); font-size: 9px; line-height: 1.5; }

.match-result { display: grid; gap: 12px; }
.match-recall-band { background: #fff; border: 1px solid var(--line); }
.match-recall-band > header, .match-rerank-head { min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.match-recall-band header strong, .match-rerank-head strong { display: block; margin: 3px 0; color: #24445d; font-size: 13px; }
.match-recall-band header small, .match-rerank-head small { display: block; color: var(--soft); font-size: 8px; }
.match-recall-band header code, .match-rerank-head code { padding: 7px 10px; color: #35566e; background: #f1f5f8; border-left: 3px solid var(--blue-600); font: 8px/1.4 "SFMono-Regular", Consolas, monospace; }
.match-recall-list { display: grid; grid-template-columns: repeat(5, 1fr); }
.match-recall-list > div { min-width: 0; display: grid; grid-template-columns: 26px 1fr 36px; gap: 8px; align-items: center; padding: 13px 14px; border-right: 1px solid var(--line); }
.match-recall-list > div:last-child { border-right: 0; }
.match-recall-list > div > span { width: 24px; height: 24px; display: grid; place-items: center; color: #fff; background: var(--navy-800); font-size: 9px; font-weight: 750; }
.match-recall-list section { min-width: 0; }
.match-recall-list section strong, .match-recall-list section small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.match-recall-list section strong { color: #294a62; font-size: 9px; }
.match-recall-list section small { margin: 3px 0 6px; color: var(--soft); font-size: 7px; }
.match-recall-list section i { height: 4px; display: block; overflow: hidden; background: #e4ebf0; }
.match-recall-list section i b { height: 100%; display: block; background: var(--blue-600); }
.match-recall-list > div > em { color: var(--blue-700); font: 800 13px "DIN Alternate", Arial, sans-serif; text-align: right; }
.match-rerank-head { background: #f7f9fb; border: 1px solid var(--line); }
.match-candidate-list { display: grid; gap: 8px; }
.match-candidate-row { width: 100%; min-height: 100px; display: grid; grid-template-columns: 38px 180px minmax(260px, 1fr) 155px 210px 96px 18px; gap: 12px; align-items: center; padding: 12px 14px; color: var(--ink); background: #fff; border: 1px solid var(--line); text-align: left; }
.match-candidate-row:hover { border-color: #89aec7; background: #fbfdfe; }
.match-candidate-row.is-top { border-color: #c8a75d; box-shadow: inset 4px 0 var(--red-600); }
.match-candidate-rank { width: 32px; height: 32px; display: grid; place-items: center; color: #fff; background: var(--navy-800); font: 800 12px "DIN Alternate", Arial, sans-serif; }
.match-candidate-row.is-top .match-candidate-rank { background: var(--red-600); }
.match-candidate-person { min-width: 0; display: flex; align-items: center; gap: 9px; }
.match-candidate-person section { min-width: 0; }
.match-candidate-person strong, .match-candidate-person small { display: block; }
.match-candidate-person strong { color: #203f57; font-size: 11px; }
.match-candidate-person small { margin-top: 3px; overflow: hidden; color: var(--soft); font-size: 8px; text-overflow: ellipsis; white-space: nowrap; }
.match-fit-facts { min-width: 0; display: flex; flex-wrap: wrap; gap: 5px; }
.match-fit-facts span { display: inline-flex; align-items: center; gap: 4px; padding: 6px 7px; color: #3e6078; background: #eef4f8; border: 1px solid #d7e4ec; font-size: 8px; white-space: nowrap; }
.match-fit-facts span.is-strong { color: #137566; background: #e8f6f2; border-color: #b9ddd5; }
.match-fit-facts svg { width: 11px; height: 11px; }
.match-fit-facts b { font: 800 9px "DIN Alternate", Arial, sans-serif; }
.match-gap-note { min-width: 0; padding-left: 11px; border-left: 2px solid var(--gold-600); }
.match-gap-note span, .match-gap-note strong, .match-gap-note small { display: block; }
.match-gap-note span { color: var(--soft); font-size: 7px; }
.match-gap-note strong { margin: 4px 0; color: #5a4b30; font-size: 9px; }
.match-gap-note small { color: #8c7b5a; font-size: 7px; line-height: 1.4; }
.match-score-stack { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.match-score-stack > span { min-width: 0; display: grid; grid-template-columns: 1fr auto; gap: 4px; }
.match-score-stack small { color: var(--soft); font-size: 7px; }
.match-score-stack b { color: #315c79; font: 800 10px "DIN Alternate", Arial, sans-serif; }
.match-score-stack i { grid-column: 1 / -1; height: 4px; overflow: hidden; background: #e3eaf0; }
.match-score-stack i::after { width: var(--score); height: 100%; display: block; background: var(--blue-600); content: ""; }
.match-final-score { text-align: right; }
.match-final-score small, .match-final-score span { display: block; color: var(--soft); font-size: 7px; }
.match-final-score strong { display: block; margin: 3px 0; color: var(--red-700); font: 800 22px "DIN Alternate", Arial, sans-serif; }
.match-candidate-open { width: 16px; color: #8ea4b3; }

.match-decision { min-height: 142px; display: grid; grid-template-columns: minmax(260px, .75fr) minmax(430px, 1.15fr) minmax(330px, .9fr); background: var(--navy-900); border: 1px solid #173b5a; }
.match-decision > div { min-width: 0; padding: 18px; border-right: 1px solid rgba(255, 255, 255, .14); }
.match-decision > div:last-child { border-right: 0; }
.match-decision-person > span, .match-score-equation > span, .match-decision-basis > span { color: var(--gold-600); font-size: 8px; font-weight: 750; letter-spacing: .6px; }
.match-decision-person > div { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.match-decision-person section strong, .match-decision-person section small { display: block; }
.match-decision-person section strong { color: #fff; font-size: 15px; }
.match-decision-person section small { margin-top: 3px; color: #9bb1c1; font-size: 8px; }
.match-score-equation { display: grid; grid-template-columns: 1fr 18px 1fr 18px 1fr; gap: 8px; align-items: center; }
.match-score-equation > span { grid-column: 1 / -1; }
.match-score-equation > div { min-height: 70px; display: grid; place-content: center; padding: 8px; background: rgba(255, 255, 255, .07); text-align: center; }
.match-score-equation > div.is-total { background: var(--red-600); }
.match-score-equation b, .match-score-equation small { display: block; }
.match-score-equation b { color: #fff; font: 800 18px "DIN Alternate", Arial, sans-serif; }
.match-score-equation small { margin-top: 4px; color: #abc0cf; font-size: 7px; }
.match-score-equation .is-total small { color: #ffe0e0; }
.match-score-equation > i { color: #8fa8ba; font-style: normal; text-align: center; }
.match-decision-basis p { display: grid; grid-template-columns: 24px 1fr 36px; gap: 7px; align-items: center; margin: 7px 0 0; color: #dbe6ee; }
.match-decision-basis p i { width: 22px; height: 22px; display: grid; place-items: center; color: var(--gold-600); background: rgba(255, 255, 255, .08); }
.match-decision-basis p svg { width: 12px; height: 12px; }
.match-decision-basis p strong { font-size: 8px; font-weight: 600; }
.match-decision-basis p b { color: #fff; font: 800 10px "DIN Alternate", Arial, sans-serif; text-align: right; }

.batch-supplement { background: #fff; border: 1px solid var(--line); }
.batch-supplement > summary { min-height: 64px; display: grid; grid-template-columns: 36px 1fr auto 18px; gap: 10px; align-items: center; padding: 10px 16px; cursor: pointer; list-style: none; }
.batch-supplement > summary::-webkit-details-marker { display: none; }
.batch-supplement > summary > span { width: 34px; height: 34px; display: grid; place-items: center; color: #5f7690; background: #edf2f5; }
.batch-supplement > summary svg { width: 16px; height: 16px; }
.batch-supplement > summary div strong, .batch-supplement > summary div small { display: block; }
.batch-supplement > summary div strong { color: #294a62; font-size: 11px; }
.batch-supplement > summary div small { margin-top: 3px; color: var(--soft); font-size: 8px; }
.batch-supplement > summary > b { color: var(--soft); font-size: 8px; }
.batch-supplement > summary > svg { color: #8197a7; transition: transform 160ms ease; }
.batch-supplement[open] > summary > svg { transform: rotate(180deg); }
.batch-supplement-body { border-top: 1px solid var(--line); background: #f7f9fb; }
.batch-supplement-body > header { min-height: 62px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; background: #fff; border-bottom: 1px solid var(--line); }
.batch-supplement-body > header strong, .batch-supplement-body > header span { display: block; }
.batch-supplement-body > header strong { font-size: 11px; }
.batch-supplement-body > header span { margin-top: 3px; color: var(--soft); font-size: 8px; }
.batch-supplement-empty { min-height: 150px; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 24px; color: var(--muted); }
.batch-supplement-empty > svg { width: 34px; height: 34px; color: #8099ab; }
.batch-supplement-empty strong { display: block; color: #36576f; font-size: 11px; }
.batch-supplement-empty p { margin: 5px 0 0; font-size: 9px; }

.module-tabs { display: flex; gap: 2px; margin-bottom: 12px; border-bottom: 1px solid var(--line-strong); }
.module-tabs button { min-height: 42px; display: inline-flex; align-items: center; gap: 7px; padding: 0 16px; color: var(--muted); background: #e9eef2; border: 0; border-top: 3px solid transparent; font-size: 11px; font-weight: 700; }
.module-tabs button.is-active { color: var(--blue-700); background: #fff; border-top-color: var(--blue-600); }

华辰商贸有限公司近三日接收张某等18个个人账户分散转入资金320万元，其中95%在十分钟内集中转至天津瑞达供应链有限公司和河北新汇科技有限公司。客户申报日用百货贸易，但合同、发票与实际交易用途存在明显差异。。已确认事实：。模型推断：。待核验事项：。甄别人员问题：结合当前案件事实与历史案例进行辅助研判。\n\n历史相似案例：\n[KC-2024-017] 历史案例：贸易企业接收个人分散入账后集中快转。类型：涉诈跑分。资金网络：复杂。处置结论：可疑。案件摘要：贸易企业短期接收大量陌生个人账户入账，并在十分钟内集中转往两个固定企业账户，交易规模与登记经营能力明显不符。。关键事实：三日内接收21名个人账户转入合计286万元；92%的入账资金在十五分钟内转出；收款主体与两个资金去向共用设备指纹；合同交易对手、发票开具方与实际收付款方不一致。风险模式：多人分散入账、集中快速转出、固定资金去向、经营背景不符、设备关联。证据材料：交易流水、资金图谱、客户资料、合同票据、尽调记录。专家关注：核对个人付款人与企业经营关系；穿透固定收款账户受益所有人；比对合同发票物流一致性。核验动作：补充主要订单和物流单据；核实个人付款人身份及付款原因；查询关联账户设备和IP。经验总结：企业客户出现个人分散入账时，必须将资金时序、经营背景和设备关联联合判断，不能只看单笔金额。\n\n[KC-2023-042] 历史案例：电商促销期间个人付款集中归集。类型：涉诈跑分。资金网络：中等。处置结论：正常。案件摘要：电商企业促销期间出现大量个人付款，款项归集至平台结算账户，但订单、支付渠道、物流和纳税记录能够完整对应。。关键事实：个人付款均可对应平台订单编号；资金按照平台结算协议归集；退款比例与历史促销周期一致；物流签收与发票记录完整。风险模式：多人分散入账、集中归集。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：验证订单真实性；核对平台结算关系；检查退款和物流闭环。核验动作：抽样核验订单和物流；取得平台结算协议；核对纳税申报。经验总结：多人付款本身不等于异常，能够形成订单、支付、物流和税务闭环时应充分记录排除依据。\n\n[KC-2024-073] 历史案例：建筑企业公私混同与异常票据循环。类型：涉税风险。资金网络：复杂。处置结论：可疑。案件摘要：建筑材料企业频繁向股东个人账户付款并由个人回流关联供应商，发票品名、金额和物流记录存在循环对应异常。。关键事实：对公资金频繁转入股东个人账户；个人账户向关联供应商回流；多张发票号码连续且物流凭证重复；资金规模显著超过项目施工进度。风险模式：公私混同、关联回流、票据异常、经营规模不符。证据材料：交易流水、资金图谱、客户资料、合同票据。专家关注：核对项目进度和付款节点；识别供应商关联关系；检查票据物流真实性。核验动作：补充项目合同和进度证明；核验供应商受益所有人；抽查发票对应物流。经验总结：涉税线索不能只依赖发票形式，应将资金回流、项目进度和供应商控制关系联合分析。\n\n[KC-2022-086] 历史案例：出口退税回款形成的阶段性跨境回流。类型：跨境资金。资金网络：复杂。处置结论：正常。案件摘要：出口企业在退税和海外经销商集中结算期间出现跨境资金回流，经核验报关、物流、税务和经销协议后能够形成完整业务闭环。。关键事实：回款时间与报关批次一致；海外付款方为长期经销商；回款金额与出口及退税记录匹配；不存在资金再次转回境外。风险模式：跨境集中回款、金额阶段性上升。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：核对出口业务周期；检查境外付款人与合同关系；确认资金最终用途。核验动作：取得报关和物流清单；核对经销协议；抽查回款对应发票。经验总结：跨境回款需要结合企业业务周期判断，不能脱离报关和结算安排孤立评价金额波动。\n\n[KC-2024-091] 历史案例：名单关联主体借贸易合同转移资金。类型：制裁风险。资金网络：复杂。处置结论：可疑。案件摘要：科技设备企业通过名称相近的中间贸易商向高风险地区转移资金，最终受益所有人与外部名单主体存在控制关系。。关键事实：交易对手名称与名单主体高度近似；中间贸易商设立时间短且无实际经营；设备最终目的地与合同不一致；受益所有人穿透后与名单主体关联。风险模式：名单弱匹配、中间贸易商、最终目的地异常、受益所有人关联。证据材料：外部名单、交易流水、资金图谱、合同票据、客户资料。专家关注：进行实体消歧；穿透受益所有人；核对货物最终用户和目的地。核验动作：补充最终用户声明；核验贸易物流路径；查询境外公司控制关系。经验总结：名单弱匹配不能直接下结论，应以注册信息、控制关系、货物流向和受益所有人完成多源消歧。\n\n请输出：核心疑点、相似与差异、证据评价、待核验材料、辅助研判建议、下一步动作和引用来源。"}},"CASE-A:evidence_gap":{"case":{"id":"CASE-A","name":"预警包A｜华辰商贸资金归集快转","case_type":"涉诈跑分","risk_score":92,"complexity_score":88,"network_level":"复杂","evidence_types":["交易流水","资金图谱","客户资料","合同票据","尽调记录"],"material_requirements":"核验多账户资金归集、快速转出、交易背景与合同票据之间的一致性","summary":"北京华辰商贸有限公司近三日接收张某等18个个人账户分散转入资金320万元，其中95%在十分钟内集中转至天津瑞达供应链有限公司和河北新汇科技有限公司。客户申报日用百货贸易，但合同、发票与实际交易用途存在明显差异。","ability_requirements":{"E":0.18,"A":0.2,"N":0.27,"J":0.18,"Q":0.1,"T":0.07}},"task":"evidence_gap","task_label":"识别证据缺口","question":"结合当前案件事实与历史案例进行辅助研判。","retrieval":{"formula":"案例检索分 = 50%×语义相似度 + 20%×案件类型相似度 + 15%×资金网络相似度 + 15%×证据结构相似度","items":[{"case":{"id":"KC-2024-017","title":"贸易企业接收个人分散入账后集中快转","year":2024,"case_type":"涉诈跑分","network_level":"复杂","conclusion":"可疑","quality_score":96,"summary":"贸易企业短期接收大量陌生个人账户入账，并在十分钟内集中转往两个固定企业账户，交易规模与登记经营能力明显不符。","key_facts":["三日内接收21名个人账户转入合计286万元","92%的入账资金在十五分钟内转出","收款主体与两个资金去向共用设备指纹","合同交易对手、发票开具方与实际收付款方不一致"],"evidence_types":["交易流水","资金图谱","客户资料","合同票据","尽调记录"],"risk_patterns":["多人分散入账","集中快速转出","固定资金去向","经营背景不符","设备关联"],"expert_focus":["核对个人付款人与企业经营关系","穿透固定收款账户受益所有人","比对合同发票物流一致性"],"verification_actions":["补充主要订单和物流单据","核实个人付款人身份及付款原因","查询关联账户设备和IP"],"disposition":"经增强尽调后确认客户无法合理解释资金来源及交易背景，形成STR并持续关注关联账户。","review_outcome":"复核通过，未退回；后续关联账户线索被采用。","lessons":"企业客户出现个人分散入账时，必须将资金时序、经营背景和设备关联联合判断，不能只看单笔金额。","source":"演示脱敏案例库"},"scores":{"semantic":87.6,"case_type":100,"network":100,"evidence":100,"hybrid":93.8},"shared_evidence":["交易流水","合同票据","客户资料","尽调记录","资金图谱"]},{"case":{"id":"KC-2023-042","title":"电商促销期间个人付款集中归集","year":2023,"case_type":"涉诈跑分","network_level":"中等","conclusion":"正常","quality_score":92,"summary":"电商企业促销期间出现大量个人付款，款项归集至平台结算账户，但订单、支付渠道、物流和纳税记录能够完整对应。","key_facts":["个人付款均可对应平台订单编号","资金按照平台结算协议归集","退款比例与历史促销周期一致","物流签收与发票记录完整"],"evidence_types":["交易流水","客户资料","合同票据","尽调记录"],"risk_patterns":["多人分散入账","集中归集"],"expert_focus":["验证订单真实性","核对平台结算关系","检查退款和物流闭环"],"verification_actions":["抽样核验订单和物流","取得平台结算协议","核对纳税申报"],"disposit 是银行反洗钱可疑预警甄别辅助模型。只能依据提供的当前案件事实、历史案例和业务约束回答。必须区分已确认事实、模型推断和待核验事项；不得把案件类型候选作为法律定性；每项关键判断必须引用当前证据来源或历史案例编号；证据不足时明确说明暂无法判断。","user":"任务：识别证据缺口\n当前案件：预警包A｜华辰商贸资金归集快转。案件类型候选：涉诈跑分。风险分：92。复杂度：88。资金网络：复杂。案件摘要：北京华辰商贸有限公司近三日接收张某等18个个人账户分散转入资金320万元，其中95%在十分钟内集中转至天津瑞达供应链有限公司和河北新汇科技有限公司。客户申报日用百货贸易，但合同、发票与实际交易用途存在明显差异。。已确认事实：。模型推断：。待核验事项：。甄别人员问题：结合当前案件事实与历史案例进行辅助研判。\n\n历史相似案例：\n[KC-2024-017] 历史案例：贸易企业接收个人分散入账后集中快转。类型：涉诈跑分。资金网络：复杂。处置结论：可疑。案件摘要：贸易企业短期接收大量陌生个人账户入账，并在十分钟内集中转往两个固定企业账户，交易规模与登记经营能力明显不符。。关键事实：三日内接收21名个人账户转入合计286万元；92%的入账资金在十五分钟内转出；收款主体与两个资金去向共用设备指纹；合同交易对手、发票开具方与实际收付款方不一致。风险模式：多人分散入账、集中快速转出、固定资金去向、经营背景不符、设备关联。证据材料：交易流水、资金图谱、客户资料、合同票据、尽调记录。专家关注：核对个人付款人与企业经营关系；穿透固定收款账户受益所有人；比对合同发票物流一致性。核验动作：补充主要订单和物流单据；核实个人付款人身份及付款原因；查询关联账户设备和IP。经验总结：企业客户出现个人分散入账时，必须将资金时序、经营背景和设备关联联合判断，不能只看单笔金额。\n\n[KC-2023-042] 历史案例：电商促销期间个人付款集中归集。类型：涉诈跑分。资金网络：中等。处置结论：正常。案件摘要：电商企业促销期间出现大量个人付款，款项归集至平台结算账户，但订单、支付渠道、物流和纳税记录能够完整对应。。关键事实：个人付款均可对应平台订单编号；资金按照平台结算协议归集；退款比例与历史促销周期一致；物流签收与发票记录完整。风险模式：多人分散入账、集中归集。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：验证订单真实性；核对平台结算关系；检查退款和物流闭环。核验动作：抽样核验订单和物流；取得平台结算协议；核对纳税申报。经验总结：多人付款本身不等于异常，能够形成订单、支付、物流和税务闭环时应充分记录排除依据。\n\n[KC-2024-073] 历史案例：建筑企业公私混同与异常票据循环。类型：涉税风险。资金网络：复杂。处置结论：可疑。案件摘要：建筑材料企业频繁向股东个人账户付款并由个人回流关联供应商，发票品名、金额和物流记录存在循环对应异常。。关键事实：对公资金频繁转入股东个人账户；个人账户向关联供应商回流；多张发票号码连续且物流凭证重复；资金规模显著超过项目施工进度。风险模式：公私混同、关联回流、票据异常、经营规模不符。证据材料：交易流水、资金图谱、客户资料、合同票据。专家关注：核对项目进度和付款节点；识别供应商关联关系；检查票据物流真实性。核验动作：补充项目合同和进度证明；核验供应商受益所有人；抽查发票对应物流。经验总结：涉税线索不能只依赖发票形式，应将资金回流、项目进度和供应商控制关系联合分析。\n\n[KC-2022-086] 历史案例：出口退税回款形成的阶段性跨境回流。类型：跨境资金。资金网络：复杂。处置结论：正常。案件摘要：出口企业在退税和海外经销商集中结算期间出现跨境资金回流，经核验报关、物流、税务和经销协议后能够形成完整业务闭环。。关键事实：回款时间与报关批次一致；海外付款方为长期经销商；回款金额与出口及退税记录匹配；不存在资金再次转回境外。风险模式：跨境集中回款、金额阶段性上升。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：核对出口业务周期；检查境外付款人与合同关系；确认资金最终用途。核验动作：取得报关和物流清单；核对经销协议；抽查回款对应发票。经验总结：跨境回款需要结合企业业务周期判断，不能脱离报关和结算安排孤立评价金额波动。\n\n[KC-2024-091] 历史案例：名单关联主体借贸易合同转移资金。类型：制裁风险。资金网络：复杂。处置结论：可疑。案件摘要：科技设备企业通过名称相近的中间贸易商向高风险地区转移资金，最终受益所有人与外部名单主体存在控制关系。。关键事实：交易对手名称与名单主体高度近似；中间贸易商设立时间短且无实际经营；设备最终目的地与合同不一致；受益所有人穿透后与名单主体关联。风险模式：名单弱匹配、中间贸易商、最终目的地异常、受益所有人关联。证据材料：外部名单、交易流水、资金图谱、合同票据、客户资料。专家关注：进行实体消歧；穿透受益所有人；核对货物最终用户和目的地。核验动作：补充最终用户声明；核验贸易物流路径；查询境外公司控制关系。经验总结：名单弱匹配不能直接下结论，应以注册信息、控制关系、货物流向和受益所有人完成多源消歧。\n\n请输出：核心疑点、相似与差异、证据评价、待核验材料、辅助研判建议、下一步动作和引用来源。"}},"CASE-A:investigation":{"case":{"id":"CASE-A","name":"预警包A｜华辰商贸资金归集快转","case_type":"涉诈跑分","risk_score":92,"complexity_score":88,"network_level":"复杂","evidence_types":["交易流水","资金图谱","客户资料","合同票据","尽调记录"],"material_requirements":"核验多账户资金归集、快速转出、交易背景与合同票据之间的一致性","summary":"北京华辰商贸有限公司近三日接收张某等18个个人账户分散转入资金320万元，其中95%在十分钟内集中转至天津瑞达供应链有限公司和河北新汇科技有限公司。客户申报日用百货贸易，但合同、发票与实际交易用途存在明显差异。","ability_requirements":{"E":0.18,"A":0.2,"N":0.27,"J":0.18,"Q":0.1,"T":0.07}},"task":"investigation","task_label":"生成增强尽调清单","question":"结合当前案件事实与历史案例进行辅助研判。","retrieval":{"formula":"案例检索分 = 50%×语义相似度 + 20%×案件类型相似度 + 15%×资金网络相似度 + 15%×证据结构相似度","items":[{"case":{"id":"KC-2024-017","title":"贸易企业接收个人分散入账后集中快转","year":2024,"case_type":"涉诈跑分","network_level":"复杂","conclusion":"可疑","quality_score":96,"summary":"贸易企业短期接收大量陌生个人账户入账，并在十分钟内集中转往两个固定企业账户，交易规模与登记经营能力明显不符。","key_facts":["三日内接收21名个人账户转入合计286万元","92%的入账资金在十五分钟内转出","收款主体与两个资金去向共用设备指纹","合同交易对手、发票开具方与实际收付款方不一致"],"evidence_types":["交易流水","资金图谱","客户资料","合同票据","尽调记录"],"risk_patterns":["多人分散入账","集中快速转出","固定资金去向","经营背景不符","设备关联"],"expert_focus":["核对个人付款人与企业经营关系","穿透固定收款账户受益所有人","比对合同发票物流一致性"],"verification_actions":["补充主要订单和物流单据","核实个人付款人身份及付款原因","查询关联账户设备和IP"],"disposition":"经增强尽调后确认客户无法合理解释资金来源及交易背景，形成STR并持续关注关联账户。","review_outcome":"复核通过，未退回；后续关联账户线索被采用。","lessons":"企业客户出现个人分散入账时，必须将资金时序、经营背景和设备关联联合判断，不能只看单笔金额。","source":"演示脱敏案例库"},"scores":{"semantic":87.6,"case_type":100,"network":100,"evidence":100,"hybrid":93.8},"shared_evidence":["交易流水","合同票据","客户资料","尽调记录","资金图谱"]},{"case":{"id":"KC-2023-042","title":"电商促销期间个人付款集中归集","year":2023,"case_type":"涉诈跑分","network_level":"中等","conclusion":"正常","quality_score":92,"summary":"电商企业促销期间出现大量个人付款，款项归集至平台结算账户，但订单、支付渠道、物流和纳税记录能够完整对应。","key_facts":["个人付款均可对应平台订单编号","资金按照平台结算协议归集","退款比例与历史促销周期一致","物流签收与 建筑企业公私混同与异常票据循环","source":"演示脱敏案例库"},{"id":"KC-2022-086","title":"出口退税回款形成的阶段性跨境回流","source":"演示脱敏案例库"},{"id":"KC-2024-091","title":"名单关联主体借贸易合同转移资金","source":"演示脱敏案例库"}]},"prompt_package":{"system":"你是银行反洗钱可疑预警甄别辅助模型。只能依据提供的当前案件事实、历史案例和业务约束回答。必须区分已确认事实、模型推断和待核验事项；不得把案件类型候选作为法律定性；每项关键判断必须引用当前证据来源或历史案例编号；证据不足时明确说明暂无法判断。","user":"任务：生成增强尽调清单\n当前案件：预警包A｜华辰商贸资金归集快转。案件类型候选：涉诈跑分。风险分：92。复杂度：88。资金网络：复杂。案件摘要：北京华辰商贸有限公司近三日接收张某等18个个人账户分散转入资金320万元，其中95%在十分钟内集中转至天津瑞达供应链有限公司和河北新汇科技有限公司。客户申报日用百货贸易，但合同、发票与实际交易用途存在明显差异。。已确认事实：。模型推断：。待核验事项：。甄别人员问题：结合当前案件事实与历史案例进行辅助研判。\n\n历史相似案例：\n[KC-2024-017] 历史案例：贸易企业接收个人分散入账后集中快转。类型：涉诈跑分。资金网络：复杂。处置结论：可疑。案件摘要：贸易企业短期接收大量陌生个人账户入账，并在十分钟内集中转往两个固定企业账户，交易规模与登记经营能力明显不符。。关键事实：三日内接收21名个人账户转入合计286万元；92%的入账资金在十五分钟内转出；收款主体与两个资金去向共用设备指纹；合同交易对手、发票开具方与实际收付款方不一致。风险模式：多人分散入账、集中快速转出、固定资金去向、经营背景不符、设备关联。证据材料：交易流水、资金图谱、客户资料、合同票据、尽调记录。专家关注：核对个人付款人与企业经营关系；穿透固定收款账户受益所有人；比对合同发票物流一致性。核验动作：补充主要订单和物流单据；核实个人付款人身份及付款原因；查询关联账户设备和IP。经验总结：企业客户出现个人分散入账时，必须将资金时序、经营背景和设备关联联合判断，不能只看单笔金额。\n\n[KC-2023-042] 历史案例：电商促销期间个人付款集中归集。类型：涉诈跑分。资金网络：中等。处置结论：正常。案件摘要：电商企业促销期间出现大量个人付款，款项归集至平台结算账户，但订单、支付渠道、物流和纳税记录能够完整对应。。关键事实：个人付款均可对应平台订单编号；资金按照平台结算协议归集；退款比例与历史促销周期一致；物流签收与发票记录完整。风险模式：多人分散入账、集中归集。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：验证订单真实性；核对平台结算关系；检查退款和物流闭环。核验动作：抽样核验订单和物流；取得平台结算协议；核对纳税申报。经验总结：多人付款本身不等于异常，能够形成订单、支付、物流和税务闭环时应充分记录排除依据。\n\n[KC-2024-073] 历史案例：建筑企业公私混同与异常票据循环。类型：涉税风险。资金网络：复杂。处置结论：可疑。案件摘要：建筑材料企业频繁向股东个人账户付款并由个人回流关联供应商，发票品名、金额和物流记录存在循环对应异常。。关键事实：对公资金频繁转入股东个人账户；个人账户向关联供应商回流；多张发票号码连续且物流凭证重复；资金规模显著超过项目施工进度。风险模式：公私混同、关联回流、票据异常、经营规模不符。证据材料：交易流水、资金图谱、客户资料、合同票据。专家关注：核对项目进度和付款节点；识别供应商关联关系；检查票据物流真实性。核验动作：补充项目合同和进度证明；核验供应商受益所有人；抽查发票对应物流。经验总结：涉税线索不能只依赖发票形式，应将资金回流、项目进度和供应商控制关系联合分析。\n\n[KC-2022-086] 历史案例：出口退税回款形成的阶段性跨境回流。类型：跨境资金。资金网络：复杂。处置结论：正常。案件摘要：出口企业在退税和海外经销商集中结算期间出现跨境资金回流，经核验报关、物流、税务和经销协议后能够形成完整业务闭环。。关键事实：回款时间与报关批次一致；海外付款方为长期经销商；回款金额与出口及退税记录匹配；不存在资金再次转回境外。风险模式：跨境集中回款、金额阶段性上升。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：核对出口业务周期；检查境外付款人与合同关系；确认资金最终用途。核验动作：取得报关和物流清单；核对经销协议；抽查回款对应发票。经验总结：跨境回款需要结合企业业务周期判断，不能脱离报关和结算安排孤立评价金额波动。\n\n[KC-2024-091] 历史案例：名单关联主体借贸易合同转移资金。类型：制裁风险。资金网络：复杂。处置结论：可疑。案件摘要：科技设备企业通过名称相近的中间贸易商向高风险地区转移资金，最终受益所有人与外部名单主体存在控制关系。。关键事实：交易对手名称与名单主体高度近似；中间贸易商设立时间短且无实际经营；设备最终目的地与合同不一致；受益所有人穿透后与名单主体关联。风险模式：名单弱匹配、中间贸易商、最终目的地异常、受益所有人关联。证据材料：外部名单、交易流水、资金图谱、合同票据、客户资料。专家关注：进行实体消歧；穿透受益所有人；核对货物最终用户和目的地。核验动作：补充最终用户声明；核验贸易物流路径；查询境外公司控制关系。经验总结：名单弱匹配不能直接下结论，应以注册信息、控制关系、货物流向和受益所有人完成多源消歧。\n\n请输出：核心疑点、相似与差异、证据评价、待核验材料、辅助研判建议、下一步动作和引用来源。"}},"CASE-A:comparison":{"case":{"id":"CASE-A","name":"预警包A｜华辰商贸资金归集快转","case_type":"涉诈跑分","risk_score":92,"complexity_score":88,"network_level":"复杂","evidence_types":["交易流水","资金图谱","客户资料","合同票据","尽调记录"],"material_requirements":"核验多账户资金归集、快速转出、交易背景与合同票据之间的一致性","summary":"北京华辰商贸有限公司近三日接收张某等18个个人账户分散转入资金320万元，其中95%在十分钟内集中转至天津瑞达供应链有限公司和河北新汇科技有限公司。客户申报日用百货贸易，但合同、发票与实际交易用途存在明显差异。","ability_requirements":{"E":0.18,"A":0.2,"N":0.27,"J":0.18,"Q":0.1,"T":0.07}},"task":"comparison","task_label":"对比历史相似案例","question":"结合当前案件事实与历史案例进行辅助研判。","retrieval":{"formula":"案例检索分 = 50%×语义相似度 + 20%×案件类型相似度 + 15%×资金网络相似度 + 15%×证据结构相似度","items":[{"case":{"id":"KC-2024-017","title":"贸易企业接收个人分散入账后集中快转","year":2024,"case_type":"涉诈跑分","network_level":"复杂","conclusion":"可疑","quality_score":96,"summary":"贸易企业短期接收大量陌生个人账户入账，并在十分钟内集中转往两个固定企业账户，交易规模与登记经营能力明显不符。","key_facts":["三日内接收21名个人账户转入合计286万元","92%的入账资金在十五分钟内转出","收款主体与两个资金去向共用设备指纹","合同交易对手、发票开具方与实际收付款方不一致"],"evidence_types":["交易流水","资金图谱","客户资料","合同票据","尽调记录"],"risk_patterns":["多人分散入账","集中快速转出","固定资金去向","经营背景不符","设备关联"],"expert_focus":["核对个人付款人与企业经营关系","穿透固定收款账户受益所有人","比对合同发票物流一致性"],"verification_actions":["补充主要订单和物流单据","核实个人付款人身份及付款原因","查询关联账户设备和IP"],"disposition":"经增强尽调后确认客户无法合理解释资金来源及交易背景，形成STR并持续关注关联账户。","review_outcome":"复核通过，未退回；后续关联账户线索被采用。","lessons":"企业客户出现个人分散入账时，必须将资金时序、经营背景和设备关联联合判断，不能只看单笔金额。","source":"演示脱敏案例库"},"scores":{"semantic":87.6,"case_type":100,"network":100,"evidence":100,"hybrid":93.8},"shared_evidence":["交易流水","合同票据","客户资料","尽调记录","资金图谱"]},{"case":{"id":"KC-2023-042","title":"电商促销期间个人付款集中归集","year":2023,"case_type": P","抽样核验订单和物流","取得平台结算协议"],"citations":[{"id":"KC-2024-017","title":"贸易企业接收个人分散入账后集中快转","source":"演示脱敏案例库"},{"id":"KC-2023-042","title":"电商促销期间个人付款集中归集","source":"演示脱敏案例库"},{"id":"KC-2024-073","title":"建筑企业公私混同与异常票据循环","source":"演示脱敏案例库"},{"id":"KC-2022-086","title":"出口退税回款形成的阶段性跨境回流","source":"演示脱敏案例库"},{"id":"KC-2024-091","title":"名单关联主体借贸易合同转移资金","source":"演示脱敏案例库"}]},"prompt_package":{"system":"你是银行反洗钱可疑预警甄别辅助模型。只能依据提供的当前案件事实、历史案例和业务约束回答。必须区分已确认事实、模型推断和待核验事项；不得把案件类型候选作为法律定性；每项关键判断必须引用当前证据来源或历史案例编号；证据不足时明确说明暂无法判断。","user":"任务：对比历史相似案例\n当前案件：预警包A｜华辰商贸资金归集快转。案件类型候选：涉诈跑分。风险分：92。复杂度：88。资金网络：复杂。案件摘要：北京华辰商贸有限公司近三日接收张某等18个个人账户分散转入资金320万元，其中95%在十分钟内集中转至天津瑞达供应链有限公司和河北新汇科技有限公司。客户申报日用百货贸易，但合同、发票与实际交易用途存在明显差异。。已确认事实：。模型推断：。待核验事项：。甄别人员问题：结合当前案件事实与历史案例进行辅助研判。\n\n历史相似案例：\n[KC-2024-017] 历史案例：贸易企业接收个人分散入账后集中快转。类型：涉诈跑分。资金网络：复杂。处置结论：可疑。案件摘要：贸易企业短期接收大量陌生个人账户入账，并在十分钟内集中转往两个固定企业账户，交易规模与登记经营能力明显不符。。关键事实：三日内接收21名个人账户转入合计286万元；92%的入账资金在十五分钟内转出；收款主体与两个资金去向共用设备指纹；合同交易对手、发票开具方与实际收付款方不一致。风险模式：多人分散入账、集中快速转出、固定资金去向、经营背景不符、设备关联。证据材料：交易流水、资金图谱、客户资料、合同票据、尽调记录。专家关注：核对个人付款人与企业经营关系；穿透固定收款账户受益所有人；比对合同发票物流一致性。核验动作：补充主要订单和物流单据；核实个人付款人身份及付款原因；查询关联账户设备和IP。经验总结：企业客户出现个人分散入账时，必须将资金时序、经营背景和设备关联联合判断，不能只看单笔金额。\n\n[KC-2023-042] 历史案例：电商促销期间个人付款集中归集。类型：涉诈跑分。资金网络：中等。处置结论：正常。案件摘要：电商企业促销期间出现大量个人付款，款项归集至平台结算账户，但订单、支付渠道、物流和纳税记录能够完整对应。。关键事实：个人付款均可对应平台订单编号；资金按照平台结算协议归集；退款比例与历史促销周期一致；物流签收与发票记录完整。风险模式：多人分散入账、集中归集。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：验证订单真实性；核对平台结算关系；检查退款和物流闭环。核验动作：抽样核验订单和物流；取得平台结算协议；核对纳税申报。经验总结：多人付款本身不等于异常，能够形成订单、支付、物流和税务闭环时应充分记录排除依据。\n\n[KC-2024-073] 历史案例：建筑企业公私混同与异常票据循环。类型：涉税风险。资金网络：复杂。处置结论：可疑。案件摘要：建筑材料企业频繁向股东个人账户付款并由个人回流关联供应商，发票品名、金额和物流记录存在循环对应异常。。关键事实：对公资金频繁转入股东个人账户；个人账户向关联供应商回流；多张发票号码连续且物流凭证重复；资金规模显著超过项目施工进度。风险模式：公私混同、关联回流、票据异常、经营规模不符。证据材料：交易流水、资金图谱、客户资料、合同票据。专家关注：核对项目进度和付款节点；识别供应商关联关系；检查票据物流真实性。核验动作：补充项目合同和进度证明；核验供应商受益所有人；抽查发票对应物流。经验总结：涉税线索不能只依赖发票形式，应将资金回流、项目进度和供应商控制关系联合分析。\n\n[KC-2022-086] 历史案例：出口退税回款形成的阶段性跨境回流。类型：跨境资金。资金网络：复杂。处置结论：正常。案件摘要：出口企业在退税和海外经销商集中结算期间出现跨境资金回流，经核验报关、物流、税务和经销协议后能够形成完整业务闭环。。关键事实：回款时间与报关批次一致；海外付款方为长期经销商；回款金额与出口及退税记录匹配；不存在资金再次转回境外。风险模式：跨境集中回款、金额阶段性上升。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：核对出口业务周期；检查境外付款人与合同关系；确认资金最终用途。核验动作：取得报关和物流清单；核对经销协议；抽查回款对应发票。经验总结：跨境回款需要结合企业业务周期判断，不能脱离报关和结算安排孤立评价金额波动。\n\n[KC-2024-091] 历史案例：名单关联主体借贸易合同转移资金。类型：制裁风险。资金网络：复杂。处置结论：可疑。案件摘要：科技设备企业通过名称相近的中间贸易商向高风险地区转移资金，最终受益所有人与外部名单主体存在控制关系。。关键事实：交易对手名称与名单主体高度近似；中间贸易商设立时间短且无实际经营；设备最终目的地与合同不一致；受益所有人穿透后与名单主体关联。风险模式：名单弱匹配、中间贸易商、最终目的地异常、受益所有人关联。证据材料：外部名单、交易流水、资金图谱、合同票据、客户资料。专家关注：进行实体消歧；穿透受益所有人；核对货物最终用户和目的地。核验动作：补充最终用户声明；核验贸易物流路径；查询境外公司控制关系。经验总结：名单弱匹配不能直接下结论，应以注册信息、控制关系、货物流向和受益所有人完成多源消歧。\n\n请输出：核心疑点、相似与差异、证据评价、待核验材料、辅助研判建议、下一步动作和引用来源。"}},"CASE-B:assessment":{"case":{"id":"CASE-B","name":"预警包B｜多层跨境资金回流","case_type":"跨境资金","risk_score":79,"complexity_score":94,"network_level":"高度复杂","evidence_types":["交易流水","资金图谱","合同票据","外部名单","尽调记录"],"material_requirements":"梳理境内外资金链路，核验贸易真实性、受益所有人及名单关联","summary":"境内外七个主体之间出现分层汇款和资金回流，申报金额与合同金额不一致，部分境外受益人与境内股东存在交叉持股关系。","ability_requirements":{"E":0.17,"A":0.18,"N":0.3,"J":0.17,"Q":0.08,"T":0.1}},"task":"assessment","task_label":"生成辅助研判意见","question":"结合当前案件事实与历史案例进行辅助研判。","retrieval":{"formula":"案例检索分 = 50%×语义相似度 + 20%×案件类型相似度 + 15%×资金网络相似度 + 15%×证据结构相似度","items":[{"case":{"id":"KC-2024-031","title":"多层跨境回流与贸易背景不一致","year":2024,"case_type":"跨境资金","network_level":"高度复杂","conclusion":"可疑","quality_score":97,"summary":"资金经境内多个贸易主体分拆后汇往境外，再由关联离岸公司以服务费名义回流，贸易单据与实际货运不匹配。","key_facts":["资金经过四层账户分拆","境外收款人与境内股东存在隐性关联","报关金额与跨境付款金额差异显著","服务合同缺少具体交付成果"],"evidence_types":["交易流水","资金图谱","合同票据","外部名单","尽调记录"],"risk_patterns":["多层资金链","跨境回流","关联交易","贸易背景异常"],"expert_focus":["穿透境外受益所有人","比对报关物流和付款","识别循环回流路径"],"verification_actions":["补充报关单和物流凭证","核实境外主体控制关系","核验服务交付成果"],"disposition":"形成跨境资金异常STR，并将关联主体纳入持续监测。","review_outcome":"复核通过；报告关键路径图被评为高质量。","lessons":"跨境案件应优先还原资金闭环和控制关系，再判断合同形式是否具有真实经济目的。","source":"演示脱敏案例库"},"scores":{"semantic":99,"case_type":100,"network":100,"evidence":100,"hybrid":99.5},"shared_evidence":["交易流水","合同票据","外部名单","尽调记录","资金图谱"]},{"case":{"id":"K 2024-031"},{"value":"核实境外主体控制关系","source":"KC-2024-031"},{"value":"核验服务交付成果","source":"KC-2024-031"}],"recommendation":{"label":"建议沿可疑方向继续研判，完成关键材料核验后再形成处置结论","confidence":"中高","basis":"综合当前案件事实及5个历史案例进行知识增强分析"},"actions":["补充报关单和物流凭证","核实境外主体控制关系","核验服务交付成果","取得报关和物流清单","核对经销协议"],"citations":[{"id":"KC-2024-031","title":"多层跨境回流与贸易背景不一致","source":"演示脱敏案例库"},{"id":"KC-2022-086","title":"出口退税回款形成的阶段性跨境回流","source":"演示脱敏案例库"},{"id":"KC-2024-055","title":"个人账户分拆结售汇与地下钱庄链路","source":"演示脱敏案例库"},{"id":"KC-2024-017","title":"贸易企业接收个人分散入账后集中快转","source":"演示脱敏案例库"},{"id":"KC-2024-091","title":"名单关联主体借贸易合同转移资金","source":"演示脱敏案例库"}]},"prompt_package":{"system":"你是银行反洗钱可疑预警甄别辅助模型。只能依据提供的当前案件事实、历史案例和业务约束回答。必须区分已确认事实、模型推断和待核验事项；不得把案件类型候选作为法律定性；每项关键判断必须引用当前证据来源或历史案例编号；证据不足时明确说明暂无法判断。","user":"任务：生成辅助研判意见\n当前案件：预警包B｜多层跨境资金回流。案件类型候选：跨境资金。风险分：79。复杂度：94。资金网络：高度复杂。案件摘要：境内外七个主体之间出现分层汇款和资金回流，申报金额与合同金额不一致，部分境外受益人与境内股东存在交叉持股关系。。已确认事实：。模型推断：。待核验事项：。甄别人员问题：结合当前案件事实与历史案例进行辅助研判。\n\n历史相似案例：\n[KC-2024-031] 历史案例：多层跨境回流与贸易背景不一致。类型：跨境资金。资金网络：高度复杂。处置结论：可疑。案件摘要：资金经境内多个贸易主体分拆后汇往境外，再由关联离岸公司以服务费名义回流，贸易单据与实际货运不匹配。。关键事实：资金经过四层账户分拆；境外收款人与境内股东存在隐性关联；报关金额与跨境付款金额差异显著；服务合同缺少具体交付成果。风险模式：多层资金链、跨境回流、关联交易、贸易背景异常。证据材料：交易流水、资金图谱、合同票据、外部名单、尽调记录。专家关注：穿透境外受益所有人；比对报关物流和付款；识别循环回流路径。核验动作：补充报关单和物流凭证；核实境外主体控制关系；核验服务交付成果。经验总结：跨境案件应优先还原资金闭环和控制关系，再判断合同形式是否具有真实经济目的。\n\n[KC-2022-086] 历史案例：出口退税回款形成的阶段性跨境回流。类型：跨境资金。资金网络：复杂。处置结论：正常。案件摘要：出口企业在退税和海外经销商集中结算期间出现跨境资金回流，经核验报关、物流、税务和经销协议后能够形成完整业务闭环。。关键事实：回款时间与报关批次一致；海外付款方为长期经销商；回款金额与出口及退税记录匹配；不存在资金再次转回境外。风险模式：跨境集中回款、金额阶段性上升。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：核对出口业务周期；检查境外付款人与合同关系；确认资金最终用途。核验动作：取得报关和物流清单；核对经销协议；抽查回款对应发票。经验总结：跨境回款需要结合企业业务周期判断，不能脱离报关和结算安排孤立评价金额波动。\n\n[KC-2024-055] 历史案例：个人账户分拆结售汇与地下钱庄链路。类型：地下钱庄。资金网络：高度复杂。处置结论：可疑。案件摘要：多个个人账户在相近时点分拆购汇并汇往不同境外主体，境内资金来源集中，账户之间存在设备、地址和介绍人关联。。关键事实：八名个人连续多日接近限额购汇；购汇资金由两个境内账户集中提供；境外收款主体注册信息高度重合；多个账户共用设备和联系地址。风险模式：分拆结售汇、集中资金来源、共同设备、境外主体关联。证据材料：交易流水、资金图谱、客户资料、外部名单。专家关注：识别组织控制关系；还原资金来源和境外去向；核对购汇用途证明。核验动作：核实个人之间关系；补充购汇用途材料；穿透境外主体信息。经验总结：分拆结售汇案件的核心不是单个账户额度，而是共同资金来源、共同控制特征和境外去向之间的组合关系。\n\n[KC-2024-017] 历史案例：贸易企业接收个人分散入账后集中快转。类型：涉诈跑分。资金网络：复杂。处置结论：可疑。案件摘要：贸易企业短期接收大量陌生个人账户入账，并在十分钟内集中转往两个固定企业账户，交易规模与登记经营能力明显不符。。关键事实：三日内接收21名个人账户转入合计286万元；92%的入账资金在十五分钟内转出；收款主体与两个资金去向共用设备指纹；合同交易对手、发票开具方与实际收付款方不一致。风险模式：多人分散入账、集中快速转出、固定资金去向、经营背景不符、设备关联。证据材料：交易流水、资金图谱、客户资料、合同票据、尽调记录。专家关注：核对个人付款人与企业经营关系；穿透固定收款账户受益所有人；比对合同发票物流一致性。核验动作：补充主要订单和物流单据；核实个人付款人身份及付款原因；查询关联账户设备和IP。经验总结：企业客户出现个人分散入账时，必须将资金时序、经营背景和设备关联联合判断，不能只看单笔金额。\n\n[KC-2024-091] 历史案例：名单关联主体借贸易合同转移资金。类型：制裁风险。资金网络：复杂。处置结论：可疑。案件摘要：科技设备企业通过名称相近的中间贸易商向高风险地区转移资金，最终受益所有人与外部名单主体存在控制关系。。关键事实：交易对手名称与名单主体高度近似；中间贸易商设立时间短且无实际经营；设备最终目的地与合同不一致；受益所有人穿透后与名单主体关联。风险模式：名单弱匹配、中间贸易商、最终目的地异常、受益所有人关联。证据材料：外部名单、交易流水、资金图谱、合同票据、客户资料。专家关注：进行实体消歧；穿透受益所有人；核对货物最终用户和目的地。核验动作：补充最终用户声明；核验贸易物流路径；查询境外公司控制关系。经验总结：名单弱匹配不能直接下结论，应以注册信息、控制关系、货物流向和受益所有人完成多源消歧。\n\n请输出：核心疑点、相似与差异、证据评价、待核验材料、辅助研判建议、下一步动作和引用来源。"}},"CASE-B:evidence_gap":{"case":{"id":"CASE-B","name":"预警包B｜多层跨境资金回流","case_type":"跨境资金","risk_score":79,"complexity_score":94,"network_level":"高度复杂","evidence_types":["交易流水","资金图谱","合同票据","外部名单","尽调记录"],"material_requirements":"梳理境内外资金链路，核验贸易真实性、受益所有人及名单关联","summary":"境内外七个主体之间出现分层汇款和资金回流，申报金额与合同金额不一致，部分境外受益人与境内股东存在交叉持股关系。","ability_requirements":{"E":0.17,"A":0.18,"N":0.3,"J":0.17,"Q":0.08,"T":0.1}},"task":"evidence_gap","task_label":"识别证据缺口","question":"结合当前案件事实与历史案例进行辅助研判。","retrieval":{"formula":"案例检索分 = 50%×语义相似度 + 20%×案件类型相似度 + 15%×资金网络相似度 + 15%×证据结构相似度","items":[{"case":{"id":"KC-2024-031","title":"多层跨境回流与贸易背景不一致","year":2024,"case_type":"跨境资金","network_level":"高度复杂","conclusion":"可疑","quality_score":97,"summary":"资金经境内多个贸易主体分拆后汇往境外，再由关联离岸公司以服务费名义回流，贸易单据与实际货运不匹配。","key_facts":["资金经过四层账户分拆","境外收款人与境内股东存在隐性关联","报关金额与跨境付款金额差异显著","服务合同缺少具体交付成果"],"evidence_types":["交易流水","资金图谱","合同票据","外部名单","尽调记录"],"risk_patterns":["多层资金链","跨境回流","关联交易","贸易背景异常"],"expert_focus":["穿透境外受益所有人","比对报关物流和付款","识别循环回流路径"],"verification_actions":["补充报关单和物流凭证","核实境外主体控制关系","核验服务交付成果"],"disposition":"形成跨境资金异常STR，并将关联主体纳入持续监测。","review_outcome":"复核通过；报 055","title":"个人账户分拆结售汇与地下钱庄链路","similarity":78.1,"conclusion":"可疑","reason":"分拆结售汇；集中资金来源；共同设备"}],"gaps":[{"value":"补充报关单和物流凭证","source":"KC-2024-031"},{"value":"核实境外主体控制关系","source":"KC-2024-031"},{"value":"核验服务交付成果","source":"KC-2024-031"}],"recommendation":{"label":"建议沿可疑方向继续研判，完成关键材料核验后再形成处置结论","confidence":"中高","basis":"综合当前案件事实及5个历史案例进行知识增强分析"},"actions":["补充报关单和物流凭证","核实境外主体控制关系","核验服务交付成果","取得报关和物流清单","核对经销协议"],"citations":[{"id":"KC-2024-031","title":"多层跨境回流与贸易背景不一致","source":"演示脱敏案例库"},{"id":"KC-2022-086","title":"出口退税回款形成的阶段性跨境回流","source":"演示脱敏案例库"},{"id":"KC-2024-055","title":"个人账户分拆结售汇与地下钱庄链路","source":"演示脱敏案例库"},{"id":"KC-2024-017","title":"贸易企业接收个人分散入账后集中快转","source":"演示脱敏案例库"},{"id":"KC-2024-091","title":"名单关联主体借贸易合同转移资金","source":"演示脱敏案例库"}]},"prompt_package":{"system":"你是银行反洗钱可疑预警甄别辅助模型。只能依据提供的当前案件事实、历史案例和业务约束回答。必须区分已确认事实、模型推断和待核验事项；不得把案件类型候选作为法律定性；每项关键判断必须引用当前证据来源或历史案例编号；证据不足时明确说明暂无法判断。","user":"任务：识别证据缺口\n当前案件：预警包B｜多层跨境资金回流。案件类型候选：跨境资金。风险分：79。复杂度：94。资金网络：高度复杂。案件摘要：境内外七个主体之间出现分层汇款和资金回流，申报金额与合同金额不一致，部分境外受益人与境内股东存在交叉持股关系。。已确认事实：。模型推断：。待核验事项：。甄别人员问题：结合当前案件事实与历史案例进行辅助研判。\n\n历史相似案例：\n[KC-2024-031] 历史案例：多层跨境回流与贸易背景不一致。类型：跨境资金。资金网络：高度复杂。处置结论：可疑。案件摘要：资金经境内多个贸易主体分拆后汇往境外，再由关联离岸公司以服务费名义回流，贸易单据与实际货运不匹配。。关键事实：资金经过四层账户分拆；境外收款人与境内股东存在隐性关联；报关金额与跨境付款金额差异显著；服务合同缺少具体交付成果。风险模式：多层资金链、跨境回流、关联交易、贸易背景异常。证据材料：交易流水、资金图谱、合同票据、外部名单、尽调记录。专家关注：穿透境外受益所有人；比对报关物流和付款；识别循环回流路径。核验动作：补充报关单和物流凭证；核实境外主体控制关系；核验服务交付成果。经验总结：跨境案件应优先还原资金闭环和控制关系，再判断合同形式是否具有真实经济目的。\n\n[KC-2022-086] 历史案例：出口退税回款形成的阶段性跨境回流。类型：跨境资金。资金网络：复杂。处置结论：正常。案件摘要：出口企业在退税和海外经销商集中结算期间出现跨境资金回流，经核验报关、物流、税务和经销协议后能够形成完整业务闭环。。关键事实：回款时间与报关批次一致；海外付款方为长期经销商；回款金额与出口及退税记录匹配；不存在资金再次转回境外。风险模式：跨境集中回款、金额阶段性上升。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：核对出口业务周期；检查境外付款人与合同关系；确认资金最终用途。核验动作：取得报关和物流清单；核对经销协议；抽查回款对应发票。经验总结：跨境回款需要结合企业业务周期判断，不能脱离报关和结算安排孤立评价金额波动。\n\n[KC-2024-055] 历史案例：个人账户分拆结售汇与地下钱庄链路。类型：地下钱庄。资金网络：高度复杂。处置结论：可疑。案件摘要：多个个人账户在相近时点分拆购汇并汇往不同境外主体，境内资金来源集中，账户之间存在设备、地址和介绍人关联。。关键事实：八名个人连续多日接近限额购汇；购汇资金由两个境内账户集中提供；境外收款主体注册信息高度重合；多个账户共用设备和联系地址。风险模式：分拆结售汇、集中资金来源、共同设备、境外主体关联。证据材料：交易流水、资金图谱、客户资料、外部名单。专家关注：识别组织控制关系；还原资金来源和境外去向；核对购汇用途证明。核验动作：核实个人之间关系；补充购汇用途材料；穿透境外主体信息。经验总结：分拆结售汇案件的核心不是单个账户额度，而是共同资金来源、共同控制特征和境外去向之间的组合关系。\n\n[KC-2024-017] 历史案例：贸易企业接收个人分散入账后集中快转。类型：涉诈跑分。资金网络：复杂。处置结论：可疑。案件摘要：贸易企业短期接收大量陌生个人账户入账，并在十分钟内集中转往两个固定企业账户，交易规模与登记经营能力明显不符。。关键事实：三日内接收21名个人账户转入合计286万元；92%的入账资金在十五分钟内转出；收款主体与两个资金去向共用设备指纹；合同交易对手、发票开具方与实际收付款方不一致。风险模式：多人分散入账、集中快速转出、固定资金去向、经营背景不符、设备关联。证据材料：交易流水、资金图谱、客户资料、合同票据、尽调记录。专家关注：核对个人付款人与企业经营关系；穿透固定收款账户受益所有人；比对合同发票物流一致性。核验动作：补充主要订单和物流单据；核实个人付款人身份及付款原因；查询关联账户设备和IP。经验总结：企业客户出现个人分散入账时，必须将资金时序、经营背景和设备关联联合判断，不能只看单笔金额。\n\n[KC-2024-091] 历史案例：名单关联主体借贸易合同转移资金。类型：制裁风险。资金网络：复杂。处置结论：可疑。案件摘要：科技设备企业通过名称相近的中间贸易商向高风险地区转移资金，最终受益所有人与外部名单主体存在控制关系。。关键事实：交易对手名称与名单主体高度近似；中间贸易商设立时间短且无实际经营；设备最终目的地与合同不一致；受益所有人穿透后与名单主体关联。风险模式：名单弱匹配、中间贸易商、最终目的地异常、受益所有人关联。证据材料：外部名单、交易流水、资金图谱、合同票据、客户资料。专家关注：进行实体消歧；穿透受益所有人；核对货物最终用户和目的地。核验动作：补充最终用户声明；核验贸易物流路径；查询境外公司控制关系。经验总结：名单弱匹配不能直接下结论，应以注册信息、控制关系、货物流向和受益所有人完成多源消歧。\n\n请输出：核心疑点、相似与差异、证据评价、待核验材料、辅助研判建议、下一步动作和引用来源。"}},"CASE-B:investigation":{"case":{"id":"CASE-B","name":"预警包B｜多层跨境资金回流","case_type":"跨境资金","risk_score":79,"complexity_score":94,"network_level":"高度复杂","evidence_types":["交易流水","资金图谱","合同票据","外部名单","尽调记录"],"material_requirements":"梳理境内外资金链路，核验贸易真实性、受益所有人及名单关联","summary":"境内外七个主体之间出现分层汇款和资金回流，申报金额与合同金额不一致，部分境外受益人与境内股东存在交叉持股关系。","ability_requirements":{"E":0.17,"A":0.18,"N":0.3,"J":0.17,"Q":0.08,"T":0.1}},"task":"investigation","task_label":"生成增强尽调清单","question":"结合当前案件事实与历史案例进行辅助研判。","retrieval":{"formula":"案例检索分 = 50%×语义相似度 + 20%×案件类型相似度 + 15%×资金网络相似度 + 15%×证据结构相似度","items":[{"case":{"id":"KC-2024-031","title":"多层跨境回流与贸易背景不一致","year":2024,"case_type":"跨境资金","network_level":"高度复杂","conclusion":"可疑","quality_score":97,"summary":"资金经境内多个贸易主体分拆后汇往境外，再由关联离岸公司以服务费名义回流，贸易单据与实际货运不匹配。","key_facts":["资金经过四层账户分拆","境外收款人与境内股东存在隐性关联","报关金额与跨境付款金额差异显著","服务合同缺少具体交付成果"],"evidence_types":["交易流水","资金图谱","合同票据","外部名单","尽调记录"],"risk_patterns":["多层资金链","跨境回流","关联交易","贸易背景异常"],"expert_focus":["穿透境外受益所有人","比对报关物流和 联交易"},{"case_id":"KC-2022-086","title":"出口退税回款形成的阶段性跨境回流","similarity":85,"conclusion":"正常","reason":"跨境集中回款；金额阶段性上升"},{"case_id":"KC-2024-055","title":"个人账户分拆结售汇与地下钱庄链路","similarity":78.1,"conclusion":"可疑","reason":"分拆结售汇；集中资金来源；共同设备"}],"gaps":[{"value":"补充报关单和物流凭证","source":"KC-2024-031"},{"value":"核实境外主体控制关系","source":"KC-2024-031"},{"value":"核验服务交付成果","source":"KC-2024-031"}],"recommendation":{"label":"建议沿可疑方向继续研判，完成关键材料核验后再形成处置结论","confidence":"中高","basis":"综合当前案件事实及5个历史案例进行知识增强分析"},"actions":["补充报关单和物流凭证","核实境外主体控制关系","核验服务交付成果","取得报关和物流清单","核对经销协议"],"citations":[{"id":"KC-2024-031","title":"多层跨境回流与贸易背景不一致","source":"演示脱敏案例库"},{"id":"KC-2022-086","title":"出口退税回款形成的阶段性跨境回流","source":"演示脱敏案例库"},{"id":"KC-2024-055","title":"个人账户分拆结售汇与地下钱庄链路","source":"演示脱敏案例库"},{"id":"KC-2024-017","title":"贸易企业接收个人分散入账后集中快转","source":"演示脱敏案例库"},{"id":"KC-2024-091","title":"名单关联主体借贸易合同转移资金","source":"演示脱敏案例库"}]},"prompt_package":{"system":"你是银行反洗钱可疑预警甄别辅助模型。只能依据提供的当前案件事实、历史案例和业务约束回答。必须区分已确认事实、模型推断和待核验事项；不得把案件类型候选作为法律定性；每项关键判断必须引用当前证据来源或历史案例编号；证据不足时明确说明暂无法判断。","user":"任务：生成增强尽调清单\n当前案件：预警包B｜多层跨境资金回流。案件类型候选：跨境资金。风险分：79。复杂度：94。资金网络：高度复杂。案件摘要：境内外七个主体之间出现分层汇款和资金回流，申报金额与合同金额不一致，部分境外受益人与境内股东存在交叉持股关系。。已确认事实：。模型推断：。待核验事项：。甄别人员问题：结合当前案件事实与历史案例进行辅助研判。\n\n历史相似案例：\n[KC-2024-031] 历史案例：多层跨境回流与贸易背景不一致。类型：跨境资金。资金网络：高度复杂。处置结论：可疑。案件摘要：资金经境内多个贸易主体分拆后汇往境外，再由关联离岸公司以服务费名义回流，贸易单据与实际货运不匹配。。关键事实：资金经过四层账户分拆；境外收款人与境内股东存在隐性关联；报关金额与跨境付款金额差异显著；服务合同缺少具体交付成果。风险模式：多层资金链、跨境回流、关联交易、贸易背景异常。证据材料：交易流水、资金图谱、合同票据、外部名单、尽调记录。专家关注：穿透境外受益所有人；比对报关物流和付款；识别循环回流路径。核验动作：补充报关单和物流凭证；核实境外主体控制关系；核验服务交付成果。经验总结：跨境案件应优先还原资金闭环和控制关系，再判断合同形式是否具有真实经济目的。\n\n[KC-2022-086] 历史案例：出口退税回款形成的阶段性跨境回流。类型：跨境资金。资金网络：复杂。处置结论：正常。案件摘要：出口企业在退税和海外经销商集中结算期间出现跨境资金回流，经核验报关、物流、税务和经销协议后能够形成完整业务闭环。。关键事实：回款时间与报关批次一致；海外付款方为长期经销商；回款金额与出口及退税记录匹配；不存在资金再次转回境外。风险模式：跨境集中回款、金额阶段性上升。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：核对出口业务周期；检查境外付款人与合同关系；确认资金最终用途。核验动作：取得报关和物流清单；核对经销协议；抽查回款对应发票。经验总结：跨境回款需要结合企业业务周期判断，不能脱离报关和结算安排孤立评价金额波动。\n\n[KC-2024-055] 历史案例：个人账户分拆结售汇与地下钱庄链路。类型：地下钱庄。资金网络：高度复杂。处置结论：可疑。案件摘要：多个个人账户在相近时点分拆购汇并汇往不同境外主体，境内资金来源集中，账户之间存在设备、地址和介绍人关联。。关键事实：八名个人连续多日接近限额购汇；购汇资金由两个境内账户集中提供；境外收款主体注册信息高度重合；多个账户共用设备和联系地址。风险模式：分拆结售汇、集中资金来源、共同设备、境外主体关联。证据材料：交易流水、资金图谱、客户资料、外部名单。专家关注：识别组织控制关系；还原资金来源和境外去向；核对购汇用途证明。核验动作：核实个人之间关系；补充购汇用途材料；穿透境外主体信息。经验总结：分拆结售汇案件的核心不是单个账户额度，而是共同资金来源、共同控制特征和境外去向之间的组合关系。\n\n[KC-2024-017] 历史案例：贸易企业接收个人分散入账后集中快转。类型：涉诈跑分。资金网络：复杂。处置结论：可疑。案件摘要：贸易企业短期接收大量陌生个人账户入账，并在十分钟内集中转往两个固定企业账户，交易规模与登记经营能力明显不符。。关键事实：三日内接收21名个人账户转入合计286万元；92%的入账资金在十五分钟内转出；收款主体与两个资金去向共用设备指纹；合同交易对手、发票开具方与实际收付款方不一致。风险模式：多人分散入账、集中快速转出、固定资金去向、经营背景不符、设备关联。证据材料：交易流水、资金图谱、客户资料、合同票据、尽调记录。专家关注：核对个人付款人与企业经营关系；穿透固定收款账户受益所有人；比对合同发票物流一致性。核验动作：补充主要订单和物流单据；核实个人付款人身份及付款原因；查询关联账户设备和IP。经验总结：企业客户出现个人分散入账时，必须将资金时序、经营背景和设备关联联合判断，不能只看单笔金额。\n\n[KC-2024-091] 历史案例：名单关联主体借贸易合同转移资金。类型：制裁风险。资金网络：复杂。处置结论：可疑。案件摘要：科技设备企业通过名称相近的中间贸易商向高风险地区转移资金，最终受益所有人与外部名单主体存在控制关系。。关键事实：交易对手名称与名单主体高度近似；中间贸易商设立时间短且无实际经营；设备最终目的地与合同不一致；受益所有人穿透后与名单主体关联。风险模式：名单弱匹配、中间贸易商、最终目的地异常、受益所有人关联。证据材料：外部名单、交易流水、资金图谱、合同票据、客户资料。专家关注：进行实体消歧；穿透受益所有人；核对货物最终用户和目的地。核验动作：补充最终用户声明；核验贸易物流路径；查询境外公司控制关系。经验总结：名单弱匹配不能直接下结论，应以注册信息、控制关系、货物流向和受益所有人完成多源消歧。\n\n请输出：核心疑点、相似与差异、证据评价、待核验材料、辅助研判建议、下一步动作和引用来源。"}},"CASE-B:comparison":{"case":{"id":"CASE-B","name":"预警包B｜多层跨境资金回流","case_type":"跨境资金","risk_score":79,"complexity_score":94,"network_level":"高度复杂","evidence_types":["交易流水","资金图谱","合同票据","外部名单","尽调记录"],"material_requirements":"梳理境内外资金链路，核验贸易真实性、受益所有人及名单关联","summary":"境内外七个主体之间出现分层汇款和资金回流，申报金额与合同金额不一致，部分境外受益人与境内股东存在交叉持股关系。","ability_requirements":{"E":0.17,"A":0.18,"N":0.3,"J":0.17,"Q":0.08,"T":0.1}},"task":"comparison","task_label":"对比历史相似案例","question":"结合当前案件事实与历史案例进行辅助研判。","retrieval":{"formula":"案例检索分 = 50%×语义相似度 + 20%×案件类型相似度 + 15%×资金网络相似度 + 15%×证据结构相似度","items":[{"case":{"id":"KC-2024-031","title":"多层跨境回流与贸易背景不一致","year":2024,"case_type":"跨境资金","network_level":"高度复杂","conclusion":"可疑","quality_score":97,"summary":"资金经境内多个贸易主体分拆后汇往境外，再由关联离岸公司以服务费名义回流，贸易单据与实际货运不匹配。","key_facts":["资金经过四层账户分拆","境外收款人与境内股东存在隐性关联","报关金额与跨境付款金额差异显著","服务合同缺少具体交付成果"],"evi 认资金最终用途。核验动作：取得报关和物流清单；核对经销协议；抽查回款对应发票。经验总结：跨境回款需要结合企业业务周期判断，不能脱离报关和结算安排孤立评价金额波动。\n\n[KC-2024-055] 历史案例：个人账户分拆结售汇与地下钱庄链路。类型：地下钱庄。资金网络：高度复杂。处置结论：可疑。案件摘要：多个个人账户在相近时点分拆购汇并汇往不同境外主体，境内资金来源集中，账户之间存在设备、地址和介绍人关联。。关键事实：八名个人连续多日接近限额购汇；购汇资金由两个境内账户集中提供；境外收款主体注册信息高度重合；多个账户共用设备和联系地址。风险模式：分拆结售汇、集中资金来源、共同设备、境外主体关联。证据材料：交易流水、资金图谱、客户资料、外部名单。专家关注：识别组织控制关系；还原资金来源和境外去向；核对购汇用途证明。核验动作：核实个人之间关系；补充购汇用途材料；穿透境外主体信息。经验总结：分拆结售汇案件的核心不是单个账户额度，而是共同资金来源、共同控制特征和境外去向之间的组合关系。\n\n[KC-2024-017] 历史案例：贸易企业接收个人分散入账后集中快转。类型：涉诈跑分。资金网络：复杂。处置结论：可疑。案件摘要：贸易企业短期接收大量陌生个人账户入账，并在十分钟内集中转往两个固定企业账户，交易规模与登记经营能力明显不符。。关键事实：三日内接收21名个人账户转入合计286万元；92%的入账资金在十五分钟内转出；收款主体与两个资金去向共用设备指纹；合同交易对手、发票开具方与实际收付款方不一致。风险模式：多人分散入账、集中快速转出、固定资金去向、经营背景不符、设备关联。证据材料：交易流水、资金图谱、客户资料、合同票据、尽调记录。专家关注：核对个人付款人与企业经营关系；穿透固定收款账户受益所有人；比对合同发票物流一致性。核验动作：补充主要订单和物流单据；核实个人付款人身份及付款原因；查询关联账户设备和IP。经验总结：企业客户出现个人分散入账时，必须将资金时序、经营背景和设备关联联合判断，不能只看单笔金额。\n\n[KC-2024-091] 历史案例：名单关联主体借贸易合同转移资金。类型：制裁风险。资金网络：复杂。处置结论：可疑。案件摘要：科技设备企业通过名称相近的中间贸易商向高风险地区转移资金，最终受益所有人与外部名单主体存在控制关系。。关键事实：交易对手名称与名单主体高度近似；中间贸易商设立时间短且无实际经营；设备最终目的地与合同不一致；受益所有人穿透后与名单主体关联。风险模式：名单弱匹配、中间贸易商、最终目的地异常、受益所有人关联。证据材料：外部名单、交易流水、资金图谱、合同票据、客户资料。专家关注：进行实体消歧；穿透受益所有人；核对货物最终用户和目的地。核验动作：补充最终用户声明；核验贸易物流路径；查询境外公司控制关系。经验总结：名单弱匹配不能直接下结论，应以注册信息、控制关系、货物流向和受益所有人完成多源消歧。\n\n请输出：核心疑点、相似与差异、证据评价、待核验材料、辅助研判建议、下一步动作和引用来源。"}},"CASE-C:assessment":{"case":{"id":"CASE-C","name":"预警包C｜个人账户收入显著偏离","case_type":"涉诈跑分","risk_score":84,"complexity_score":72,"network_level":"中等","evidence_types":["交易流水","客户资料","尽调记录","资金图谱"],"material_requirements":"核验职业收入、收付款关系、资金来源用途及是否存在代收代付","summary":"客户登记为普通企业职员，月收入约1.2万元，但两周内收到46名个人转入资金合计86万元，随后集中转往三个账户，交易规模与职业收入明显不符。","ability_requirements":{"E":0.22,"A":0.18,"N":0.18,"J":0.24,"Q":0.11,"T":0.07}},"task":"assessment","task_label":"生成辅助研判意见","question":"结合当前案件事实与历史案例进行辅助研判。","retrieval":{"formula":"案例检索分 = 50%×语义相似度 + 20%×案件类型相似度 + 15%×资金网络相似度 + 15%×证据结构相似度","items":[{"case":{"id":"KC-2024-017","title":"贸易企业接收个人分散入账后集中快转","year":2024,"case_type":"涉诈跑分","network_level":"复杂","conclusion":"可疑","quality_score 023-042] 历史案例：电商促销期间个人付款集中归集。类型：涉诈跑分。资金网络：中等。处置结论：正常。案件摘要：电商企业促销期间出现大量个人付款，款项归集至平台结算账户，但订单、支付渠道、物流和纳税记录能够完整对应。。关键事实：个人付款均可对应平台订单编号；资金按照平台结算协议归集；退款比例与历史促销周期一致；物流签收与发票记录完整。风险模式：多人分散入账、集中归集。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：验证订单真实性；核对平台结算关系；检查退款和物流闭环。核验动作：抽样核验订单和物流；取得平台结算协议；核对纳税申报。经验总结：多人付款本身不等于异常，能够形成订单、支付、物流和税务闭环时应充分记录排除依据。\n\n[KC-2023-064] 历史案例：集团资金归集导致的公私账户短期往来。类型：涉税风险。资金网络：中等。处置结论：正常。案件摘要：家族企业在财务系统切换期间通过股东账户临时垫资，资金在短期内归还，借款协议、会计凭证和税务记录能够对应。。关键事实：个人资金用于短期工资和供应商垫付；全部款项在约定期限内归还；存在董事会决议和借款协议；会计凭证与纳税记录一致。风险模式：公私账户往来、短期资金归集。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：核实垫资商业原因；检查会计和税务处理；确认不存在循环虚构交易。核验动作：取得借款协议和决议；核对会计凭证；抽查供应商付款。经验总结：公私往来需要关注资金最终用途和会计处理，材料闭环充分时可记录排除但应提示账户规范。\n\n[KC-2024-073] 历史案例：建筑企业公私混同与异常票据循环。类型：涉税风险。资金网络：复杂。处置结论：可疑。案件摘要：建筑材料企业频繁向股东个人账户付款并由个人回流关联供应商，发票品名、金额和物流记录存在循环对应异常。。关键事实：对公资金频繁转入股东个人账户；个人账户向关联供应商回流；多张发票号码连续且物流凭证重复；资金规模显著超过项目施工进度。风险模式：公私混同、关联回流、票据异常、经营规模不符。证据材料：交易流水、资金图谱、客户资料、合同票据。专家关注：核对项目进度和付款节点；识别供应商关联关系；检查票据物流真实性。核验动作：补充项目合同和进度证明；核验供应商受益所有人；抽查发票对应物流。经验总结：涉税线索不能只依赖发票形式，应将资金回流、项目进度和供应商控制关系联合分析。\n\n[KC-2022-086] 历史案例：出口退税回款形成的阶段性跨境回流。类型：跨境资金。资金网络：复杂。处置结论：正常。案件摘要：出口企业在退税和海外经销商集中结算期间出现跨境资金回流，经核验报关、物流、税务和经销协议后能够形成完整业务闭环。。关键事实：回款时间与报关批次一致；海外付款方为长期经销商；回款金额与出口及退税记录匹配；不存在资金再次转回境外。风险模式：跨境集中回款、金额阶段性上升。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：核对出口业务周期；检查境外付款人与合同关系；确认资金最终用途。核验动作：取得报关和物流清单；核对经销协议；抽查回款对应发票。经验总结：跨境回款需要结合企业业务周期判断，不能脱离报关和结算安排孤立评价金额波动。\n\n请输出：核心疑点、相似与差异、证据评价、待核验材料、辅助研判建议、下一步动作和引用来源。"}},"CASE-C:evidence_gap":{"case":{"id":"CASE-C","name":"预警包C｜个人账户收入显著偏离","case_type":"涉诈跑分","risk_score":84,"complexity_score":72,"network_level":"中等","evidence_types":["交易流水","客户资料","尽调记录","资金图谱"],"material_requirements":"核验职业收入、收付款关系、资金来源用途及是否存在代收代付","summary":"客户登记为普通企业职员，月收入约1.2万元，但两周内收到46名个人转入资金合计86万元，随后集中转往三个账户，交易规模与职业收入明显不符。","ability_requirements":{"E":0.22,"A":0.18,"N":0.18,"J":0.24,"Q":0.11,"T":0.07}},"task":"evidence_gap","task_label":"识别证据缺口","question":"结合当前案件事实与历史案例进行辅助研判。","retrieval":{"formula":"案例检索分 = 50%×语义相似度 + 20%×案件类型相似度 + 15%×资金网络相似度 + 15%×证据结构相似度","items":[{"case":{"id":"KC 判断，不能只看单笔金额。\n\n[KC-2023-042] 历史案例：电商促销期间个人付款集中归集。类型：涉诈跑分。资金网络：中等。处置结论：正常。案件摘要：电商企业促销期间出现大量个人付款，款项归集至平台结算账户，但订单、支付渠道、物流和纳税记录能够完整对应。。关键事实：个人付款均可对应平台订单编号；资金按照平台结算协议归集；退款比例与历史促销周期一致；物流签收与发票记录完整。风险模式：多人分散入账、集中归集。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：验证订单真实性；核对平台结算关系；检查退款和物流闭环。核验动作：抽样核验订单和物流；取得平台结算协议；核对纳税申报。经验总结：多人付款本身不等于异常，能够形成订单、支付、物流和税务闭环时应充分记录排除依据。\n\n[KC-2023-064] 历史案例：集团资金归集导致的公私账户短期往来。类型：涉税风险。资金网络：中等。处置结论：正常。案件摘要：家族企业在财务系统切换期间通过股东账户临时垫资，资金在短期内归还，借款协议、会计凭证和税务记录能够对应。。关键事实：个人资金用于短期工资和供应商垫付；全部款项在约定期限内归还；存在董事会决议和借款协议；会计凭证与纳税记录一致。风险模式：公私账户往来、短期资金归集。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：核实垫资商业原因；检查会计和税务处理；确认不存在循环虚构交易。核验动作：取得借款协议和决议；核对会计凭证；抽查供应商付款。经验总结：公私往来需要关注资金最终用途和会计处理，材料闭环充分时可记录排除但应提示账户规范。\n\n[KC-2024-073] 历史案例：建筑企业公私混同与异常票据循环。类型：涉税风险。资金网络：复杂。处置结论：可疑。案件摘要：建筑材料企业频繁向股东个人账户付款并由个人回流关联供应商，发票品名、金额和物流记录存在循环对应异常。。关键事实：对公资金频繁转入股东个人账户；个人账户向关联供应商回流；多张发票号码连续且物流凭证重复；资金规模显著超过项目施工进度。风险模式：公私混同、关联回流、票据异常、经营规模不符。证据材料：交易流水、资金图谱、客户资料、合同票据。专家关注：核对项目进度和付款节点；识别供应商关联关系；检查票据物流真实性。核验动作：补充项目合同和进度证明；核验供应商受益所有人；抽查发票对应物流。经验总结：涉税线索不能只依赖发票形式，应将资金回流、项目进度和供应商控制关系联合分析。\n\n[KC-2022-086] 历史案例：出口退税回款形成的阶段性跨境回流。类型：跨境资金。资金网络：复杂。处置结论：正常。案件摘要：出口企业在退税和海外经销商集中结算期间出现跨境资金回流，经核验报关、物流、税务和经销协议后能够形成完整业务闭环。。关键事实：回款时间与报关批次一致；海外付款方为长期经销商；回款金额与出口及退税记录匹配；不存在资金再次转回境外。风险模式：跨境集中回款、金额阶段性上升。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：核对出口业务周期；检查境外付款人与合同关系；确认资金最终用途。核验动作：取得报关和物流清单；核对经销协议；抽查回款对应发票。经验总结：跨境回款需要结合企业业务周期判断，不能脱离报关和结算安排孤立评价金额波动。\n\n请输出：核心疑点、相似与差异、证据评价、待核验材料、辅助研判建议、下一步动作和引用来源。"}},"CASE-C:investigation":{"case":{"id":"CASE-C","name":"预警包C｜个人账户收入显著偏离","case_type":"涉诈跑分","risk_score":84,"complexity_score":72,"network_level":"中等","evidence_types":["交易流水","客户资料","尽调记录","资金图谱"],"material_requirements":"核验职业收入、收付款关系、资金来源用途及是否存在代收代付","summary":"客户登记为普通企业职员，月收入约1.2万元，但两周内收到46名个人转入资金合计86万元，随后集中转往三个账户，交易规模与职业收入明显不符。","ability_requirements":{"E":0.22,"A":0.18,"N":0.18,"J":0.24,"Q":0.11,"T":0.07}},"task":"investigation","task_label":"生成增强尽调清单","question":"结合当前案件事实与历史案例进行辅助研判。","retrieval":{"formula":"案例检索分 = 50%×语义相似度 + 20%×案件类型相似度 + 15%×资金网络相似度 + 15%×证据结构相似度"," tion":{"mode":"grounded-demo","model":"internal-general-llm","ready":false,"error":null}},"answer":{"title":"生成增强尽调清单","executive_summary":"建议将相似案例中的高价值核验动作转化为增强尽调清单，并要求每项反馈绑定材料编号和核验结果。","evidence_points":[],"comparisons":[{"case_id":"KC-2024-017","title":"贸易企业接收个人分散入账后集中快转","similarity":90.4,"conclusion":"可疑","reason":"多人分散入账；集中快速转出；固定资金去向"},{"case_id":"KC-2023-042","title":"电商促销期间个人付款集中归集","similarity":83,"conclusion":"正常","reason":"多人分散入账；集中归集"},{"case_id":"KC-2023-064","title":"集团资金归集导致的公私账户短期往来","similarity":74.6,"conclusion":"正常","reason":"公私账户往来；短期资金归集"}],"gaps":[{"value":"补充主要订单和物流单据","source":"KC-2024-017"},{"value":"核实个人付款人身份及付款原因","source":"KC-2024-017"},{"value":"查询关联账户设备和IP","source":"KC-2024-017"}],"recommendation":{"label":"历史案例结论存在差异，应优先补足交易背景证据后再判断","confidence":"中高","basis":"综合当前案件事实及5个历史案例进行知识增强分析"},"actions":["补充主要订单和物流单据","核实个人付款人身份及付款原因","查询关联账户设备和IP","抽样核验订单和物流","取得平台结算协议"],"citations":[{"id":"KC-2024-017","title":"贸易企业接收个人分散入账后集中快转","source":"演示脱敏案例库"},{"id":"KC-2023-042","title":"电商促销期间个人付款集中归集","source":"演示脱敏案例库"},{"id":"KC-2023-064","title":"集团资金归集导致的公私账户短期往来","source":"演示脱敏案例库"},{"id":"KC-2024-073","title":"建筑企业公私混同与异常票据循环","source":"演示脱敏案例库"},{"id":"KC-2022-086","title":"出口退税回款形成的阶段性跨境回流","source":"演示脱敏案例库"}]},"prompt_package":{"system":"你是银行反洗钱可疑预警甄别辅助模型。只能依据提供的当前案件事实、历史案例和业务约束回答。必须区分已确认事实、模型推断和待核验事项；不得把案件类型候选作为法律定性；每项关键判断必须引用当前证据来源或历史案例编号；证据不足时明确说明暂无法判断。","user":"任务：生成增强尽调清单\n当前案件：预警包C｜个人账户收入显著偏离。案件类型候选：涉诈跑分。风险分：84。复杂度：72。资金网络：中等。案件摘要：客户登记为普通企业职员，月收入约1.2万元，但两周内收到46名个人转入资金合计86万元，随后集中转往三个账户，交易规模与职业收入明显不符。。已确认事实：。模型推断：。待核验事项：。甄别人员问题：结合当前案件事实与历史案例进行辅助研判。\n\n历史相似案例：\n[KC-2024-017] 历史案例：贸易企业接收个人分散入账后集中快转。类型：涉诈跑分。资金网络：复杂。处置结论：可疑。案件摘要：贸易企业短期接收大量陌生个人账户入账，并在十分钟内集中转往两个固定企业账户，交易规模与登记经营能力明显不符。。关键事实：三日内接收21名个人账户转入合计286万元；92%的入账资金在十五分钟内转出；收款主体与两个资金去向共用设备指纹；合同交易对手、发票开具方与实际收付款方不一致。风险模式：多人分散入账、集中快速转出、固定资金去向、经营背景不符、设备关联。证据材料：交易流水、资金图谱、客户资料、合同票据、尽调记录。专家关注：核对个人付款人与企业经营关系；穿透固定收款账户受益所有人；比对合同发票物流一致性。核验动作：补充主要订单和物流单据；核实个人付款人身份及付款原因；查询关联账户设备和IP。经验总结：企业客户出现个人分散入账时，必须将资金时序、经营背景和设备关联联合判断，不能只看单笔金额。\n\n[KC-2023-042] 历史案例：电商促销期间个人付款集中归集。类型：涉诈跑分。资金网络：中等。处置结论：正常。案件摘要：电商企业促销期间出现大量个人付款，款项归集至平台结算账户，但订单、支付渠道、物流和纳税记录能够完整对应。。关键事实：个人付款均可对应平台订单编号；资金按照平台结算协议归集；退款比例与历史促销周期一致；物流签收与发票记录完整。风险模式：多人分散入账、集中归集。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：验证订单真实性；核对平台结算关系；检查退款和物流闭环。核验动作：抽样核验订单和物流；取得平台结算协议；核对纳税申报。经验总结：多人付款本身不等于异常，能够形成订单、支付、物流和税务闭环时应充分记录排除依据。\n\n[KC-2023-064] 历史案例：集团资金归集导致的公私账户短期往来。类型：涉税风险。资金网络：中等。处置结论：正常。案件摘要：家族企业在财务系统切换期间通过股东账户临时垫资，资金在短期内归还，借款协议、会计凭证和税务记录能够对应。。关键事实：个人资金用于短期工资和供应商垫付；全部款项在约定期限内归还；存在董事会决议和借款协议；会计凭证与纳税记录一致。风险模式：公私账户往来、短期资金归集。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：核实垫资商业原因；检查会计和税务处理；确认不存在循环虚构交易。核验动作：取得借款协议和决议；核对会计凭证；抽查供应商付款。经验总结：公私往来需要关注资金最终用途和会计处理，材料闭环充分时可记录排除但应提示账户规范。\n\n[KC-2024-073] 历史案例：建筑企业公私混同与异常票据循环。类型：涉税风险。资金网络：复杂。处置结论：可疑。案件摘要：建筑材料企业频繁向股东个人账户付款并由个人回流关联供应商，发票品名、金额和物流记录存在循环对应异常。。关键事实：对公资金频繁转入股东个人账户；个人账户向关联供应商回流；多张发票号码连续且物流凭证重复；资金规模显著超过项目施工进度。风险模式：公私混同、关联回流、票据异常、经营规模不符。证据材料：交易流水、资金图谱、客户资料、合同票据。专家关注：核对项目进度和付款节点；识别供应商关联关系；检查票据物流真实性。核验动作：补充项目合同和进度证明；核验供应商受益所有人；抽查发票对应物流。经验总结：涉税线索不能只依赖发票形式，应将资金回流、项目进度和供应商控制关系联合分析。\n\n[KC-2022-086] 历史案例：出口退税回款形成的阶段性跨境回流。类型：跨境资金。资金网络：复杂。处置结论：正常。案件摘要：出口企业在退税和海外经销商集中结算期间出现跨境资金回流，经核验报关、物流、税务和经销协议后能够形成完整业务闭环。。关键事实：回款时间与报关批次一致；海外付款方为长期经销商；回款金额与出口及退税记录匹配；不存在资金再次转回境外。风险模式：跨境集中回款、金额阶段性上升。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：核对出口业务周期；检查境外付款人与合同关系；确认资金最终用途。核验动作：取得报关和物流清单；核对经销协议；抽查回款对应发票。经验总结：跨境回款需要结合企业业务周期判断，不能脱离报关和结算安排孤立评价金额波动。\n\n请输出：核心疑点、相似与差异、证据评价、待核验材料、辅助研判建议、下一步动作和引用来源。"}},"CASE-C:comparison":{"case":{"id":"CASE-C","name":"预警包C｜个人账户收入显著偏离","case_type":"涉诈跑分","risk_score":84,"complexity_score":72,"network_level":"中等","evidence_types":["交易流水","客户资料","尽调记录","资金图谱"],"material_requirements":"核验职业收入、收付款关系、资金来源用途及是否存在代收代付","summary":"客户登记为普通企业职员，月收入约1.2万元，但两周内收到46名个人转入资金合计86万元，随后集中转往三个账户，交易规模与职业收入明显不符。","ability_requirements":{"E":0.22,"A":0.18,"N":0.18,"J":0.24,"Q":0.11,"T":0.07}},"task":"comparison","task_label":"对比历史相似案例","question":"结合当前案件事实与历史案例进行辅助研判。","retrieval":{"formula":"案例检索分 = 50%×语义相似度 + 20%×案件类型相似度 + 15%×资金网络相似度
