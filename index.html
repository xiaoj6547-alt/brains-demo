备和IP。经验总结：企业客户出现个人分散入账时，必须将资金时序、经营背景和设备关联联合判断，不能只看单笔金额。\n\n[KC-2023-042] 历史案例：电商促销期间个人付款集中归集。类型：涉诈跑分。资金网络：中等。处置结论：正常。案件摘要：电商企业促销期间出现大量个人付款，款项归集至平台结算账户，但订单、支付渠道、物流和纳税记录能够完整对应。。关键事实：个人付款均可对应平台订单编号；资金按照平台结算协议归集；退款比例与历史促销周期一致；物流签收与发票记录完整。风险模式：多人分散入账、集中归集。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：验证订单真实性；核对平台结算关系；检查退款和物流闭环。核验动作：抽样核验订单和物流；取得平台结算协议；核对纳税申报。经验总结：多人付款本身不等于异常，能够形成订单、支付、物流和税务闭环时应充分记录排除依据。\n\n[KC-2023-064] 历史案例：集团资金归集导致的公私账户短期往来。类型：涉税风险。资金网络：中等。处置结论：正常。案件摘要：家族企业在财务系统切换期间通过股东账户临时垫资，资金在短期内归还，借款协议、会计凭证和税务记录能够对应。。关键事实：个人资金用于短期工资和供应商垫付；全部款项在约定期限内归还；存在董事会决议和借款协议；会计凭证与纳税记录一致。风险模式：公私账户往来、短期资金归集。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：核实垫资商业原因；检查会计和税务处理；确认不存在循环虚构交易。核验动作：取得借款协议和决议；核对会计凭证；抽查供应商付款。经验总结：公私往来需要关注资金最终用途和会计处理，材料闭环充分时可记录排除但应提示账户规范。\n\n[KC-2024-073] 历史案例：建筑企业公私混同与异常票据循环。类型：涉税风险。资金网络：复杂。处置结论：可疑。案件摘要：建筑材料企业频繁向股东个人账户付款并由个人回流关联供应商，发票品名、金额和物流记录存在循环对应异常。。关键事实：对公资金频繁转入股东个人账户；个人账户向关联供应商回流；多张发票号码连续且物流凭证重复；资金规模显著超过项目施工进度。风险模式：公私混同、关联回流、票据异常、经营规模不符。证据材料：交易流水、资金图谱、客户资料、合同票据。专家关注：核对项目进度和付款节点；识别供应商关联关系；检查票据物流真实性。核验动作：补充项目合同和进度证明；核验供应商受益所有人；抽查发票对应物流。经验总结：涉税线索不能只依赖发票形式，应将资金回流、项目进度和供应商控制关系联合分析。\n\n[KC-2022-086] 历史案例：出口退税回款形成的阶段性跨境回流。类型：跨境资金。资金网络：复杂。处置结论：正常。案件摘要：出口企业在退税和海外经销商集中结算期间出现跨境资金回流，经核验报关、物流、税务和经销协议后能够形成完整业务闭环。。关键事实：回款时间与报关批次一致；海外付款方为长期经销商；回款金额与出口及退税记录匹配；不存在资金再次转回境外。风险模式：跨境集中回款、金额阶段性上升。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：核对出口业务周期；检查境外付款人与合同关系；确认资金最终用途。核验动作：取得报关和物流清单；核对经销协议；抽查回款对应发票。经验总结：跨境回款需要结合企业业务周期判断，不能脱离报关和结算安排孤立评价金额波动。\n\n请输出：核心疑点、相似与差异、证据评价、待核验材料、辅助研判建议、下一步动作和引用来源。"}},"CASE-D:assessment":{"case":{"id":"CASE-D","name":"预警包D｜地下钱庄分拆结售汇","case_type":"地下钱庄","risk_score":90,"complexity_score":86,"network_level":"复杂","evidence_types":["交易流水","资金图谱","客户资料","外部名单"],"material_requirements":"识别分拆交易、共同控制关系和境内外资金对敲链路","summary":"多个个人账户在相近时点以接近额度办理结售汇，并与同一批交易对手发生反向资金往来，疑似存在分拆交易和地下钱庄对敲特征。","ability_requirements":{"E":0.23,"A":0.12,"N":0.28,"J":0.2,"Q":0.08,"T":0.09}},"task":"assessment","task_label":"生成辅助研判意见","question":"结合当前案件事实与历史案例进行辅助研判。","retrieval":{"formula":"案例检索分 = 50%×语义相似度 + 20%×案件类型相似度 + 15%×资金网络相 关系；还原资金来源和境外去向；核对购汇用途证明。核验动作：核实个人之间关系；补充购汇用途材料；穿透境外主体信息。经验总结：分拆结售汇案件的核心不是单个账户额度，而是共同资金来源、共同控制特征和境外去向之间的组合关系。\n\n[KC-2024-091] 历史案例：名单关联主体借贸易合同转移资金。类型：制裁风险。资金网络：复杂。处置结论：可疑。案件摘要：科技设备企业通过名称相近的中间贸易商向高风险地区转移资金，最终受益所有人与外部名单主体存在控制关系。。关键事实：交易对手名称与名单主体高度近似；中间贸易商设立时间短且无实际经营；设备最终目的地与合同不一致；受益所有人穿透后与名单主体关联。风险模式：名单弱匹配、中间贸易商、最终目的地异常、受益所有人关联。证据材料：外部名单、交易流水、资金图谱、合同票据、客户资料。专家关注：进行实体消歧；穿透受益所有人；核对货物最终用户和目的地。核验动作：补充最终用户声明；核验贸易物流路径；查询境外公司控制关系。经验总结：名单弱匹配不能直接下结论，应以注册信息、控制关系、货物流向和受益所有人完成多源消歧。\n\n[KC-2023-019] 历史案例：留学家庭多人购汇但用途真实。类型：地下钱庄。资金网络：简单。处置结论：正常。案件摘要：家庭成员分别购汇支付同一留学生学费和生活费，虽然资金来源集中，但亲属关系、学校账单和汇款用途均能够核实。。关键事实：购汇人为直系亲属；境外收款人为学校及学生本人；金额与学费生活费账单一致；未发现共同设备控制或对外代办。风险模式：多人购汇、集中资金来源。证据材料：交易流水、客户资料、合同票据。专家关注：确认亲属关系；核对学校账单；排查对外代办特征。核验动作：取得亲属关系证明；核验录取及缴费通知；确认境外收款账户。经验总结：共同资金来源需要与账户关系和用途真实性结合判断，真实家庭场景应避免机械套用分拆规则。\n\n[KC-2024-073] 历史案例：建筑企业公私混同与异常票据循环。类型：涉税风险。资金网络：复杂。处置结论：可疑。案件摘要：建筑材料企业频繁向股东个人账户付款并由个人回流关联供应商，发票品名、金额和物流记录存在循环对应异常。。关键事实：对公资金频繁转入股东个人账户；个人账户向关联供应商回流；多张发票号码连续且物流凭证重复；资金规模显著超过项目施工进度。风险模式：公私混同、关联回流、票据异常、经营规模不符。证据材料：交易流水、资金图谱、客户资料、合同票据。专家关注：核对项目进度和付款节点；识别供应商关联关系；检查票据物流真实性。核验动作：补充项目合同和进度证明；核验供应商受益所有人；抽查发票对应物流。经验总结：涉税线索不能只依赖发票形式，应将资金回流、项目进度和供应商控制关系联合分析。\n\n[KC-2024-017] 历史案例：贸易企业接收个人分散入账后集中快转。类型：涉诈跑分。资金网络：复杂。处置结论：可疑。案件摘要：贸易企业短期接收大量陌生个人账户入账，并在十分钟内集中转往两个固定企业账户，交易规模与登记经营能力明显不符。。关键事实：三日内接收21名个人账户转入合计286万元；92%的入账资金在十五分钟内转出；收款主体与两个资金去向共用设备指纹；合同交易对手、发票开具方与实际收付款方不一致。风险模式：多人分散入账、集中快速转出、固定资金去向、经营背景不符、设备关联。证据材料：交易流水、资金图谱、客户资料、合同票据、尽调记录。专家关注：核对个人付款人与企业经营关系；穿透固定收款账户受益所有人；比对合同发票物流一致性。核验动作：补充主要订单和物流单据；核实个人付款人身份及付款原因；查询关联账户设备和IP。经验总结：企业客户出现个人分散入账时，必须将资金时序、经营背景和设备关联联合判断，不能只看单笔金额。\n\n请输出：核心疑点、相似与差异、证据评价、待核验材料、辅助研判建议、下一步动作和引用来源。"}},"CASE-D:evidence_gap":{"case":{"id":"CASE-D","name":"预警包D｜地下钱庄分拆结售汇","case_type":"地下钱庄","risk_score":90,"complexity_score":86,"network_level":"复杂","evidence_types":["交易流水","资金图谱","客户资料","外部名单"],"material_requirements":"识别分拆交易、共同控制关系和境内外资金对敲链路","summary":"多个个人账户在相近时点以接近额度办理结售汇，并与同一批交易对手发生反向资金往来，疑似存在分拆交易和地下钱庄对敲特征。","ability_requirements":{"E":0.23,"A":0.12,"N":0.28,"J":0.2,"Q":0.08,"T" 源、共同设备、境外主体关联。证据材料：交易流水、资金图谱、客户资料、外部名单。专家关注：识别组织控制关系；还原资金来源和境外去向；核对购汇用途证明。核验动作：核实个人之间关系；补充购汇用途材料；穿透境外主体信息。经验总结：分拆结售汇案件的核心不是单个账户额度，而是共同资金来源、共同控制特征和境外去向之间的组合关系。\n\n[KC-2024-091] 历史案例：名单关联主体借贸易合同转移资金。类型：制裁风险。资金网络：复杂。处置结论：可疑。案件摘要：科技设备企业通过名称相近的中间贸易商向高风险地区转移资金，最终受益所有人与外部名单主体存在控制关系。。关键事实：交易对手名称与名单主体高度近似；中间贸易商设立时间短且无实际经营；设备最终目的地与合同不一致；受益所有人穿透后与名单主体关联。风险模式：名单弱匹配、中间贸易商、最终目的地异常、受益所有人关联。证据材料：外部名单、交易流水、资金图谱、合同票据、客户资料。专家关注：进行实体消歧；穿透受益所有人；核对货物最终用户和目的地。核验动作：补充最终用户声明；核验贸易物流路径；查询境外公司控制关系。经验总结：名单弱匹配不能直接下结论，应以注册信息、控制关系、货物流向和受益所有人完成多源消歧。\n\n[KC-2023-019] 历史案例：留学家庭多人购汇但用途真实。类型：地下钱庄。资金网络：简单。处置结论：正常。案件摘要：家庭成员分别购汇支付同一留学生学费和生活费，虽然资金来源集中，但亲属关系、学校账单和汇款用途均能够核实。。关键事实：购汇人为直系亲属；境外收款人为学校及学生本人；金额与学费生活费账单一致；未发现共同设备控制或对外代办。风险模式：多人购汇、集中资金来源。证据材料：交易流水、客户资料、合同票据。专家关注：确认亲属关系；核对学校账单；排查对外代办特征。核验动作：取得亲属关系证明；核验录取及缴费通知；确认境外收款账户。经验总结：共同资金来源需要与账户关系和用途真实性结合判断，真实家庭场景应避免机械套用分拆规则。\n\n[KC-2024-073] 历史案例：建筑企业公私混同与异常票据循环。类型：涉税风险。资金网络：复杂。处置结论：可疑。案件摘要：建筑材料企业频繁向股东个人账户付款并由个人回流关联供应商，发票品名、金额和物流记录存在循环对应异常。。关键事实：对公资金频繁转入股东个人账户；个人账户向关联供应商回流；多张发票号码连续且物流凭证重复；资金规模显著超过项目施工进度。风险模式：公私混同、关联回流、票据异常、经营规模不符。证据材料：交易流水、资金图谱、客户资料、合同票据。专家关注：核对项目进度和付款节点；识别供应商关联关系；检查票据物流真实性。核验动作：补充项目合同和进度证明；核验供应商受益所有人；抽查发票对应物流。经验总结：涉税线索不能只依赖发票形式，应将资金回流、项目进度和供应商控制关系联合分析。\n\n[KC-2024-017] 历史案例：贸易企业接收个人分散入账后集中快转。类型：涉诈跑分。资金网络：复杂。处置结论：可疑。案件摘要：贸易企业短期接收大量陌生个人账户入账，并在十分钟内集中转往两个固定企业账户，交易规模与登记经营能力明显不符。。关键事实：三日内接收21名个人账户转入合计286万元；92%的入账资金在十五分钟内转出；收款主体与两个资金去向共用设备指纹；合同交易对手、发票开具方与实际收付款方不一致。风险模式：多人分散入账、集中快速转出、固定资金去向、经营背景不符、设备关联。证据材料：交易流水、资金图谱、客户资料、合同票据、尽调记录。专家关注：核对个人付款人与企业经营关系；穿透固定收款账户受益所有人；比对合同发票物流一致性。核验动作：补充主要订单和物流单据；核实个人付款人身份及付款原因；查询关联账户设备和IP。经验总结：企业客户出现个人分散入账时，必须将资金时序、经营背景和设备关联联合判断，不能只看单笔金额。\n\n请输出：核心疑点、相似与差异、证据评价、待核验材料、辅助研判建议、下一步动作和引用来源。"}},"CASE-D:investigation":{"case":{"id":"CASE-D","name":"预警包D｜地下钱庄分拆结售汇","case_type":"地下钱庄","risk_score":90,"complexity_score":86,"network_level":"复杂","evidence_types":["交易流水","资金图谱","客户资料","外部名单"],"material_requirements":"识别分拆交易、共同控制关系和境内外资金对敲链路","summary":"多个个人账户在相近时点以接近额度办理结售汇，并与同一批交易对手发生反向资金往来，疑似存在分拆交易和地下钱庄对敲特征。","ability_requirement 户集中提供；境外收款主体注册信息高度重合；多个账户共用设备和联系地址。风险模式：分拆结售汇、集中资金来源、共同设备、境外主体关联。证据材料：交易流水、资金图谱、客户资料、外部名单。专家关注：识别组织控制关系；还原资金来源和境外去向；核对购汇用途证明。核验动作：核实个人之间关系；补充购汇用途材料；穿透境外主体信息。经验总结：分拆结售汇案件的核心不是单个账户额度，而是共同资金来源、共同控制特征和境外去向之间的组合关系。\n\n[KC-2024-091] 历史案例：名单关联主体借贸易合同转移资金。类型：制裁风险。资金网络：复杂。处置结论：可疑。案件摘要：科技设备企业通过名称相近的中间贸易商向高风险地区转移资金，最终受益所有人与外部名单主体存在控制关系。。关键事实：交易对手名称与名单主体高度近似；中间贸易商设立时间短且无实际经营；设备最终目的地与合同不一致；受益所有人穿透后与名单主体关联。风险模式：名单弱匹配、中间贸易商、最终目的地异常、受益所有人关联。证据材料：外部名单、交易流水、资金图谱、合同票据、客户资料。专家关注：进行实体消歧；穿透受益所有人；核对货物最终用户和目的地。核验动作：补充最终用户声明；核验贸易物流路径；查询境外公司控制关系。经验总结：名单弱匹配不能直接下结论，应以注册信息、控制关系、货物流向和受益所有人完成多源消歧。\n\n[KC-2023-019] 历史案例：留学家庭多人购汇但用途真实。类型：地下钱庄。资金网络：简单。处置结论：正常。案件摘要：家庭成员分别购汇支付同一留学生学费和生活费，虽然资金来源集中，但亲属关系、学校账单和汇款用途均能够核实。。关键事实：购汇人为直系亲属；境外收款人为学校及学生本人；金额与学费生活费账单一致；未发现共同设备控制或对外代办。风险模式：多人购汇、集中资金来源。证据材料：交易流水、客户资料、合同票据。专家关注：确认亲属关系；核对学校账单；排查对外代办特征。核验动作：取得亲属关系证明；核验录取及缴费通知；确认境外收款账户。经验总结：共同资金来源需要与账户关系和用途真实性结合判断，真实家庭场景应避免机械套用分拆规则。\n\n[KC-2024-073] 历史案例：建筑企业公私混同与异常票据循环。类型：涉税风险。资金网络：复杂。处置结论：可疑。案件摘要：建筑材料企业频繁向股东个人账户付款并由个人回流关联供应商，发票品名、金额和物流记录存在循环对应异常。。关键事实：对公资金频繁转入股东个人账户；个人账户向关联供应商回流；多张发票号码连续且物流凭证重复；资金规模显著超过项目施工进度。风险模式：公私混同、关联回流、票据异常、经营规模不符。证据材料：交易流水、资金图谱、客户资料、合同票据。专家关注：核对项目进度和付款节点；识别供应商关联关系；检查票据物流真实性。核验动作：补充项目合同和进度证明；核验供应商受益所有人；抽查发票对应物流。经验总结：涉税线索不能只依赖发票形式，应将资金回流、项目进度和供应商控制关系联合分析。\n\n[KC-2024-017] 历史案例：贸易企业接收个人分散入账后集中快转。类型：涉诈跑分。资金网络：复杂。处置结论：可疑。案件摘要：贸易企业短期接收大量陌生个人账户入账，并在十分钟内集中转往两个固定企业账户，交易规模与登记经营能力明显不符。。关键事实：三日内接收21名个人账户转入合计286万元；92%的入账资金在十五分钟内转出；收款主体与两个资金去向共用设备指纹；合同交易对手、发票开具方与实际收付款方不一致。风险模式：多人分散入账、集中快速转出、固定资金去向、经营背景不符、设备关联。证据材料：交易流水、资金图谱、客户资料、合同票据、尽调记录。专家关注：核对个人付款人与企业经营关系；穿透固定收款账户受益所有人；比对合同发票物流一致性。核验动作：补充主要订单和物流单据；核实个人付款人身份及付款原因；查询关联账户设备和IP。经验总结：企业客户出现个人分散入账时，必须将资金时序、经营背景和设备关联联合判断，不能只看单笔金额。\n\n请输出：核心疑点、相似与差异、证据评价、待核验材料、辅助研判建议、下一步动作和引用来源。"}},"CASE-D:comparison":{"case":{"id":"CASE-D","name":"预警包D｜地下钱庄分拆结售汇","case_type":"地下钱庄","risk_score":90,"complexity_score":86,"network_level":"复杂","evidence_types":["交易流水","资金图谱","客户资料","外部名单"],"material_requirements":"识别分拆交易、共同控制关系和境内外资金对敲链路","summary":"多个个人账户在相近时点以接近额度办理结售汇，并与同一批交易对手发 ，账户之间存在设备、地址和介绍人关联。。关键事实：八名个人连续多日接近限额购汇；购汇资金由两个境内账户集中提供；境外收款主体注册信息高度重合；多个账户共用设备和联系地址。风险模式：分拆结售汇、集中资金来源、共同设备、境外主体关联。证据材料：交易流水、资金图谱、客户资料、外部名单。专家关注：识别组织控制关系；还原资金来源和境外去向；核对购汇用途证明。核验动作：核实个人之间关系；补充购汇用途材料；穿透境外主体信息。经验总结：分拆结售汇案件的核心不是单个账户额度，而是共同资金来源、共同控制特征和境外去向之间的组合关系。\n\n[KC-2024-091] 历史案例：名单关联主体借贸易合同转移资金。类型：制裁风险。资金网络：复杂。处置结论：可疑。案件摘要：科技设备企业通过名称相近的中间贸易商向高风险地区转移资金，最终受益所有人与外部名单主体存在控制关系。。关键事实：交易对手名称与名单主体高度近似；中间贸易商设立时间短且无实际经营；设备最终目的地与合同不一致；受益所有人穿透后与名单主体关联。风险模式：名单弱匹配、中间贸易商、最终目的地异常、受益所有人关联。证据材料：外部名单、交易流水、资金图谱、合同票据、客户资料。专家关注：进行实体消歧；穿透受益所有人；核对货物最终用户和目的地。核验动作：补充最终用户声明；核验贸易物流路径；查询境外公司控制关系。经验总结：名单弱匹配不能直接下结论，应以注册信息、控制关系、货物流向和受益所有人完成多源消歧。\n\n[KC-2023-019] 历史案例：留学家庭多人购汇但用途真实。类型：地下钱庄。资金网络：简单。处置结论：正常。案件摘要：家庭成员分别购汇支付同一留学生学费和生活费，虽然资金来源集中，但亲属关系、学校账单和汇款用途均能够核实。。关键事实：购汇人为直系亲属；境外收款人为学校及学生本人；金额与学费生活费账单一致；未发现共同设备控制或对外代办。风险模式：多人购汇、集中资金来源。证据材料：交易流水、客户资料、合同票据。专家关注：确认亲属关系；核对学校账单；排查对外代办特征。核验动作：取得亲属关系证明；核验录取及缴费通知；确认境外收款账户。经验总结：共同资金来源需要与账户关系和用途真实性结合判断，真实家庭场景应避免机械套用分拆规则。\n\n[KC-2024-073] 历史案例：建筑企业公私混同与异常票据循环。类型：涉税风险。资金网络：复杂。处置结论：可疑。案件摘要：建筑材料企业频繁向股东个人账户付款并由个人回流关联供应商，发票品名、金额和物流记录存在循环对应异常。。关键事实：对公资金频繁转入股东个人账户；个人账户向关联供应商回流；多张发票号码连续且物流凭证重复；资金规模显著超过项目施工进度。风险模式：公私混同、关联回流、票据异常、经营规模不符。证据材料：交易流水、资金图谱、客户资料、合同票据。专家关注：核对项目进度和付款节点；识别供应商关联关系；检查票据物流真实性。核验动作：补充项目合同和进度证明；核验供应商受益所有人；抽查发票对应物流。经验总结：涉税线索不能只依赖发票形式，应将资金回流、项目进度和供应商控制关系联合分析。\n\n[KC-2024-017] 历史案例：贸易企业接收个人分散入账后集中快转。类型：涉诈跑分。资金网络：复杂。处置结论：可疑。案件摘要：贸易企业短期接收大量陌生个人账户入账，并在十分钟内集中转往两个固定企业账户，交易规模与登记经营能力明显不符。。关键事实：三日内接收21名个人账户转入合计286万元；92%的入账资金在十五分钟内转出；收款主体与两个资金去向共用设备指纹；合同交易对手、发票开具方与实际收付款方不一致。风险模式：多人分散入账、集中快速转出、固定资金去向、经营背景不符、设备关联。证据材料：交易流水、资金图谱、客户资料、合同票据、尽调记录。专家关注：核对个人付款人与企业经营关系；穿透固定收款账户受益所有人；比对合同发票物流一致性。核验动作：补充主要订单和物流单据；核实个人付款人身份及付款原因；查询关联账户设备和IP。经验总结：企业客户出现个人分散入账时，必须将资金时序、经营背景和设备关联联合判断，不能只看单笔金额。\n\n请输出：核心疑点、相似与差异、证据评价、待核验材料、辅助研判建议、下一步动作和引用来源。"}},"CASE-E:assessment":{"case":{"id":"CASE-E","name":"预警包E｜企业公私混同与票据异常","case_type":"涉税风险","risk_score":76,"complexity_score":69,"network_level":"中等","evidence_types":["交易流水","合同票据","客户资料","尽调记录"],"material_requirements":"核对企业经营范围、合同发票、实际 合当前案件事实与历史案例进行辅助研判。\n\n历史相似案例：\n[KC-2023-064] 历史案例：集团资金归集导致的公私账户短期往来。类型：涉税风险。资金网络：中等。处置结论：正常。案件摘要：家族企业在财务系统切换期间通过股东账户临时垫资，资金在短期内归还，借款协议、会计凭证和税务记录能够对应。。关键事实：个人资金用于短期工资和供应商垫付；全部款项在约定期限内归还；存在董事会决议和借款协议；会计凭证与纳税记录一致。风险模式：公私账户往来、短期资金归集。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：核实垫资商业原因；检查会计和税务处理；确认不存在循环虚构交易。核验动作：取得借款协议和决议；核对会计凭证；抽查供应商付款。经验总结：公私往来需要关注资金最终用途和会计处理，材料闭环充分时可记录排除但应提示账户规范。\n\n[KC-2024-073] 历史案例：建筑企业公私混同与异常票据循环。类型：涉税风险。资金网络：复杂。处置结论：可疑。案件摘要：建筑材料企业频繁向股东个人账户付款并由个人回流关联供应商，发票品名、金额和物流记录存在循环对应异常。。关键事实：对公资金频繁转入股东个人账户；个人账户向关联供应商回流；多张发票号码连续且物流凭证重复；资金规模显著超过项目施工进度。风险模式：公私混同、关联回流、票据异常、经营规模不符。证据材料：交易流水、资金图谱、客户资料、合同票据。专家关注：核对项目进度和付款节点；识别供应商关联关系；检查票据物流真实性。核验动作：补充项目合同和进度证明；核验供应商受益所有人；抽查发票对应物流。经验总结：涉税线索不能只依赖发票形式，应将资金回流、项目进度和供应商控制关系联合分析。\n\n[KC-2023-042] 历史案例：电商促销期间个人付款集中归集。类型：涉诈跑分。资金网络：中等。处置结论：正常。案件摘要：电商企业促销期间出现大量个人付款，款项归集至平台结算账户，但订单、支付渠道、物流和纳税记录能够完整对应。。关键事实：个人付款均可对应平台订单编号；资金按照平台结算协议归集；退款比例与历史促销周期一致；物流签收与发票记录完整。风险模式：多人分散入账、集中归集。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：验证订单真实性；核对平台结算关系；检查退款和物流闭环。核验动作：抽样核验订单和物流；取得平台结算协议；核对纳税申报。经验总结：多人付款本身不等于异常，能够形成订单、支付、物流和税务闭环时应充分记录排除依据。\n\n[KC-2024-017] 历史案例：贸易企业接收个人分散入账后集中快转。类型：涉诈跑分。资金网络：复杂。处置结论：可疑。案件摘要：贸易企业短期接收大量陌生个人账户入账，并在十分钟内集中转往两个固定企业账户，交易规模与登记经营能力明显不符。。关键事实：三日内接收21名个人账户转入合计286万元；92%的入账资金在十五分钟内转出；收款主体与两个资金去向共用设备指纹；合同交易对手、发票开具方与实际收付款方不一致。风险模式：多人分散入账、集中快速转出、固定资金去向、经营背景不符、设备关联。证据材料：交易流水、资金图谱、客户资料、合同票据、尽调记录。专家关注：核对个人付款人与企业经营关系；穿透固定收款账户受益所有人；比对合同发票物流一致性。核验动作：补充主要订单和物流单据；核实个人付款人身份及付款原因；查询关联账户设备和IP。经验总结：企业客户出现个人分散入账时，必须将资金时序、经营背景和设备关联联合判断，不能只看单笔金额。\n\n[KC-2022-086] 历史案例：出口退税回款形成的阶段性跨境回流。类型：跨境资金。资金网络：复杂。处置结论：正常。案件摘要：出口企业在退税和海外经销商集中结算期间出现跨境资金回流，经核验报关、物流、税务和经销协议后能够形成完整业务闭环。。关键事实：回款时间与报关批次一致；海外付款方为长期经销商；回款金额与出口及退税记录匹配；不存在资金再次转回境外。风险模式：跨境集中回款、金额阶段性上升。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：核对出口业务周期；检查境外付款人与合同关系；确认资金最终用途。核验动作：取得报关和物流清单；核对经销协议；抽查回款对应发票。经验总结：跨境回款需要结合企业业务周期判断，不能脱离报关和结算安排孤立评价金额波动。\n\n请输出：核心疑点、相似与差异、证据评价、待核验材料、辅助研判建议、下一步动作和引用来源。"}},"CASE-E:evidence_gap":{"case":{"id":"CASE-E","name":"预警包E｜企业公私混同与票据异常","case_type":"涉税风险","risk_score":76,"complexity_score":69,"network_level":"中 例进行辅助研判。\n\n历史相似案例：\n[KC-2023-064] 历史案例：集团资金归集导致的公私账户短期往来。类型：涉税风险。资金网络：中等。处置结论：正常。案件摘要：家族企业在财务系统切换期间通过股东账户临时垫资，资金在短期内归还，借款协议、会计凭证和税务记录能够对应。。关键事实：个人资金用于短期工资和供应商垫付；全部款项在约定期限内归还；存在董事会决议和借款协议；会计凭证与纳税记录一致。风险模式：公私账户往来、短期资金归集。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：核实垫资商业原因；检查会计和税务处理；确认不存在循环虚构交易。核验动作：取得借款协议和决议；核对会计凭证；抽查供应商付款。经验总结：公私往来需要关注资金最终用途和会计处理，材料闭环充分时可记录排除但应提示账户规范。\n\n[KC-2024-073] 历史案例：建筑企业公私混同与异常票据循环。类型：涉税风险。资金网络：复杂。处置结论：可疑。案件摘要：建筑材料企业频繁向股东个人账户付款并由个人回流关联供应商，发票品名、金额和物流记录存在循环对应异常。。关键事实：对公资金频繁转入股东个人账户；个人账户向关联供应商回流；多张发票号码连续且物流凭证重复；资金规模显著超过项目施工进度。风险模式：公私混同、关联回流、票据异常、经营规模不符。证据材料：交易流水、资金图谱、客户资料、合同票据。专家关注：核对项目进度和付款节点；识别供应商关联关系；检查票据物流真实性。核验动作：补充项目合同和进度证明；核验供应商受益所有人；抽查发票对应物流。经验总结：涉税线索不能只依赖发票形式，应将资金回流、项目进度和供应商控制关系联合分析。\n\n[KC-2023-042] 历史案例：电商促销期间个人付款集中归集。类型：涉诈跑分。资金网络：中等。处置结论：正常。案件摘要：电商企业促销期间出现大量个人付款，款项归集至平台结算账户，但订单、支付渠道、物流和纳税记录能够完整对应。。关键事实：个人付款均可对应平台订单编号；资金按照平台结算协议归集；退款比例与历史促销周期一致；物流签收与发票记录完整。风险模式：多人分散入账、集中归集。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：验证订单真实性；核对平台结算关系；检查退款和物流闭环。核验动作：抽样核验订单和物流；取得平台结算协议；核对纳税申报。经验总结：多人付款本身不等于异常，能够形成订单、支付、物流和税务闭环时应充分记录排除依据。\n\n[KC-2024-017] 历史案例：贸易企业接收个人分散入账后集中快转。类型：涉诈跑分。资金网络：复杂。处置结论：可疑。案件摘要：贸易企业短期接收大量陌生个人账户入账，并在十分钟内集中转往两个固定企业账户，交易规模与登记经营能力明显不符。。关键事实：三日内接收21名个人账户转入合计286万元；92%的入账资金在十五分钟内转出；收款主体与两个资金去向共用设备指纹；合同交易对手、发票开具方与实际收付款方不一致。风险模式：多人分散入账、集中快速转出、固定资金去向、经营背景不符、设备关联。证据材料：交易流水、资金图谱、客户资料、合同票据、尽调记录。专家关注：核对个人付款人与企业经营关系；穿透固定收款账户受益所有人；比对合同发票物流一致性。核验动作：补充主要订单和物流单据；核实个人付款人身份及付款原因；查询关联账户设备和IP。经验总结：企业客户出现个人分散入账时，必须将资金时序、经营背景和设备关联联合判断，不能只看单笔金额。\n\n[KC-2022-086] 历史案例：出口退税回款形成的阶段性跨境回流。类型：跨境资金。资金网络：复杂。处置结论：正常。案件摘要：出口企业在退税和海外经销商集中结算期间出现跨境资金回流，经核验报关、物流、税务和经销协议后能够形成完整业务闭环。。关键事实：回款时间与报关批次一致；海外付款方为长期经销商；回款金额与出口及退税记录匹配；不存在资金再次转回境外。风险模式：跨境集中回款、金额阶段性上升。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：核对出口业务周期；检查境外付款人与合同关系；确认资金最终用途。核验动作：取得报关和物流清单；核对经销协议；抽查回款对应发票。经验总结：跨境回款需要结合企业业务周期判断，不能脱离报关和结算安排孤立评价金额波动。\n\n请输出：核心疑点、相似与差异、证据评价、待核验材料、辅助研判建议、下一步动作和引用来源。"}},"CASE-E:investigation":{"case":{"id":"CASE-E","name":"预警包E｜企业公私混同与票据异常","case_type":"涉税风险","risk_score":76,"complexity_score":69,"network_level":"中等","eviden \n历史相似案例：\n[KC-2023-064] 历史案例：集团资金归集导致的公私账户短期往来。类型：涉税风险。资金网络：中等。处置结论：正常。案件摘要：家族企业在财务系统切换期间通过股东账户临时垫资，资金在短期内归还，借款协议、会计凭证和税务记录能够对应。。关键事实：个人资金用于短期工资和供应商垫付；全部款项在约定期限内归还；存在董事会决议和借款协议；会计凭证与纳税记录一致。风险模式：公私账户往来、短期资金归集。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：核实垫资商业原因；检查会计和税务处理；确认不存在循环虚构交易。核验动作：取得借款协议和决议；核对会计凭证；抽查供应商付款。经验总结：公私往来需要关注资金最终用途和会计处理，材料闭环充分时可记录排除但应提示账户规范。\n\n[KC-2024-073] 历史案例：建筑企业公私混同与异常票据循环。类型：涉税风险。资金网络：复杂。处置结论：可疑。案件摘要：建筑材料企业频繁向股东个人账户付款并由个人回流关联供应商，发票品名、金额和物流记录存在循环对应异常。。关键事实：对公资金频繁转入股东个人账户；个人账户向关联供应商回流；多张发票号码连续且物流凭证重复；资金规模显著超过项目施工进度。风险模式：公私混同、关联回流、票据异常、经营规模不符。证据材料：交易流水、资金图谱、客户资料、合同票据。专家关注：核对项目进度和付款节点；识别供应商关联关系；检查票据物流真实性。核验动作：补充项目合同和进度证明；核验供应商受益所有人；抽查发票对应物流。经验总结：涉税线索不能只依赖发票形式，应将资金回流、项目进度和供应商控制关系联合分析。\n\n[KC-2023-042] 历史案例：电商促销期间个人付款集中归集。类型：涉诈跑分。资金网络：中等。处置结论：正常。案件摘要：电商企业促销期间出现大量个人付款，款项归集至平台结算账户，但订单、支付渠道、物流和纳税记录能够完整对应。。关键事实：个人付款均可对应平台订单编号；资金按照平台结算协议归集；退款比例与历史促销周期一致；物流签收与发票记录完整。风险模式：多人分散入账、集中归集。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：验证订单真实性；核对平台结算关系；检查退款和物流闭环。核验动作：抽样核验订单和物流；取得平台结算协议；核对纳税申报。经验总结：多人付款本身不等于异常，能够形成订单、支付、物流和税务闭环时应充分记录排除依据。\n\n[KC-2024-017] 历史案例：贸易企业接收个人分散入账后集中快转。类型：涉诈跑分。资金网络：复杂。处置结论：可疑。案件摘要：贸易企业短期接收大量陌生个人账户入账，并在十分钟内集中转往两个固定企业账户，交易规模与登记经营能力明显不符。。关键事实：三日内接收21名个人账户转入合计286万元；92%的入账资金在十五分钟内转出；收款主体与两个资金去向共用设备指纹；合同交易对手、发票开具方与实际收付款方不一致。风险模式：多人分散入账、集中快速转出、固定资金去向、经营背景不符、设备关联。证据材料：交易流水、资金图谱、客户资料、合同票据、尽调记录。专家关注：核对个人付款人与企业经营关系；穿透固定收款账户受益所有人；比对合同发票物流一致性。核验动作：补充主要订单和物流单据；核实个人付款人身份及付款原因；查询关联账户设备和IP。经验总结：企业客户出现个人分散入账时，必须将资金时序、经营背景和设备关联联合判断，不能只看单笔金额。\n\n[KC-2022-086] 历史案例：出口退税回款形成的阶段性跨境回流。类型：跨境资金。资金网络：复杂。处置结论：正常。案件摘要：出口企业在退税和海外经销商集中结算期间出现跨境资金回流，经核验报关、物流、税务和经销协议后能够形成完整业务闭环。。关键事实：回款时间与报关批次一致；海外付款方为长期经销商；回款金额与出口及退税记录匹配；不存在资金再次转回境外。风险模式：跨境集中回款、金额阶段性上升。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：核对出口业务周期；检查境外付款人与合同关系；确认资金最终用途。核验动作：取得报关和物流清单；核对经销协议；抽查回款对应发票。经验总结：跨境回款需要结合企业业务周期判断，不能脱离报关和结算安排孤立评价金额波动。\n\n请输出：核心疑点、相似与差异、证据评价、待核验材料、辅助研判建议、下一步动作和引用来源。"}},"CASE-E:comparison":{"case":{"id":"CASE-E","name":"预警包E｜企业公私混同与票据异常","case_type":"涉税风险","risk_score":76,"complexity_score":69,"network_level":"中等","evidence_types":["交 [KC-2023-064] 历史案例：集团资金归集导致的公私账户短期往来。类型：涉税风险。资金网络：中等。处置结论：正常。案件摘要：家族企业在财务系统切换期间通过股东账户临时垫资，资金在短期内归还，借款协议、会计凭证和税务记录能够对应。。关键事实：个人资金用于短期工资和供应商垫付；全部款项在约定期限内归还；存在董事会决议和借款协议；会计凭证与纳税记录一致。风险模式：公私账户往来、短期资金归集。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：核实垫资商业原因；检查会计和税务处理；确认不存在循环虚构交易。核验动作：取得借款协议和决议；核对会计凭证；抽查供应商付款。经验总结：公私往来需要关注资金最终用途和会计处理，材料闭环充分时可记录排除但应提示账户规范。\n\n[KC-2024-073] 历史案例：建筑企业公私混同与异常票据循环。类型：涉税风险。资金网络：复杂。处置结论：可疑。案件摘要：建筑材料企业频繁向股东个人账户付款并由个人回流关联供应商，发票品名、金额和物流记录存在循环对应异常。。关键事实：对公资金频繁转入股东个人账户；个人账户向关联供应商回流；多张发票号码连续且物流凭证重复；资金规模显著超过项目施工进度。风险模式：公私混同、关联回流、票据异常、经营规模不符。证据材料：交易流水、资金图谱、客户资料、合同票据。专家关注：核对项目进度和付款节点；识别供应商关联关系；检查票据物流真实性。核验动作：补充项目合同和进度证明；核验供应商受益所有人；抽查发票对应物流。经验总结：涉税线索不能只依赖发票形式，应将资金回流、项目进度和供应商控制关系联合分析。\n\n[KC-2023-042] 历史案例：电商促销期间个人付款集中归集。类型：涉诈跑分。资金网络：中等。处置结论：正常。案件摘要：电商企业促销期间出现大量个人付款，款项归集至平台结算账户，但订单、支付渠道、物流和纳税记录能够完整对应。。关键事实：个人付款均可对应平台订单编号；资金按照平台结算协议归集；退款比例与历史促销周期一致；物流签收与发票记录完整。风险模式：多人分散入账、集中归集。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：验证订单真实性；核对平台结算关系；检查退款和物流闭环。核验动作：抽样核验订单和物流；取得平台结算协议；核对纳税申报。经验总结：多人付款本身不等于异常，能够形成订单、支付、物流和税务闭环时应充分记录排除依据。\n\n[KC-2024-017] 历史案例：贸易企业接收个人分散入账后集中快转。类型：涉诈跑分。资金网络：复杂。处置结论：可疑。案件摘要：贸易企业短期接收大量陌生个人账户入账，并在十分钟内集中转往两个固定企业账户，交易规模与登记经营能力明显不符。。关键事实：三日内接收21名个人账户转入合计286万元；92%的入账资金在十五分钟内转出；收款主体与两个资金去向共用设备指纹；合同交易对手、发票开具方与实际收付款方不一致。风险模式：多人分散入账、集中快速转出、固定资金去向、经营背景不符、设备关联。证据材料：交易流水、资金图谱、客户资料、合同票据、尽调记录。专家关注：核对个人付款人与企业经营关系；穿透固定收款账户受益所有人；比对合同发票物流一致性。核验动作：补充主要订单和物流单据；核实个人付款人身份及付款原因；查询关联账户设备和IP。经验总结：企业客户出现个人分散入账时，必须将资金时序、经营背景和设备关联联合判断，不能只看单笔金额。\n\n[KC-2022-086] 历史案例：出口退税回款形成的阶段性跨境回流。类型：跨境资金。资金网络：复杂。处置结论：正常。案件摘要：出口企业在退税和海外经销商集中结算期间出现跨境资金回流，经核验报关、物流、税务和经销协议后能够形成完整业务闭环。。关键事实：回款时间与报关批次一致；海外付款方为长期经销商；回款金额与出口及退税记录匹配；不存在资金再次转回境外。风险模式：跨境集中回款、金额阶段性上升。证据材料：交易流水、客户资料、合同票据、尽调记录。专家关注：核对出口业务周期；检查境外付款人与合同关系；确认资金最终用途。核验动作：取得报关和物流清单；核对经销协议；抽查回款对应发票。经验总结：跨境回款需要结合企业业务周期判断，不能脱离报关和结算安排孤立评价金额波动。\n\n请输出：核心疑点、相似与差异、证据评价、待核验材料、辅助研判建议、下一步动作和引用来源。"}},"CASE-F:assessment":{"case":{"id":"CASE-F","name":"预警包F｜名单关联与贸易背景异常","case_type":"制裁风险","risk_score":87,"complexity_score":81,"network_level":"复杂","evidence_types":["外部名单","合同票据" 选：制裁风险。风险分：87。复杂度：81。资金网络：复杂。案件摘要：企业交易对手名称与外部关注名单存在高相似匹配，贸易路线和合同货物描述出现异常变更，最终受益人关系尚未完全查清。。已确认事实：。模型推断：。待核验事项：。甄别人员问题：结合当前案件事实与历史案例进行辅助研判。\n\n历史相似案例：\n[KC-2024-091] 历史案例：名单关联主体借贸易合同转移资金。类型：制裁风险。资金网络：复杂。处置结论：可疑。案件摘要：科技设备企业通过名称相近的中间贸易商向高风险地区转移资金，最终受益所有人与外部名单主体存在控制关系。。关键事实：交易对手名称与名单主体高度近似；中间贸易商设立时间短且无实际经营；设备最终目的地与合同不一致；受益所有人穿透后与名单主体关联。风险模式：名单弱匹配、中间贸易商、最终目的地异常、受益所有人关联。证据材料：外部名单、交易流水、资金图谱、合同票据、客户资料。专家关注：进行实体消歧；穿透受益所有人；核对货物最终用户和目的地。核验动作：补充最终用户声明；核验贸易物流路径；查询境外公司控制关系。经验总结：名单弱匹配不能直接下结论，应以注册信息、控制关系、货物流向和受益所有人完成多源消歧。\n\n[KC-2022-108] 历史案例：同名企业导致的外部名单误匹配。类型：制裁风险。资金网络：简单。处置结论：正常。案件摘要：境内设备企业英文名称与名单主体相近，但注册地、统一标识、股东、业务范围和交易地区均不相同。。关键事实：企业注册号与名单主体不一致；股东和受益所有人无交集；实际经营及货物流向均在境内；名称差异能够由翻译习惯解释。风险模式：名单弱匹配、名称相似。证据材料：外部名单、客户资料、合同票据。专家关注：完成实体消歧；核对注册标识和控制关系；确认交易地区。核验动作：取得企业登记材料；复核受益所有人；抽查合同物流。经验总结：名称相似只是检索线索，必须以稳定标识和控制关系完成消歧，防止名单风险误判。\n\n[KC-2024-073] 历史案例：建筑企业公私混同与异常票据循环。类型：涉税风险。资金网络：复杂。处置结论：可疑。案件摘要：建筑材料企业频繁向股东个人账户付款并由个人回流关联供应商，发票品名、金额和物流记录存在循环对应异常。。关键事实：对公资金频繁转入股东个人账户；个人账户向关联供应商回流；多张发票号码连续且物流凭证重复；资金规模显著超过项目施工进度。风险模式：公私混同、关联回流、票据异常、经营规模不符。证据材料：交易流水、资金图谱、客户资料、合同票据。专家关注：核对项目进度和付款节点；识别供应商关联关系；检查票据物流真实性。核验动作：补充项目合同和进度证明；核验供应商受益所有人；抽查发票对应物流。经验总结：涉税线索不能只依赖发票形式，应将资金回流、项目进度和供应商控制关系联合分析。\n\n[KC-2024-031] 历史案例：多层跨境回流与贸易背景不一致。类型：跨境资金。资金网络：高度复杂。处置结论：可疑。案件摘要：资金经境内多个贸易主体分拆后汇往境外，再由关联离岸公司以服务费名义回流，贸易单据与实际货运不匹配。。关键事实：资金经过四层账户分拆；境外收款人与境内股东存在隐性关联；报关金额与跨境付款金额差异显著；服务合同缺少具体交付成果。风险模式：多层资金链、跨境回流、关联交易、贸易背景异常。证据材料：交易流水、资金图谱、合同票据、外部名单、尽调记录。专家关注：穿透境外受益所有人；比对报关物流和付款；识别循环回流路径。核验动作：补充报关单和物流凭证；核实境外主体控制关系；核验服务交付成果。经验总结：跨境案件应优先还原资金闭环和控制关系，再判断合同形式是否具有真实经济目的。\n\n[KC-2024-017] 历史案例：贸易企业接收个人分散入账后集中快转。类型：涉诈跑分。资金网络：复杂。处置结论：可疑。案件摘要：贸易企业短期接收大量陌生个人账户入账，并在十分钟内集中转往两个固定企业账户，交易规模与登记经营能力明显不符。。关键事实：三日内接收21名个人账户转入合计286万元；92%的入账资金在十五分钟内转出；收款主体与两个资金去向共用设备指纹；合同交易对手、发票开具方与实际收付款方不一致。风险模式：多人分散入账、集中快速转出、固定资金去向、经营背景不符、设备关联。证据材料：交易流水、资金图谱、客户资料、合同票据、尽调记录。专家关注：核对个人付款人与企业经营关系；穿透固定收款账户受益所有人；比对合同发票物流一致性。核验动作：补充主要订单和物流单据；核实个人付款人身份及付款原因；查询关联账户设备和IP。经验总结：企业客户出现个人分散入账时，必须将资金时序、经营背景和设备关联联合判断，不能只看单笔金额。\n\n请输出：核心疑点、相似与差异、证据评价、待核验材料、辅助研判建议、下一步动作和引用来源。"}},"CASE-F 或历史案例编号；证据不足时明确说明暂无法判断。","user":"任务：识别证据缺口\n当前案件：预警包F｜名单关联与贸易背景异常。案件类型候选：制裁风险。风险分：87。复杂度：81。资金网络：复杂。案件摘要：企业交易对手名称与外部关注名单存在高相似匹配，贸易路线和合同货物描述出现异常变更，最终受益人关系尚未完全查清。。已确认事实：。模型推断：。待核验事项：。甄别人员问题：结合当前案件事实与历史案例进行辅助研判。\n\n历史相似案例：\n[KC-2024-091] 历史案例：名单关联主体借贸易合同转移资金。类型：制裁风险。资金网络：复杂。处置结论：可疑。案件摘要：科技设备企业通过名称相近的中间贸易商向高风险地区转移资金，最终受益所有人与外部名单主体存在控制关系。。关键事实：交易对手名称与名单主体高度近似；中间贸易商设立时间短且无实际经营；设备最终目的地与合同不一致；受益所有人穿透后与名单主体关联。风险模式：名单弱匹配、中间贸易商、最终目的地异常、受益所有人关联。证据材料：外部名单、交易流水、资金图谱、合同票据、客户资料。专家关注：进行实体消歧；穿透受益所有人；核对货物最终用户和目的地。核验动作：补充最终用户声明；核验贸易物流路径；查询境外公司控制关系。经验总结：名单弱匹配不能直接下结论，应以注册信息、控制关系、货物流向和受益所有人完成多源消歧。\n\n[KC-2022-108] 历史案例：同名企业导致的外部名单误匹配。类型：制裁风险。资金网络：简单。处置结论：正常。案件摘要：境内设备企业英文名称与名单主体相近，但注册地、统一标识、股东、业务范围和交易地区均不相同。。关键事实：企业注册号与名单主体不一致；股东和受益所有人无交集；实际经营及货物流向均在境内；名称差异能够由翻译习惯解释。风险模式：名单弱匹配、名称相似。证据材料：外部名单、客户资料、合同票据。专家关注：完成实体消歧；核对注册标识和控制关系；确认交易地区。核验动作：取得企业登记材料；复核受益所有人；抽查合同物流。经验总结：名称相似只是检索线索，必须以稳定标识和控制关系完成消歧，防止名单风险误判。\n\n[KC-2024-073] 历史案例：建筑企业公私混同与异常票据循环。类型：涉税风险。资金网络：复杂。处置结论：可疑。案件摘要：建筑材料企业频繁向股东个人账户付款并由个人回流关联供应商，发票品名、金额和物流记录存在循环对应异常。。关键事实：对公资金频繁转入股东个人账户；个人账户向关联供应商回流；多张发票号码连续且物流凭证重复；资金规模显著超过项目施工进度。风险模式：公私混同、关联回流、票据异常、经营规模不符。证据材料：交易流水、资金图谱、客户资料、合同票据。专家关注：核对项目进度和付款节点；识别供应商关联关系；检查票据物流真实性。核验动作：补充项目合同和进度证明；核验供应商受益所有人；抽查发票对应物流。经验总结：涉税线索不能只依赖发票形式，应将资金回流、项目进度和供应商控制关系联合分析。\n\n[KC-2024-031] 历史案例：多层跨境回流与贸易背景不一致。类型：跨境资金。资金网络：高度复杂。处置结论：可疑。案件摘要：资金经境内多个贸易主体分拆后汇往境外，再由关联离岸公司以服务费名义回流，贸易单据与实际货运不匹配。。关键事实：资金经过四层账户分拆；境外收款人与境内股东存在隐性关联；报关金额与跨境付款金额差异显著；服务合同缺少具体交付成果。风险模式：多层资金链、跨境回流、关联交易、贸易背景异常。证据材料：交易流水、资金图谱、合同票据、外部名单、尽调记录。专家关注：穿透境外受益所有人；比对报关物流和付款；识别循环回流路径。核验动作：补充报关单和物流凭证；核实境外主体控制关系；核验服务交付成果。经验总结：跨境案件应优先还原资金闭环和控制关系，再判断合同形式是否具有真实经济目的。\n\n[KC-2024-017] 历史案例：贸易企业接收个人分散入账后集中快转。类型：涉诈跑分。资金网络：复杂。处置结论：可疑。案件摘要：贸易企业短期接收大量陌生个人账户入账，并在十分钟内集中转往两个固定企业账户，交易规模与登记经营能力明显不符。。关键事实：三日内接收21名个人账户转入合计286万元；92%的入账资金在十五分钟内转出；收款主体与两个资金去向共用设备指纹；合同交易对手、发票开具方与实际收付款方不一致。风险模式：多人分散入账、集中快速转出、固定资金去向、经营背景不符、设备关联。证据材料：交易流水、资金图谱、客户资料、合同票据、尽调记录。专家关注：核对个人付款人与企业经营关系；穿透固定收款账户受益所有人；比对合同发票物流一致性。核验动作：补充主要订单和物流单据；核实个人付款人身份及付款原因；查询关联账户设备和IP。经验总结：企业客户出现个人分散入账时，必须将资金时序、经营背景和设备关联联合 案件事实、历史案例和业务约束回答。必须区分已确认事实、模型推断和待核验事项；不得把案件类型候选作为法律定性；每项关键判断必须引用当前证据来源或历史案例编号；证据不足时明确说明暂无法判断。","user":"任务：生成增强尽调清单\n当前案件：预警包F｜名单关联与贸易背景异常。案件类型候选：制裁风险。风险分：87。复杂度：81。资金网络：复杂。案件摘要：企业交易对手名称与外部关注名单存在高相似匹配，贸易路线和合同货物描述出现异常变更，最终受益人关系尚未完全查清。。已确认事实：。模型推断：。待核验事项：。甄别人员问题：结合当前案件事实与历史案例进行辅助研判。\n\n历史相似案例：\n[KC-2024-091] 历史案例：名单关联主体借贸易合同转移资金。类型：制裁风险。资金网络：复杂。处置结论：可疑。案件摘要：科技设备企业通过名称相近的中间贸易商向高风险地区转移资金，最终受益所有人与外部名单主体存在控制关系。。关键事实：交易对手名称与名单主体高度近似；中间贸易商设立时间短且无实际经营；设备最终目的地与合同不一致；受益所有人穿透后与名单主体关联。风险模式：名单弱匹配、中间贸易商、最终目的地异常、受益所有人关联。证据材料：外部名单、交易流水、资金图谱、合同票据、客户资料。专家关注：进行实体消歧；穿透受益所有人；核对货物最终用户和目的地。核验动作：补充最终用户声明；核验贸易物流路径；查询境外公司控制关系。经验总结：名单弱匹配不能直接下结论，应以注册信息、控制关系、货物流向和受益所有人完成多源消歧。\n\n[KC-2022-108] 历史案例：同名企业导致的外部名单误匹配。类型：制裁风险。资金网络：简单。处置结论：正常。案件摘要：境内设备企业英文名称与名单主体相近，但注册地、统一标识、股东、业务范围和交易地区均不相同。。关键事实：企业注册号与名单主体不一致；股东和受益所有人无交集；实际经营及货物流向均在境内；名称差异能够由翻译习惯解释。风险模式：名单弱匹配、名称相似。证据材料：外部名单、客户资料、合同票据。专家关注：完成实体消歧；核对注册标识和控制关系；确认交易地区。核验动作：取得企业登记材料；复核受益所有人；抽查合同物流。经验总结：名称相似只是检索线索，必须以稳定标识和控制关系完成消歧，防止名单风险误判。\n\n[KC-2024-073] 历史案例：建筑企业公私混同与异常票据循环。类型：涉税风险。资金网络：复杂。处置结论：可疑。案件摘要：建筑材料企业频繁向股东个人账户付款并由个人回流关联供应商，发票品名、金额和物流记录存在循环对应异常。。关键事实：对公资金频繁转入股东个人账户；个人账户向关联供应商回流；多张发票号码连续且物流凭证重复；资金规模显著超过项目施工进度。风险模式：公私混同、关联回流、票据异常、经营规模不符。证据材料：交易流水、资金图谱、客户资料、合同票据。专家关注：核对项目进度和付款节点；识别供应商关联关系；检查票据物流真实性。核验动作：补充项目合同和进度证明；核验供应商受益所有人；抽查发票对应物流。经验总结：涉税线索不能只依赖发票形式，应将资金回流、项目进度和供应商控制关系联合分析。\n\n[KC-2024-031] 历史案例：多层跨境回流与贸易背景不一致。类型：跨境资金。资金网络：高度复杂。处置结论：可疑。案件摘要：资金经境内多个贸易主体分拆后汇往境外，再由关联离岸公司以服务费名义回流，贸易单据与实际货运不匹配。。关键事实：资金经过四层账户分拆；境外收款人与境内股东存在隐性关联；报关金额与跨境付款金额差异显著；服务合同缺少具体交付成果。风险模式：多层资金链、跨境回流、关联交易、贸易背景异常。证据材料：交易流水、资金图谱、合同票据、外部名单、尽调记录。专家关注：穿透境外受益所有人；比对报关物流和付款；识别循环回流路径。核验动作：补充报关单和物流凭证；核实境外主体控制关系；核验服务交付成果。经验总结：跨境案件应优先还原资金闭环和控制关系，再判断合同形式是否具有真实经济目的。\n\n[KC-2024-017] 历史案例：贸易企业接收个人分散入账后集中快转。类型：涉诈跑分。资金网络：复杂。处置结论：可疑。案件摘要：贸易企业短期接收大量陌生个人账户入账，并在十分钟内集中转往两个固定企业账户，交易规模与登记经营能力明显不符。。关键事实：三日内接收21名个人账户转入合计286万元；92%的入账资金在十五分钟内转出；收款主体与两个资金去向共用设备指纹；合同交易对手、发票开具方与实际收付款方不一致。风险模式：多人分散入账、集中快速转出、固定资金去向、经营背景不符、设备关联。证据材料：交易流水、资金图谱、客户资料、合同票据、尽调记录。专家关注：核对个人付款人与企业经营关系；穿透固定收款账户受益所有人；比对合同发票物流一致性。核验动作：补充主要订 客户资料、合同票据、尽调记录。专家关注：核对个人付款人与企业经营关系；穿透固定收款账户受益所有人；比对合同发票物流一致性。核验动作：补充主要订单和物流单据；核实个人付款人身份及付款原因；查询关联账户设备和IP。经验总结：企业客户出现个人分散入账时，必须将资金时序、经营背景和设备关联联合判断，不能只看单笔金额。\n\n请输出：核心疑点、相似与差异、证据评价、待核验材料、辅助研判建议、下一步动作和引用来源。"}}}};

  ) {

        `API request timed out after ${duration}ms`,
        "TimeoutError",
      ));

      return await fetchImpl(resource, {
        ...options,

      });
    } finally {
      clearTimeout(timeout);
      callerSignal?.removeEventListener?.("abort", forwardAbort);

      })
      .map(({ part }) => part);

      return { nodeIds: new Set(), edgeIds: new Set() };
    }

    const connectedIds = new Set([normalizedSelectedId]);
    const connectingEdges = edges.filter((edge) => {
      if (edge.source !== normalizedSelectedId && edge.target !== normalizedSelectedId) return false;
      connectedIds.add(edge.source);
      connectedIds.add(edge.target);
      return true;
    });

    return {
      nodeIds: new Set([
        normalizedSelectedId,
        ...nodes
          .map((node) => node.id)
          .filter((id) => id !== normalizedSelectedId && connectedIds.has(id)),
      ]),
      edgeIds: new Set(connectingEdges.map((edge) => edge.id)),
    };

  function graphId(value) {
    if (value === null || value === undefined || value === "") return null;
    return String(value);
  }

  function idAllocator(prefix, reservedIds) {
    const usedIds = new Set();
    let generatedIndex = 0;
    return (requestedId) => {
      const explicitId = graphId(requestedId);
      if (explicitId !== null && !usedIds.has(explicitId)) {
        usedIds.add(explicitId);
        return explicitId;
      }
      let generatedId;
      do {
        generatedId = `${prefix}-${generatedIndex}`;
        generatedIndex += 1;
      } while (reservedIds.has(generatedId) || usedIds.has(generatedId));
      usedIds.add(generatedId);
      return generatedId;

  function normalizeEvidenceNetwork(network = {}) {
    const rawNodes = (Array.isArray(network?.nodes) ? network.nodes : [])
      .filter((node) => node && typeof node === "object" && !Array.isArray(node));
    const reservedNodeIds = new Set(
      rawNodes.map((node) => graphId(node.id)).filter((id) => id !== null),
    );
    const allocateNodeId = idAllocator("network-node", reservedNodeIds);
    const endpointAliases = new Map();
    const nodes = rawNodes.map((node, index) => {
      const explicitId = graphId(node.id);
      const id = allocateNodeId(node.id);
      if (explicitId !== null && !endpointAliases.has(explicitId)) {
        endpointAliases.set(explicitId, id);
      }
      const angle = index / Math.max(rawNodes.length, 1) * Math.PI * 2 - Math.PI / 2;
      const rawX = Number(node.position?.x);
      const rawY = Number(node.position?.y);
      return {
        ...node,
        id,
        type: String(node.type ?? "relation"),
        position: {
          x: Number.isFinite(rawX) ? rawX : 500 + Math.cos(angle) * 310,
          y: Number.isFinite(rawY) ? rawY : 300 + Math.sin(angle) * 190,
        },
      };
    });

    const nodeIds = new Set(nodes.map((node) => node.id));
    const resolveEndpoint = (value) => {
      const endpointId = graphId(value);
      if (endpointId === null) return null;
      return endpointAliases.get(endpointId)
        ?? (nodeIds.has(endpointId) ? endpointId : null);
    };
    const rawEdges = (Array.isArray(network?.edges) ? network.edges : [])
      .filter((edge) => edge && typeof edge === "object" && !Array.isArray(edge));
    const reservedEdgeIds = new Set(
      rawEdges.map((edge) => graphId(edge.id)).filter((id) => id !== null),
    );
    const allocateEdgeId = idAllocator("network-edge", reservedEdgeIds);
    const edges = rawEdges.flatMap((edge) => {
      const source = resolveEndpoint(edge.source);
      const target = resolveEndpoint(edge.target);
      if (source === null || target === null) return [];
      const amount = Number(edge.amount ?? 0);
      return [{
        ...edge,
        id: allocateEdgeId(edge.id),
        source,
        target,
        kind: String(edge.kind ?? "relation"),
        mode: ["always", "collapsed", "expanded"].includes(edge.mode)
          ? edge.mode
          : "always",
        amount: Number.isFinite(amount) ? Math.max(0, amount) : 0,

    });

      summary: Array.isArray(network?.summary) ? network.summary : [],
      nodes,
      edges,
    };

  function legacyEvidenceNetwork(network = {}) {
    const tuples = Array.isArray(network?.nodes) ? network.nodes : [];
    const nodeByLegacyIndex = new Map();
    const nodes = [];
    tuples.forEach((tuple, index) => {
      if (!Array.isArray(tuple)) return;
      const angle = (index - 1) / Math.max(tuples.length - 1, 1) * Math.PI * 2 - Math.PI / 2;
      const isCenter = index === 0;
      const node = {
        id: `legacy-${index}`,
        label: tuple[0] ?? "",
        type: tuple[1] ?? "relation",
        position: {
          x: isCenter ? 500 : 500 + Math.cos(angle) * 320,
          y: isCenter ? 285 : 285 + Math.sin(angle) * 190,
        },
        displayPriority: 100,
        role: "",
        riskTags: [],
        metrics: [],
        paths: [],
        evidence: [],
        anchors: [],
      };
      nodes.push(node);
      nodeByLegacyIndex.set(index, node);
    });
    const edges = (Array.isArray(network?.edges) ? network.edges : []).flatMap((edge, index) => {
      if (!Array.isArray(edge)) return [];
      const source = nodeByLegacyIndex.get(Number(edge[0]));
      const target = nodeByLegacyIndex.get(Number(edge[1]));
      if (!source || !target) return [];
      return [{
        id: `legacy-edge-${index}`,
        source: source.id,
        target: target.id,
        kind: "relation",
        mode: "always",
        amount: 0,
        label: "",
        anchor: "",
      }];
    });
    return { nodes, edges, summary: [] };
  }

  function isUsableEvidenceNetwork(network) {
    if (!network || typeof network !== "object" || !Array.isArray(network.nodes)) {
      return false;
    }
    return network.nodes.some((node) => (
      node
      && typeof node === "object"
      && !Array.isArray(node)
      && graphId(node.id) !== null
      && node.label !== null
      && node.label !== undefined
      && String(node.label).trim() !== ""
    ));
  }

  function resolveProfileEvidenceNetwork(meta = {}) {
    if (isUsableEvidenceNetwork(meta.evidenceNetwork)) {
      const richNetwork = normalizeEvidenceNetwork(meta.evidenceNetwork);
      if (richNetwork.nodes.length) return richNetwork;
    }
    return normalizeEvidenceNetwork(legacyEvidenceNetwork(meta.network));
  }

  function handleNetworkActivationKey(event, activate) {
    if (event?.key !== "Enter" && event?.key !== " ") return false;
    event.preventDefault?.();
    activate?.();
    return true;
  }

  function captureNetworkViewport(root) {
    const scroller = root?.querySelector?.(".network-svg-scroll");
    return {
      left: Math.max(0, Number(scroller?.scrollLeft) || 0),
      top: Math.max(0, Number(scroller?.scrollTop) || 0),
    };
  }

  function clampScroll(value, size, viewportSize) {
    const maximum = Math.max(0, (Number(size) || 0) - (Number(viewportSize) || 0));
    return Math.max(0, Math.min(maximum, Number(value) || 0));
  }

  function revealNodeInScroller(scroller, node, padding = 20) {
    if (!scroller?.getBoundingClientRect || !node?.getBoundingClientRect) return false;
    const scrollerRect = scroller.getBoundingClientRect();
    const nodeRect = node.getBoundingClientRect();
    let nextLeft = Number(scroller.scrollLeft) || 0;
    let nextTop = Number(scroller.scrollTop) || 0;
    if (nodeRect.left < scrollerRect.left + padding) {
      nextLeft += nodeRect.left - scrollerRect.left - padding;
    } else if (nodeRect.right > scrollerRect.right - padding) {
      nextLeft += nodeRect.right - scrollerRect.right + padding;
    }
    if (nodeRect.top < scrollerRect.top + padding) {
      nextTop += nodeRect.top - scrollerRect.top - padding;
    } else if (nodeRect.bottom > scrollerRect.bottom - padding) {
      nextTop += nodeRect.bottom - scrollerRect.bottom + padding;
    }
    scroller.scrollLeft = clampScroll(nextLeft, scroller.scrollWidth, scroller.clientWidth);
    scroller.scrollTop = clampScroll(nextTop, scroller.scrollHeight, scroller.clientHeight);
    return true;
  }

  function restoreNetworkViewport(root, {
    focusTarget = "",
    nodeId = "",
    revealPanel = false,
    scrollState = { left: 0, top: 0 },
  } = {}) {
    const scroller = root?.querySelector?.(".network-svg-scroll");
    if (scroller) {
      scroller.scrollLeft = clampScroll(
        scrollState?.left,
        scroller.scrollWidth,
        scroller.clientWidth,
      );
      scroller.scrollTop = clampScroll(
        scrollState?.top,
        scroller.scrollHeight,
        scroller.clientHeight,
      );
    }

      ? [...root.querySelectorAll("[data-network-node]")]
        .find((candidate) => candidate.dataset?.networkNode === requestedNodeId)
      : null;
    const nodeRevealed = Boolean(node && revealNodeInScroller(scroller, node));
    const panel = root?.querySelector?.("#networkEvidencePanel");
    if (revealPanel && panel?.scrollIntoView) {
      panel.scrollIntoView({ behavior: "auto", block: "start", inline: "nearest" });
    }
    if (focusTarget === "node" && node?.scrollIntoView) {
      node.scrollIntoView({ behavior: "auto", block: "center", inline: "nearest" });
    }
    let focusControl = null;
    if (focusTarget === "panel") {
      focusControl = root?.querySelector?.("#closeNetworkEvidence") || node;
    } else if (focusTarget === "node") {
      focusControl = node;
    } else if (focusTarget === "toggle") {
      focusControl = root?.querySelector?.("#toggleAccountGroup");
    }
    focusControl?.focus?.({ preventScroll: true });
    return { nodeRevealed, focused: Boolean(focusControl) };
  }

  global.BRAINS_UI_LOGIC = {
    beginParsingAnimation,
    captureNetworkViewport,
    cancelParsingAnimation,
    completeParsingAnimation,
    escapeHtml,
    fetchWithTimeout,
    shouldUsePortableFallback,

async function portableFallback(path, options = {}) {
  if (!portableData) return null;

  }

    apiBase,
    path,
    portableDataAvailable: Boolean(portableData),

      apiUrl(path),
      options,

function renderRoute() {
  const route = parseRoute();
  if (route.path && currentRoutePath() !== route.path) history.replaceState({}, "", routeHref(route.path));
  updateShell(route);
  const renderers = {
    cases: renderCases,
    parsing: renderParsing,
    profile: renderProfile,
    assistant: renderAssistant,
    staff: renderStaff,
    matching: renderMatching,
    collaboration: renderCollaboration,
    risk: renderRiskBriefings,
  };
  renderers[route.name]();
  appView.focus({ preventScroll: true });
  refreshIcons();
  $("#sidebar").classList.remove("is-open");
}

function pageHead(title, subtitle, actions = "", eyebrow = "") {
  return `<header class="page-head">
    <div class="page-title">${eyebrow ? `<span class="eyebrow">${eyebrow}</span>` : ""}<h1>${title}</h1><p>${subtitle}</p></div>
    <div class="page-actions">${actions}</div>
  </header>`;
}

function scoreTone(score) {
  if (score >= 85) return "is-red";
  if (score >= 70) return "is-amber";
  return "is-blue";
}

function statusTone(status) {
  if (status.includes("待解析")) return "status-amber";
  if (status.includes("画像")) return "status-blue";
  return "status-teal";
}

function renderCases() {
  const cases = state.bootstrap.cases;
  const materials = cases.reduce((sum, item) => sum + getMeta(item.id).files.length, 0);
  appView.innerHTML = `
    ${pageHead("预警案件池", "从BRAINS上游预警进入处置队列开始，统一查看案件风险、复杂度与材料完整性。", `
      <button class="button" id="uploadCase">${icon("upload")}导入材料</button>
      <button class="button button-primary" id="newCase">${icon("plus")}新建预警包</button>`, "当日预警批次 · 2026年7月31日")}
    <section class="metric-band">
      ${metric("inbox", "当日预警", cases.length, "全部进入统一批次")}
      ${metric("files", "已接入材料", materials, "结构化与非结构化")}
      ${metric("triangle-alert", "高风险", cases.filter((item) => item.risk_score >= 85).length, "风险分≥85", "red")}
      ${metric("network", "复杂网络", cases.filter((item) => item.complexity_score >= 80).length, "复杂度分≥80", "gold")}
    </section>
    <section class="work-surface">
      <div class="surface-toolbar">
        <label class="search-field">${icon("search")}<input id="caseSearch" placeholder="搜索案件编号、客户、材料或类型候选" /></label>
        <select class="compact-select" id="riskFilter"><option value="all">全部风险</option><option value="high">高风险</option><option value="other">其他风险</option></select>
        <select class="compact-select" id="complexFilter"><option value="all">全部复杂度</option><option value="complex">复杂案件</option><option value="other">一般案件</option></select>
        <select class="compact-select" id="statusFilter"><option value="all">全部阶段</option>${[...new Set(cases.map((item) => getMeta(item.id).status))].map((status) => `<option>${status}</option>`).join("")}</select>
        <span class="toolbar-note">${icon("layers-3")}风险与复杂度分别计算</span>
      </div>
      <div class="table-shell">
        <table class="data-table case-table">
          <thead><tr><th>预警案件</th><th>类型候选</th><th>风险</th><th>复杂度</th><th>材料</th><th>待核验</th><th>处理阶段</th><th></th></tr></thead>

  $("#riskFilter").addEventListener("change", filterCases);
  $("#complexFilter").addEventListener("change", filterCases);
  $("#statusFilter").addEventListener("change", filterCases);
  $("#uploadCase").addEventListener("click", () => fileInput.click());
  $("#newCase").addEventListener("click", openNewCaseModal);
  $$("#caseRows tr").forEach((row) => {
    row.addEventListener("click", (event) => {
      const id = row.dataset.caseId;
      setCurrentCase(id);
      if (event.target.closest(".case-detail")) showCaseDrawer(id);

function metric(iconName, label, value, detail, tone = "") {
  return `<div class="metric-item ${tone}"><span class="metric-symbol">${icon(iconName)}</span><div><span>${label}</span><strong>${value}</strong><small>${detail}</small></div></div>`;
}

function caseRow(item) {
  const meta = getMeta(item.id);
  return `<tr data-case-id="${item.id}" data-risk="${item.risk_score >= 85 ? "high" : "other"}" data-complex="${item.complexity_score >= 80 ? "complex" : "other"}" data-status="${meta.status}">
    <td><div class="case-title-cell"><strong>${escapeHtml(item.name)}</strong><span>${item.id} · ${escapeHtml(meta.customer)} · ${escapeHtml(meta.branch)}</span></div></td>
    <td><span class="tag">${item.case_type}</span></td>
    <td><span class="score-chip ${scoreTone(item.risk_score)}">${item.risk_score}</span></td>
    <td><div class="score-line"><strong>${item.complexity_score}</strong><span><i style="width:${item.complexity_score}%"></i></span></div></td>
    <td><strong>${meta.files.length}类</strong><small class="cell-sub">${meta.files.map((file) => file.type).slice(0, 3).join(" / ")}</small></td>
    <td><strong>${meta.pending.length}项</strong><small class="cell-sub">${meta.inferences.length}项模型推断</small></td>
    <td><span class="status-pill ${statusTone(meta.status)}">${meta.status}</span></td>
    <td><button class="icon-button case-detail" type="button" title="查看案件概览">${icon("panel-right-open")}</button></td>
  </tr>`;
}

function filterCases() {
  const query = $("#caseSearch").value.trim().toLowerCase();
  const risk = $("#riskFilter").value;
  const complex = $("#complexFilter").value;
  const status = $("#statusFilter").value;
  $$("#caseRows tr").forEach((row) => {
    const visible = row.textContent.toLowerCase().includes(query)
      && (risk === "all" || row.dataset.risk === risk)
      && (complex === "all" || row.dataset.complex === complex)
      && (status === "all" || row.dataset.status === status);
    row.hidden = !visible;
  });
}

function evidenceGroups(meta) {
  return { fact: meta.facts, inference: meta.inferences, pending: meta.pending };
}

function renderParsing() {
  const item = getCase();
  const meta = getMeta();
  const groups = evidenceGroups(meta);
  const currentGroup = groups[state.evidenceFilter] || groups.fact;
  const allEvidence = [...meta.facts, ...meta.inferences, ...meta.pending];
  state.selectedEvidenceId ||= allEvidence[0]?.id;
  let selected = allEvidence.find((entry) => entry.id === state.selectedEvidenceId);
  if (!selected || selected.kind !== state.evidenceFilter) {
    selected = currentGroup[0] || allEvidence[0];
    state.selectedEvidenceId = selected?.id;
  }
  if (!state.selectedFileId || !meta.files.some((file) => file.id === state.selectedFileId)) {
    state.selectedFileId = selected?.materialId || meta.files[0].id;
  }
  const activeFile = meta.files.find((file) => file.id === state.selectedFileId) || meta.files[0];
  const activeSimulation = meta.materialSimulations?.[activeFile.id];
  const parsingButtonLabel = state.parsingAnimating
    ? `${icon("loader-circle", "spin")}解析阶段 ${state.materialStage}/4`
    : `${icon("play")}${activeSimulation ? "重新解析当前材料" : "运行解析链路"}`;

  appView.innerHTML = `
    ${pageHead("多模态解析", "先把案件材料转化为可核验的事实、关系和证据缺口，再形成后续人员能力需求。", `
      <button class="button" id="addFiles">${icon("paperclip")}追加材料</button>
      <button class="button button-primary" id="runParsing" ${state.parsingAnimating ? "disabled" : ""}>${parsingButtonLabel}</button>`, `${item.id} · ${meta.customer}`)}
    <section class="case-brief-line">
      <div><span>预警摘要</span><strong>${escapeHtml(item.summary)}</strong></div>
      <dl><div><dt>材料</dt><dd>${meta.files.length}类</dd></div><div><dt>交易</dt><dd>${meta.transactionMetrics.length}项指标</dd></div><div><dt>证据锚点</dt><dd>${allEvidence.length}项</dd></div><div><dt>待核验</dt><dd>${meta.pending.length}项</dd></div></dl>
    </section>
    <section class="analysis-pipeline" aria-label="解析链路">
      ${pipelineStep("scan-line", "01", "文档智能", "OCR · 版面 · 表格")}
      ${pipelineStep("calculator", "02", "交易特征", "金额 · 频次 · 时序")}
      ${pipelineStep("brain-circuit", "03", "多模态理解", "文本 · 图像 · 流水")}
      ${pipelineStep("book-open-check", "04", "知识增强", "规则 · 案例 · 指引")}
      ${pipelineStep("git-fork", "05", "关系计算", "实体 · 图谱 · 路径")}
    </section>
    <section class="analysis-workbench">
      <aside class="material-pane">
        <header class="pane-title"><div><strong>案件材料</strong><span>${meta.files.length}类输入</span></div><span class="status-pill status-teal">来源可追溯</span></header>
        <div class="material-list">${meta.files.map((file) => `
          <button class="material-row ${file.id === activeFile.id ? "is-active" : ""}" data-file-id="${file.id}" type="button" ${state.parsingAnimating ? "disabled" : ""}>
            <span class="file-symbol">${icon(file.icon)}</span>
            <span><strong>${escapeHtml(file.name)}</strong><small>${file.type} · ${file.size}</small><em>${file.parser}</em></span>
            <b>${file.status}</b>
          </button>`).join("")}</div>
      </aside>
      <section class="evidence-stage">
        <header class="pane-title"><div><strong>${escapeHtml(activeFile.name)}</strong><span>${activeFile.parser} · ${activeFile.status}</span></div><button class="icon-button" title="查看原始文件">${icon("external-link")}</button></header>
        ${renderMaterialPreview(item, meta, activeFile, selected)}
      </section>
      <aside class="finding-pane">
        <header class="pane-title"><div><strong>案件证据轨迹</strong><span>事实、推断与核验严格分开</span></div></header>
        <div class="segment-control evidence-tabs">
          <button class="${state.evidenceFilter === "fact" ? "is-active" : ""}" data-evidence-filter="fact" type="button">已确认事实 <b>${meta.facts.length}</b></button>
          <button class="${state.evidenceFilter === "inference" ? "is-active" : ""}" data-evidence-filter="inference" type="button">模型推断 <b>${meta.inferences.length}</b></button>
          <button class="${state.evidenceFilter === "pending" ? "is-active" : ""}" data-evidence-filter="pending" type="button">待核验 <b>${meta.pending.length}</b></button>
        </div>
        <div class="finding-list">${currentGroup.map((entry) => findingRow(entry, selected?.id)).join("")}</div>
        <button class="button button-primary full-button" id="toProfile">生成案件需求画像${icon("arrow-right")}</button>
      </aside>
    </section>`;

  $$(".material-row").forEach((button) => button.addEventListener("click", () => {
    if (state.parsingAnimating) return;
    state.selectedFileId = button.dataset.fileId;
    state.materialStage = 4;
    renderParsing();
  }));
  $$("[data-linked-evidence]").forEach((button) => button.addEventListener("click", () => {
    const entry = allEvidence.find((itemEntry) => itemEntry.id === button.dataset.linkedEvidence);
    if (!entry) return;
    state.selectedEvidenceId = entry.id;
    state.evidenceFilter = entry.kind;
    renderParsing();
  }));
  $$("[data-evidence-filter]").forEach((button) => button.addEventListener("click", () => {
    state.evidenceFilter = button.dataset.evidenceFilter;
    state.selectedEvidenceId = null;
    renderParsing();
  }));
  $$(".finding-row").forEach((button) => button.addEventListener("click", () => {
    if (state.parsingAnimating) return;
    state.selectedEvidenceId = button.dataset.evidenceId;
    const entry = allEvidence.find((itemEntry) => itemEntry.id === state.selectedEvidenceId);
    if (entry) state.selectedFileId = entry.materialId;
    renderParsing();
  }));
  $("#addFiles").addEventListener("click", () => fileInput.click());
  $("#runParsing").addEventListener("click", simulateParsing);
  $("#toProfile").addEventListener("click", () => navigate(casePath("profile")));
  if (activeFile.type === "GRAPH") requestAnimationFrame(() => drawNetworkCanvas("parseNetworkCanvas", meta.network));
}

function pipelineStep(iconName, number, title, detail) {
  return `<div class="pipeline-step"><span>${icon(iconName)}</span><b>${number}</b><div><strong>${title}</strong><small>${detail}</small></div></div>`;
}

function findingRow(entry, activeId) {
  const iconName = entry.kind === "fact" ? "badge-check" : entry.kind === "inference" ? "sparkles" : "circle-help";
  return `<button class="finding-row ${entry.id === activeId ? "is-active" : ""} ${entry.kind}" data-evidence-id="${entry.id}" type="button">
    <span class="finding-icon">${icon(iconName)}</span>
    <span><em>${entry.label}</em><strong>${escapeHtml(entry.value)}</strong><small>${escapeHtml(entry.source)}</small></span>
    <b>${entry.confidence}%</b>
  </button>`;
}

        ${[
          ["07-28 09:31", "张某·6217", "华辰商贸", "¥28,630", "陌生对手入账"],
          ["07-28 09:34", "李某·8043", "华辰商贸", "¥16,300", "相近时点"],
          ["07-28 09:38", "华辰商贸", "瑞达供应链", "¥-42,000", "7分钟转出"],
          ["07-28 09:41", "王某·1986", "华辰商贸", "¥39,400", "共用设备"],
          ["07-28 09:45", "华辰商贸", "新汇科技", "¥-51,800", "固定去向"],
        ].map((row, index) => `<tr class="${index === 2 || index === 4 ? "is-highlighted" : ""}">${row.map((cell) => `<td>${cell}</td>`).join("")}</tr>`).join("")}
      </tbody></table></div>

    </div>`;
  }
  if (file.type === "GRAPH") {
    return `<div class="graph-preview"><canvas id="parseNetworkCanvas" aria-label="资金关系网络"></canvas><div class="graph-legend"><span><i class="case"></i>预警主体</span><span><i class="source"></i>资金来源</span><span><i class="target"></i>资金去向</span><span><i class="device"></i>共同特征</span></div><div class="source-anchor">${icon("route")}关系证据：<strong>${escapeHtml(selected?.value || "资金网络已形成")}</strong><span>${escapeHtml(selected?.source || "")}</span></div></div>`;
  }

        : "尽调记录显示客户将近期交易解释为新增销售渠道带来的货款，但尚未提供完整订单、物流和主要交易对手关系证明。";

function renderMaterialSimulation(item, meta, file, selected, simulation) {
  const stage = Math.min(4, Math.max(1, state.materialStage));
  const stageLabels = ["原始材料", "识别定位", "字段抽取", "证据归并"];
  return `<div class="material-simulation stage-${stage}">
    <div class="simulation-compact-status" role="status" aria-live="polite" aria-atomic="true">
      ${icon(stage === 4 ? "badge-check" : "scan-search")}
      <span>${stage === 4 ? "材料解析完成" : "正在解析材料"}</span>
      <strong>${stage === 4 ? `${simulation.fields.length}项字段 · ${simulation.mergeItems.length}项证据关联` : "模型处理中"}</strong>
    </div>
    <div class="simulation-summary">
      <span>${icon(stage === 4 ? "badge-check" : "scan-search")}当前阶段：<strong>${stageLabels[stage - 1]}</strong></span>
      <span>材料编号 ${file.id}</span>
      <span>${escapeHtml(simulation.record)}</span>
      <b>综合置信度 ${simulation.confidence}%</b>
    </div>
    <div class="simulation-body">
      <section class="raw-material-frame">
        <header><div><span>原始材料仿真</span><strong>${escapeHtml(file.name)}</strong></div><em>${file.type} · ${file.size}</em></header>
        ${renderSimulatedSource(item, meta, simulation, stage)}
      </section>
      ${renderExtractionInspector(simulation, stage, selected)}
    </div>
  </div>`;
}

function renderSimulatedSource(item, meta, simulation, stage) {
  if (simulation.kind === "transactions") return renderTransactionSource(item, simulation, stage);
  if (simulation.kind === "kyc") return renderKycSource(item, meta, simulation, stage);
  if (simulation.kind === "contract") return renderContractSource(item, simulation, stage);
  return renderInvoiceSource(item, simulation, stage);
}

function detectionClass(stage, minStage = 2) {
  return stage >= minStage ? "is-detected" : "";
}

function detectionBadge(stage, label, confidence) {
  return stage >= 2 ? `<span class="detection-badge">${label} · ${confidence}%</span>` : "";
}

function renderTransactionSource(item, simulation, stage) {
  return `<article class="simulated-sheet transaction-sheet">
    <div class="sheet-topline"><span>ICBC-BRAINS / 交易明细导出</span><b>预警编号 ${item.id}</b><em>第 114–1,438 / 4,867 行</em></div>
    <div class="transaction-file-meta">
      <div><span>账户名称</span><strong>北京华辰商贸有限公司</strong></div>
      <div><span>查询区间</span><strong>2026-05-01 至 2026-07-29</strong></div>
      <div><span>币种</span><strong>人民币 CNY</strong></div>
    </div>
    <div class="raw-table-wrap ${detectionClass(stage)}">
      ${detectionBadge(stage, "TABLE-01", 99)}
      <table class="raw-transaction-table">
        <thead><tr><th>#</th><th>交易时间</th><th>付款账户</th><th>收款账户</th><th>金额（元）</th><th>方向</th><th>模型标记</th></tr></thead>
        <tbody>${simulation.rows.map((row, index) => {
          const riskRow = index === 1 || index === 3 || index === 5;
          return `<tr class="${riskRow && stage >= 2 ? "is-ocr-hit" : ""}">
            <td>${114 + index}</td>${row.map((cell, cellIndex) => `<td class="${stage >= 3 && (cellIndex === 1 || cellIndex === 2 || cellIndex === 3) ? "is-extracted" : ""}">${escapeHtml(cell)}</td>`).join("")}
          </tr>`;
        }).join("")}</tbody>
      </table>
    </div>
    <footer class="sheet-footnote"><span>导出批次：TXN-20260729-0835</span><span>数据哈希：a831…9fd2</span><span>原始记录只读</span></footer>
  </article>`;
}

      ${escapeHtml(value)}${index === 0 || index >= 4 ? detectionBadge(stage, `FIELD-${String(index + 1).padStart(2, "0")}`, confidence) : ""}

function waitFor(milliseconds) {
  return new Promise((resolve) => setTimeout(resolve, milliseconds));
}

async function simulateParsing() {
  if (state.parsingAnimating) return;
  const caseId = state.currentCaseId;
  const fileId = state.selectedFileId;
  const meta = getMeta();
  const simulation = meta.materialSimulations?.[fileId];
  const animationGeneration = uiLogic.beginParsingAnimation(state);
  if (!simulation) {
    const button = $("#runParsing");
    button.disabled = true;
    button.innerHTML = `${icon("loader-circle", "spin")}解析中`;
    refreshIcons();
    await waitFor(900);
    if (!uiLogic.completeParsingAnimation(state, animationGeneration)) return;
    if (state.route !== "parsing" || state.currentCaseId !== caseId || state.selectedFileId !== fileId) return;
    button.disabled = false;
    button.innerHTML = `${icon("check")}解析完成`;
    refreshIcons();
    showToast("材料、交易特征、关系网络与知识检索结果已重新归并");
    return;
  }
  for (let stage = 1; stage <= 4; stage += 1) {
    if (!uiLogic.isParsingAnimationCurrent(state, animationGeneration)
      || state.route !== "parsing"
      || state.currentCaseId !== caseId
      || state.selectedFileId !== fileId) break;
    state.materialStage = stage;
    renderParsing();
    await waitFor(stage === 1 ? 520 : 760);
  }
  if (!uiLogic.completeParsingAnimation(state, animationGeneration)) return;
  if (state.route === "parsing" && state.currentCaseId === caseId && state.selectedFileId === fileId) {
    state.materialStage = 4;
    renderParsing();
    showToast("识别定位、字段抽取与跨材料证据归并已完成");
  }
}

function evidenceNetworkFinancialSummary(network) {
  const nodeById = new Map(network.nodes.map((node) => [node.id, node]));
  const caseNode = network.nodes.find((node) => node.type === "case");
  if (!caseNode) return { inflow: 0, outflow: 0, share: 0 };
  const inflow = network.edges
    .filter((edge) => edge.kind === "money" && edge.target === caseNode.id && nodeById.get(edge.source)?.type === "account")
    .reduce((total, edge) => total + edge.amount, 0);
  const outflow = network.edges
    .filter((edge) => edge.kind === "money" && edge.source === caseNode.id && nodeById.get(edge.target)?.type === "target")
    .reduce((total, edge) => total + edge.amount, 0);
  return { inflow, outflow, share: inflow ? outflow / inflow * 100 : 0 };
}

function renderEvidenceNetworkSummary(summary) {
  if (!summary.inflow && !summary.outflow) return "";
  return `<div class="network-summary-band" role="list" aria-label="资金网络摘要">
    <div role="listitem"><span>账户群入账</span><strong>${formatWanAmount(summary.inflow)}</strong></div>
    <div role="listitem"><span>固定去向</span><strong>${formatWanAmount(summary.outflow)}</strong></div>
    <div role="listitem"><span>快速转出占比</span><strong>${formatNetworkPercent(summary.share)}</strong></div>
  </div>`;
}

function formatWanAmount(amount) {
  const wan = Number(amount) / 10000;
  const digits = Number.isInteger(wan) ? 0 : 1;
  return `${wan.toFixed(digits)}万元`;
}

function formatNetworkPercent(value) {
  const number = Number(value);
  if (!Number.isFinite(number)) return "暂无可验证记录";
  return `${number.toFixed(Number.isInteger(number) ? 0 : 1)}%`;
}

function renderEvidenceNetworkHull(nodes) {
  const groupNodes = nodes.filter((node) => node.type === "account" || node.type === "aggregate");
  if (!groupNodes.length) return "";
  const xs = groupNodes.map((node) => node.position.x);
  const ys = groupNodes.map((node) => node.position.y);
  const x = Math.max(28, Math.min(...xs) - 56);
  const y = Math.max(34, Math.min(...ys) - 56);
  const right = Math.min(640, Math.max(...xs) + 56);
  const bottom = Math.min(455, Math.max(...ys) + 56);
  return `<g class="network-hull-group" aria-label="疑似同控账户群">
    <rect class="network-hull" x="${x}" y="${y}" width="${Math.max(120, right - x)}" height="${Math.max(110, bottom - y)}" rx="30"></rect>
    <text class="network-hull-label" x="${x + 18}" y="${y + 28}">疑似同控账户群</text>
  </g>`;
}

function renderEvidenceEdge(edge, nodeById, connected, selectedId, totalInflow, index) {
  const source = nodeById.get(edge.source);
  const target = nodeById.get(edge.target);
  if (!source || !target) return "";
  const highlighted = Boolean(selectedId && connected.edgeIds.has(edge.id));
  const muted = Boolean(selectedId && !highlighted);
  const relationClass = networkEdgeRelationClass(edge, source, target);
  const sourceAnchoredMoneyLabel = edge.kind === "money"
    && ["account", "aggregate"].includes(source.type)
    && target.type === "case";
  const label = edge.kind === "money"
    ? moneyEdgeLabel(edge, totalInflow, sourceAnchoredMoneyLabel)
    : String(edge.label || "");
  const title = [label, edge.anchor].filter(Boolean).join(" · ") || "关系证据";
  const share = totalInflow > 0 ? edge.amount / totalInflow : 0;
  const width = edge.kind === "money" ? Math.max(2.2, Math.min(9, 2.2 + share * 8)) : 2;
  const deltaX = target.position.x - source.position.x;
  const deltaY = target.position.y - source.position.y;
  const distance = Math.max(1, Math.hypot(deltaX, deltaY));
  const sourceInset = networkNodeRadius(source) + 3;
  const targetInset = networkNodeRadius(target) + (edge.kind === "money" ? 10 : 3);
  const startX = source.position.x + deltaX / distance * sourceInset;
  const startY = source.position.y + deltaY / distance * sourceInset;
  const endX = target.position.x - deltaX / distance * targetInset;
  const endY = target.position.y - deltaY / distance * targetInset;
  const labelX = sourceAnchoredMoneyLabel
    ? source.position.x
    : startX + (endX - startX) * .48;
  const labelY = sourceAnchoredMoneyLabel
    ? source.position.y + 63
    : startY + (endY - startY) * .48 - 9 + (index % 3 - 1) * 7;
  const pathData = `M ${startX.toFixed(2)} ${startY.toFixed(2)} L ${endX.toFixed(2)} ${endY.toFixed(2)}`;
  return `<g class="network-edge ${relationClass} ${highlighted ? "is-highlighted" : ""} ${muted ? "is-muted" : ""}" data-network-edge="${escapeHtml(edge.id)}">
    <path d="${pathData}" style="--edge-width:${width.toFixed(2)}px" ${edge.kind === "money" ? 'marker-end="url(#moneyArrow)"' : ""}><title>${escapeHtml(title)}</title></path>
    ${edge.kind === "money" ? `<path class="network-money-flow" d="${pathData}" style="--edge-width:${width.toFixed(2)}px"></path>` : ""}
    ${label ? `<text class="${sourceAnchoredMoneyLabel ? "network-account-money-label" : ""}" x="${labelX}" y="${labelY}">${escapeHtml(label)}</text>` : ""}
  </g>`;
}

function moneyEdgeLabel(edge, totalInflow, compact = false) {
  if (!(edge.amount > 0)) return String(edge.label || "");
  const amount = compact ? formatWanAmount(edge.amount).replace("万元", "万") : formatWanAmount(edge.amount);
  const share = totalInflow > 0 ? ` / ${formatNetworkPercent(edge.amount / totalInflow * 100)}` : "";
  return `${amount}${share}`;
}

function networkEdgeRelationClass(edge, source, target) {
  if (edge.kind === "money") return "money";
  const types = new Set([source.type, target.type]);
  if (types.has("unknown")) return "control pending-controller";
  if (types.has("device")) return "control device-relation";
  if (types.has("ip")) return "control ip-relation";
  if (edge.kind === "control") return "control";
  return "relation";
}

function renderEvidenceNode(node, connected, selectedId) {
  const selected = node.id === selectedId;
  const muted = Boolean(selectedId && !connected.nodeIds.has(node.id));
  const typeClass = networkNodeTypeClass(node.type);
  const label = node.label || "暂无可验证记录";
  const lines = splitNetworkNodeLabel(label, node.type);
  const radius = networkNodeRadius(node);
  return `<g class="network-node ${typeClass} ${selected ? "is-selected" : ""} ${muted ? "is-muted" : ""}" data-network-node="${escapeHtml(node.id)}" role="button" tabindex="0" focusable="true" aria-pressed="${selected}" aria-controls="networkEvidencePanel" aria-label="查看${escapeHtml(label)}证据" transform="translate(${node.position.x} ${node.position.y})">
    <circle r="${radius}"></circle>
    <foreignObject x="-12" y="-12" width="24" height="24"><div class="network-node-icon">${icon(networkNodeIcon(node.type))}</div></foreignObject>
    <text class="network-node-label" y="44">${lines.map((line, index) => `<tspan x="0" dy="${index ? 17 : 0}">${escapeHtml(line)}</tspan>`).join("")}</text>
  </g>`;
}

function networkNodeRadius(node) {
  if (node?.type === "case") return 32;
  if (node?.type === "aggregate") return 29;
  return 24;
}

function splitNetworkNodeLabel(value, type) {
  const label = String(value || "暂无可验证记录");
  const maxLength = type === "unknown" ? 10 : 18;
  if (label.length <= maxLength) return [label];
  const splitAt = Math.ceil(label.length / 2);
  return [label.slice(0, splitAt), label.slice(splitAt)];
}

function networkNodeTypeClass(type) {
  return ["case", "account", "aggregate", "device", "ip", "target", "unknown", "source", "document"].includes(type)
    ? type
    : "relation";
}

function networkNodeIcon(type) {
  const icons = {
    case: "building-2",
    account: "circle-user-round",
    aggregate: "users-round",
    device: "monitor-smartphone",
    ip: "router",
    target: "landmark",
    unknown: "circle-help",
    source: "wallet-cards",
    document: "file-text",
  };
  return icons[type] || "circle-dot";
}

function networkNodeTypeLabel(type) {
  const labels = {
    case: "预警主体",
    account: "关联账户",
    aggregate: "聚合账户",
    device: "共同设备",
    ip: "共同IP",
    target: "资金去向企业",

    source: "资金来源",

}

function renderNetworkEvidencePanel(node) {
  if (!node) {
    return `<aside class="network-evidence-panel is-empty" id="networkEvidencePanel" aria-hidden="true" hidden></aside>`;
  }
  const label = node.label || "暂无可验证记录";
  const riskTags = Array.isArray(node.riskTags) ? node.riskTags.filter(Boolean) : [];
  const metrics = Array.isArray(node.metrics) ? node.metrics.filter(Array.isArray) : [];
  return `<aside class="network-evidence-panel" id="networkEvidencePanel" aria-label="${escapeHtml(label)}证据详情" aria-live="polite">
    <header class="network-evidence-panel-head">
      <div><span>${escapeHtml(networkNodeTypeLabel(node.type))}</span><strong>${escapeHtml(label)}</strong></div>
      <button class="icon-button" id="closeNetworkEvidence" type="button" title="关闭证据详情" aria-label="关闭证据详情">${icon("x")}</button>
    </header>
    <section class="network-evidence-section identity"><h4>节点身份</h4><p><strong>${escapeHtml(label)}</strong><span>${escapeHtml(networkNodeTypeLabel(node.type))}</span></p><div class="network-risk-tags">${riskTags.length ? riskTags.map((tag) => `<span>${escapeHtml(tag)}</span>`).join("") : `<span class="is-empty">暂无可验证记录</span>`}</div></section>
    <section class="network-evidence-section"><h4>图谱角色</h4><p>${escapeHtml(node.role || "暂无可验证记录")}</p></section>
    <section class="network-evidence-section"><h4>异常指标</h4><dl>${metrics.length ? metrics.map(([metric, value]) => `<div><dt>${escapeHtml(metric || "指标")}</dt><dd>${escapeHtml(value === "" || value == null ? "暂无可验证记录" : value)}</dd></div>`).join("") : `<div><dt>指标</dt><dd>暂无可验证记录</dd></div>`}</dl></section>
    <section class="network-evidence-section"><h4>关联路径</h4>${renderNetworkEvidenceList(node.paths)}</section>
    <section class="network-evidence-section"><h4>关系证据</h4>${renderNetworkEvidenceList(node.evidence)}</section>
    <section class="network-evidence-section source"><h4>来源锚点</h4>${renderNetworkEvidenceList(node.anchors, true)}</section>
  </aside>`;
}

function renderNetworkEvidenceList(items, withIcon = false) {
  const safeItems = Array.isArray(items) ? items.filter(Boolean) : [];
  if (!safeItems.length) return `<ul><li>暂无可验证记录</li></ul>`;
  return `<ul>${safeItems.map((item) => `<li>${withIcon ? icon("paperclip") : ""}${escapeHtml(item)}</li>`).join("")}</ul>`;
}

function bindProfileNetworkInteractions() {
  $("#toggleAccountGroup")?.addEventListener("click", () => {
    state.networkExpanded = !state.networkExpanded;
    state.selectedNetworkNodeId = null;
    rerenderProfileForNetwork({ focusTarget: "toggle" });
  });

  $$('[data-network-node]').forEach((node) => {
    const activate = () => {
      state.selectedNetworkNodeId = node.dataset.networkNode;
      rerenderProfileForNetwork({
        focusTarget: "panel",
        nodeId: state.selectedNetworkNodeId,
        revealPanel: true,
      });
    };
    node.addEventListener("click", (event) => {
      event.stopPropagation();
      activate();
    });
    node.addEventListener("keydown", (event) => {
      uiLogic.handleNetworkActivationKey(event, activate);

  $("#closeNetworkEvidence")?.addEventListener("click", () => {
    const nodeId = state.selectedNetworkNodeId;
    state.selectedNetworkNodeId = null;
    rerenderProfileForNetwork({ focusTarget: "node", nodeId });

function scoreExplainGroup(type, title, finalScore, components, breakdowns, correctionReason) {
  const weights = type === "risk" ? [20, 20, 15, 20, 15, 10] : [20, 25, 20, 15, 20];
  const rawScore = components.reduce((total, [, score], index) => total + score * weights[index] / 100, 0);
  const correction = finalScore - rawScore;
  const correctionLabel = type === "risk" ? "组合校正" : "标准化校正";
  return `<section class="score-explain-group ${type}">
    <header><div><span>${type === "risk" ? "RISK SCORE" : "COMPLEXITY SCORE"}</span><strong>${title}</strong></div><b>${finalScore}</b></header>
    <div class="score-reason-list">
      ${components.map(([label, score, detail], index) => scoreReasonRow(label, score, detail, weights[index], breakdowns?.[label], type)).join("")}
    </div>
    <div class="score-calculation">
      <div><span>基础加权</span><strong>${rawScore.toFixed(1)}</strong></div>
      <i>${correction >= 0 ? "+" : "−"}</i>
      <div><span>${correctionLabel}</span><strong>${Math.abs(correction).toFixed(1)}</strong></div>
      <i>=</i>
      <div class="score-result"><span>最终得分</span><strong>${finalScore}</strong></div>
    </div>
    <p class="score-correction-note">${icon(type === "risk" ? "sparkles" : "scale")}${escapeHtml(correctionReason || "根据案件场景进行模型标准化校正")}</p>
  </section>`;
}

function scoreReasonRow(label, score, detail, weight, parts = [], type) {
  const contribution = score * weight / 100;
  const { visible, hidden } = uiLogic.partitionScoreReasons(parts);
  const shown = [...visible, ...hidden];
  return `<article class="score-reason-row">
    <header>
      <div><strong>${escapeHtml(label)}</strong><small>${escapeHtml(detail)}</small></div>
      <span><b>${score}</b><small>权重${weight}% · 贡献${contribution.toFixed(1)}</small></span>
    </header>
    <div class="score-factor-list">${shown.map(([name, points]) => `<span class="${type}">${escapeHtml(name)} <b>+${points}</b></span>`).join("")}</div>
  </article>`;
}

function demandExplainRow(key, label, value, reason = []) {
  return `<article class="demand-explain-row">
    <span class="ability-key">${key}</span>
    <div>
      <header><strong>${label}</strong><b>${value.toFixed(0)}%</b></header>
      <p>${escapeHtml(reason[0] || "根据案件类型、风险和复杂度形成")}</p>
      <small>${icon("arrow-right")}${escapeHtml(reason[1] || "用于后续人员能力匹配")}</small>
    </div>
  </article>`;
}

function demandRow(key, label, value) {
  const score = Math.max(0, Math.min(100, Number(value) || 0));
  return `<div class="demand-row">
    <span class="ability-key">${key}</span>
    <div><strong>${escapeHtml(label)}</strong><span><i style="width:${score}%"></i></span></div>
    <b>${Math.round(score)}%</b>
  </div>`;
}

function ledgerRow(status, entry, tone) {
  return `<button class="ledger-row ${tone}" type="button" data-source-id="${entry.id}"><span>${status}</span><strong>${escapeHtml(entry.value)}</strong><small>${escapeHtml(entry.source)}</small>${icon("chevron-right")}</button>`;
}

function ragStep(iconName, number, label, detail, done) {
  return `<div class="${done ? "is-done" : ""}"><span>${icon(iconName)}</span><b>${number}</b><section><strong>${label}</strong><small>${detail}</small></section>${done ? icon("check") : icon("chevron-right")}</div>`;
}

function renderAssistantAnswer(result) {
  const answer = result.answer;
  const embedding = result.model.embedding;
  const generation = result.model.generation;
  const fullyLive = Boolean(embedding.ready && generation.ready);
  const embeddingDetail = embedding.ready
    ? `${escapeHtml(embedding.model_name)} · 实时召回${modelLatency(embedding)}`
    : `离线向量召回${embedding.error ? " · 在线接口已兜底" : ""}`;
  const generationDetail = generation.ready
    ? `${escapeHtml(generation.model)} · 实时生成${modelLatency(generation)}`
    : `本地知识增强回放${generation.error ? " · 实时接口已自动兜底" : ""}`;
  return `
    <header class="assistant-answer-head">
      <div><span>GROUNDED ANSWER</span><h2>${escapeHtml(answer.title)}</h2><p>${embeddingDetail}<i>${icon("arrow-right")}</i>${generationDetail}</p></div>
      <div class="assistant-head-actions"><span class="status-pill ${fullyLive ? "status-teal" : "status-blue"}">${fullyLive ? "百炼双模型实时运行" : "离线兜底"}</span></div>
    </header>
    <article class="answer-summary">
      <div class="answer-symbol">${icon("brain-circuit")}</div>
      <div><span>AI汇总结论</span><p>${escapeHtml(answer.executive_summary).replaceAll("\n", "<br>")}</p></div>
    </article>
    <section class="answer-grid">
      <article>
        <header><span>01</span><strong>当前证据支撑</strong></header>
        <div class="answer-list">${answer.evidence_points.length ? answer.evidence_points.map((entry) => `<div><span class="answer-mark fact">${icon("badge-check")}</span><p><strong>${escapeHtml(entry.value)}</strong><small>${escapeHtml(entry.source)}</small></p></div>`).join("") : "<p class='empty-copy'>当前案件尚未形成已确认事实。</p>"}</div>
      </article>
      <article>
        <header><span>02</span><strong>关键证据缺口</strong></header>
        <div class="answer-list">${answer.gaps.map((entry) => `<div><span class="answer-mark pending">${icon("circle-help")}</span><p><strong>${escapeHtml(entry.value)}</strong><small>${escapeHtml(entry.source)}</small></p></div>`).join("")}</div>
      </article>
      <article>
        <header><span>03</span><strong>建议核验动作</strong></header>
        <ol class="action-list">${answer.actions.map((entry) => `<li>${escapeHtml(entry)}</li>`).join("")}</ol>
      </article>
      <article class="recommendation-panel">
        <header><span>04</span><strong>辅助研判建议</strong></header>
        <div class="recommendation-body"><span>${answer.recommendation.confidence}置信</span><strong>${escapeHtml(answer.recommendation.label)}</strong><small>${escapeHtml(answer.recommendation.basis)}</small></div>
      </article>
    </section>
    <footer class="citation-strip"><strong>${icon("quote")}引用来源</strong>${answer.citations.map((citation) => `<button data-knowledge-id="${citation.id}" type="button">[${citation.id}] ${escapeHtml(citation.title)}</button>`).join("")}</footer>`;
}

function renderAssistantConversation(result) {
  const caseId = result.case.id;
  const messages = state.assistantConversations[caseId] || [];
  const draft = state.assistantDrafts[caseId] || "";
  const latestAssistant = [...messages].reverse().find((entry) => entry.role === "assistant");
  const suggestions = latestAssistant?.suggestions?.length
    ? latestAssistant.suggestions
    : [
        "当前案件与正常反例的关键差异是什么？",
        "还需要补充哪项材料才能闭合证据链？",
        "哪些事实最可能改变当前辅助判断？",
      ];
  return `<section class="assistant-conversation">
    <header class="assistant-conversation-head">
      <div><span>FOLLOW-UP REVIEW</span><strong>连续研判与人工追问</strong><small>当前案件、首次研判和最近6轮对话自动带入模型上下文</small></div>
      <button class="button button-quiet" id="clearAssistantConversation" type="button" ${messages.length || draft ? "" : "disabled"}>${icon("trash-2")}清空追问</button>
    </header>
    <div class="assistant-thread" id="assistantThread">
      ${messages.length ? messages.map(renderAssistantTurn).join("") : `<div class="assistant-thread-empty"><span>${icon("messages-square")}</span><div><strong>首次研判已经形成，可继续核验思路</strong><p>追问会继续检索案例库，并保留本案事实与首次报告，不需要重复粘贴材料。</p></div></div>`}
    </div>
    <div class="assistant-suggestions">${suggestions.map((entry) => `<button type="button" data-followup-suggestion="${escapeHtml(entry)}">${escapeHtml(entry)}</button>`).join("")}</div>
    <form class="assistant-followup-form" id="assistantFollowupForm">
      <label><span>人工线索或追问</span><textarea id="assistantFollowup" maxlength="${ASSISTANT_QUESTION_MAX_LENGTH}" placeholder="输入新的线索、判断或希望AI重点比较的方向">${escapeHtml(draft)}</textarea></label>
      <button class="button button-primary" type="submit" ${state.assistantFollowupRunning ? "disabled" : ""}>${state.assistantFollowupRunning ? icon("loader-circle", "spin") + "正在检索与回答" : icon("send") + "发送追问"}</button>
    </form>
    <footer>${icon("shield-check")}模型回复只作为辅助研判；案例材料中的指令性文字不会改变系统约束。</footer>
  </section>`;
}

function renderAssistantTurn(entry) {
  if (entry.role === "user") {
    return `<article class="assistant-turn is-user"><header><span>人工线索</span><small>甄别人员输入</small></header><p>${escapeHtml(entry.content).replaceAll("\n", "<br>")}</p></article>`;
  }
  return `<article class="assistant-turn is-assistant">
    <header><span>AI补充研判</span><small>${escapeHtml(entry.evidence_type || "模型推断")} · ${entry.model?.ready ? `${escapeHtml(entry.model.model)}实时生成${modelLatency(entry.model)}` : "离线知识增强"}</small></header>
    <p>${escapeHtml(entry.content).replaceAll("\n", "<br>")}</p>
    ${entry.citations?.length ? `<div class="assistant-turn-citations"><strong>本轮引用</strong>${entry.citations.map((citation) => `<button data-knowledge-id="${citation.id}" type="button">[${citation.id}] ${escapeHtml(citation.title)}</button>`).join("")}</div>` : ""}

function renderRetrievedCases(result) {
  return `<div class="retrieved-case-list">${result.retrieval.items.map((entry, index) => {
    const item = entry.case;
    return `<button class="retrieved-case ${index === 0 ? "is-top" : ""}" data-knowledge-id="${item.id}" type="button">

      <b>${entry.scores.hybrid}</b>
      <footer><span>语义 ${entry.scores.semantic}</span><span>类型 ${entry.scores.case_type}</span><span>网络 ${entry.scores.network}</span><span>证据 ${entry.scores.evidence}</span></footer>
    </button>`;
  }).join("")}</div><div class="retrieval-formula">${escapeHtml(result.retrieval.formula)}</div>`;
}

function assistantContextPayload(caseId = getCase().id) {
  const meta = getMeta(caseId);
  return {
    customer: meta.customer,
    branch: meta.branch,
    files: meta.files.map((file) => ({ id: file.id, name: file.name, type: file.type })),
    facts: meta.facts,
    inferences: meta.inferences,
    pending: meta.pending,
  };
}

function bindAssistantAnalysis() {
  $("#assistantTask").addEventListener("change", (event) => {
    state.assistantTask = event.target.value;
    state.assistantQuestion = assistantTaskQuestions[state.assistantTask];
    renderAssistant();
  });
  $("#assistantQuestion").addEventListener("input", (event) => { state.assistantQuestion = event.target.value; });
  $("#assistantTopK").addEventListener("change", (event) => { state.assistantTopK = Number(event.target.value); });
  $("#assistantForm").addEventListener("submit", (event) => {
    event.preventDefault();
    runAssistant();
  });
  if ($("#assistantFollowupForm")) {
    $("#assistantFollowup").addEventListener("input", (event) => {
      state.assistantDrafts[getCase().id] = event.target.value;
    });
    $("#assistantFollowupForm").addEventListener("submit", (event) => {
      event.preventDefault();
      runAssistantFollowup();
    });
    $("#clearAssistantConversation").addEventListener("click", clearAssistantConversation);
    $$("[data-followup-suggestion]").forEach((button) => button.addEventListener("click", () => {
      const input = $("#assistantFollowup");
      input.value = button.dataset.followupSuggestion;
      state.assistantDrafts[getCase().id] = input.value;
      input.focus();
    }));
  }
  $$("[data-knowledge-id]").forEach((button) => button.addEventListener("click", () => showKnowledgeDrawer(button.dataset.knowledgeId)));
}

async function runAssistant() {
  const caseId = getCase().id;
  const question = assistantQuestionForSubmit(state.assistantQuestion);
  if (question === null) return;
  state.assistantQuestion = question;
  state.assistantRunning = true;
  renderAssistant();
  try {
    const response = await apiFetch("/api/assistant", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        case_id: caseId,
        mode: "report",
        task: state.assistantTask,
        question,
        context: assistantContextPayload(caseId),
        top_k: state.assistantTopK,
      }),
    });
    if (!response.ok) throw new Error((await response.json()).detail || "知识增强研判接口异常");
    state.assistantResults[caseId] = await response.json();
    state.assistantConversations[caseId] = [];
    state.assistantDrafts[caseId] = "";
    showToast("已完成历史案例检索与知识增强研判");
  } catch (error) {
    showToast(assistantFailureMessage(error), true);
  } finally {
    state.assistantRunning = false;
    renderAssistant();
  }
}

function assistantConversationHistory(caseId) {
  const result = state.assistantResults[caseId];
  if (!result) return [];
  const initial = [
    { role: "user", content: result.question },
    { role: "assistant", content: result.answer.executive_summary },
  ];
  const followUps = (state.assistantConversations[caseId] || []).map((entry) => ({
    role: entry.role,
    content: entry.content,
  }));
  return [...initial, ...followUps].slice(-12);
}

async function runAssistantFollowup() {
  const caseId = getCase().id;
  const question = assistantQuestionForSubmit(
    state.assistantDrafts[caseId],
    "请输入需要AI分析的线索或问题",
  );
  if (question === null) return;
  const result = state.assistantResults[caseId];
  const payload = {
    case_id: caseId,
    mode: "follow_up",
    task: state.assistantTask,
    question,
    context: assistantContextPayload(caseId),
    top_k: 3,
    history: assistantConversationHistory(caseId),
    pinned_case_ids: result.answer.citations.map((entry) => entry.id),
  };
  state.assistantFollowupRunning = true;
  renderAssistant();
  try {
    const response = await apiFetch("/api/assistant", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!response.ok) throw new Error((await response.json()).detail || "连续研判接口异常");
    const followUp = await response.json();
    state.assistantConversations[caseId] = [
      ...(state.assistantConversations[caseId] || []),
      { role: "user", content: question },
      {
        role: "assistant",
        content: followUp.reply.reply,
        evidence_type: followUp.reply.evidence_type,
        citations: followUp.reply.citations,
        suggestions: followUp.reply.suggestions,
        model: followUp.model.generation,
      },
    ];
    state.assistantDrafts[caseId] = "";
    showToast("AI已结合当前案件与案例库完成补充研判");
  } catch (error) {
    showToast(assistantFailureMessage(error), true);
  } finally {
    state.assistantFollowupRunning = false;
    renderAssistant();
  }
}

function clearAssistantConversation() {
  const caseId = getCase().id;
  state.assistantConversations[caseId] = [];
  state.assistantDrafts[caseId] = "";
  renderAssistant();

    $("#knowledgeSearch").addEventListener("input", filterKnowledgeCases);

    $("#knowledgeConclusion").addEventListener("change", filterKnowledgeCases);
    $$(".knowledge-card").forEach((button) => button.addEventListener("click", () => showKnowledgeDrawer(button.dataset.knowledgeId)));
  }
}

async function loadKnowledgeCases() {
  state.knowledgeLoading = true;
  renderAssistant();
  try {
    const response = await apiFetch("/api/knowledge-cases");
    if (!response.ok) throw new Error("案例知识库接口异常");
    state.knowledgeCases = (await response.json()).items;
  } catch (error) {
    showToast(error.message, true);
  } finally {
    state.knowledgeLoading = false;
    if (state.route === "assistant" && state.assistantTab === "knowledge") renderAssistant();
  }
}

function filterKnowledgeCases() {
  const query = $("#knowledgeSearch").value.trim().toLowerCase();
  const type = $("#knowledgeType").value;
  const conclusion = $("#knowledgeConclusion").value;
  $$(".knowledge-card").forEach((card) => {
    card.hidden = !(
      card.textContent.toLowerCase().includes(query)
      && (type === "all" || card.dataset.type === type)
      && (conclusion === "all" || card.dataset.conclusion === conclusion)
    );
  });
}

function findKnowledgeCase(knowledgeId) {
  const resultItem = Object.values(state.assistantResults)
    .flatMap((result) => result.retrieval.items)
    .find((entry) => entry.case.id === knowledgeId)?.case;
  return state.knowledgeCases?.find((item) => item.id === knowledgeId) || resultItem;
}

function renderMatchPipeline(result) {
